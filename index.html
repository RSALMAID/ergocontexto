<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142b40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ErgoContexto">
  <title>ErgoContexto</title>

  https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.jsscript>

  <style>
    :root {
      --navy: #142b40;
      --orange: #df652b;
      --bg: #f2f5f8;
      --muted: #607080;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 25px 20px;
    }

    header h1 { margin: 0; font-size: 25px; }
    header p { margin-bottom: 0; font-size: 13px; opacity: .85; }

    main {
      max-width: 760px;
      margin: auto;
      padding: 18px 16px 120px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px #142b4009;
    }

    h2 { font-size: 21px; margin-top: 0; }
    h3 { font-size: 17px; }
    p { line-height: 1.5; }
    .small { font-size: 13px; color: var(--muted); }

    .notice {
      background: #fff4e7;
      border-left: 4px solid var(--orange);
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5de;
      border-radius: 10px;
      background: white;
      font: 16px Arial;
      color: var(--navy);
    }

    textarea { min-height: 85px; resize: vertical; }

    button {
      border: 0;
      border-radius: 11px;
      padding: 14px 17px;
      font: bold 15px Arial;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: default; }

    .primary { background: var(--orange); color: white; }
    .secondary { background: #e8eef3; color: var(--navy); }
    .danger { background: #ffeded; color: #a72c2c; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .actions button { flex: 1; }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: white;
      border-top: 1px solid #dbe2e9;
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      z-index: 10;
    }

    nav button {
      flex: 1;
      background: white;
      color: var(--muted);
      font-size: 13px;
      padding: 13px 5px;
    }

    nav button.active {
      color: var(--orange);
      background: #fff3eb;
    }

    .progress {
      height: 7px;
      background: #e4eaf0;
      border-radius: 9px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress div { height: 100%; background: var(--orange); }

    .option {
      display: block;
      text-align: left;
      width: 100%;
      margin: 9px 0;
      background: #f2f5f8;
      border: 2px solid transparent;
      font-weight: normal;
    }

    .option.selected {
      border-color: var(--orange);
      background: #fff3eb;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      background: #eaf0f5;
      border-radius: 8px;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      padding: 15px;
      background: #f2f5f8;
      border-radius: 12px;
    }

    .metric strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .hidden { display: none; }

    #status {
      position: fixed;
      top: 12px;
      left: 15px;
      right: 15px;
      background: #142b40;
      color: white;
      padding: 15px;
      border-radius: 12px;
      z-index: 99;
      box-shadow: 0 3px 15px #0003;
    }
  </style>
</head>

<body>
  <header>
    <h1>ErgoContexto</h1>
    <p>Condições de trabalho • Ergonomia • Fatores humanos</p>
  </header>

  <div id="status" class="hidden" role="status"></div>
  <main id="app"></main>

  <nav>
    <button id="nav-home" onclick="home()">Início</button>
    <button id="nav-new" onclick="start()">Avaliação</button>
    <button id="nav-history" onclick="historyView()">Histórico</button>
    <button id="nav-backup" onclick="backupView()">Backup</button>
  </nav>

  <script>
    'use strict';

    const VERSION = '1.0';
    const DRAFT = 'ergocontexto-rascunho-v1';

    const questions = [
      ['Posturas',
       'A atividade exige manter o tronco inclinado ou torcido?',
       ['Não', 'Em algumas etapas', 'Na maior parte', 'Não observado']],

      ['Posturas',
       'Exige trabalhar com braços elevados ou afastados do corpo?',
       ['Não', 'Em algumas etapas', 'Na maior parte', 'Não observado']],

      ['Movimentos',
       'Exige movimentos repetidos de mãos ou braços?',
       ['Não', 'Intercalados com outras tarefas', 'Predominantes', 'Não observado']],

      ['Esforço',
       'Exige aplicação de força manual?',
       ['Não', 'Com auxílio disponível', 'Sem auxílio adequado', 'Não observado']],

      ['Cargas',
       'Há levantamento ou transporte manual de materiais?',
       ['Não', 'Com auxílio', 'Sem auxílio', 'Não observado']],

      ['Cargas',
       'Há empurrar ou puxar cargas?',
       ['Não', 'Com recurso adequado', 'Com dificuldade relatada ou observada', 'Não observado']],

      ['Posto',
       'O posto permite ajustar altura, alcance e posição?',
       ['Sim', 'Parcialmente', 'Não', 'Não se aplica']],

      ['Posturas',
       'É possível alternar posições e movimentos?',
       ['Sim', 'Parcialmente', 'Não', 'Não observado']],

      ['Ferramentas',
       'As ferramentas são adequadas ao espaço e à tarefa?',
       ['Sim', 'Parcialmente', 'Não', 'Não observado']],

      ['Recuperação',
       'Existem pausas ou períodos de recuperação previstos e praticados?',
       ['Sim', 'Apenas previstos', 'Não', 'Não informado']],

      ['Organização',
       'O ritmo permite executar todas as etapas previstas?',
       ['Sim', 'Nem sempre', 'Não', 'Não informado']],

      ['Organização',
       'O prazo disponível é compatível com a atividade?',
       ['Sim', 'Nem sempre', 'Não', 'Não informado']],

      ['Demandas cognitivas',
       'Existem interrupções em etapas que exigem concentração?',
       ['Não', 'Ocasionalmente', 'Frequentemente', 'Não observado']],

      ['Demandas cognitivas',
       'É necessário acompanhar várias fontes de informação simultaneamente?',
       ['Não', 'Em algumas etapas', 'Na maior parte', 'Não observado']],

      ['Informação',
       'Comandos, alarmes e informações são claros e distinguíveis?',
       ['Sim', 'Parcialmente', 'Não', 'Não se aplica']],

      ['Orientações',
       'As orientações correspondem às condições reais de execução?',
       ['Sim', 'Parcialmente', 'Não', 'Não verificado']],

      ['Organização',
       'As responsabilidades e prioridades estão claras?',
       ['Sim', 'Parcialmente', 'Não', 'Não informado']],

      ['Comunicação',
       'A comunicação permite confirmar informações críticas?',
       ['Sim', 'Parcialmente', 'Não', 'Não se aplica']],

      ['Recuperação',
       'Jornada, horas extras e intervalos permitem recuperação entre períodos de trabalho?',
       ['Condições adequadas relatadas', 'Dificuldades relatadas', 'Não informado', 'Requer análise']],

      ['Ambiente',
       'Ruído, iluminação, temperatura ou vibração dificultam a execução?',
       ['Não', 'Um fator', 'Vários fatores', 'Requer medição']]
    ];

    const fields = [
      ['unit', 'Unidade'],
      ['area', 'Área / gerência'],
      ['place', 'Local'],
      ['activity', 'Atividade *'],
      ['role', 'Função *'],
      ['participant', 'Participante (opcional)'],
      ['assessor', 'Avaliador *'],
      ['date', 'Data *'],
      ['shift', 'Turno'],
      ['duration', 'Duração da atividade'],
      ['frequency', 'Frequência de execução'],
      ['workers', 'Quantidade de trabalhadores expostos'],
      ['equipment', 'Equipamentos / ferramentas']
    ];

    let db = null;
    let record = null;
    let step = 0;
    let current = null;
    let busy = false;

    const app = document.getElementById('app');

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&',
        '<': '<',
        '>': '>',
        '"': '"',
        "'": '''
      }[char]));
    }

    function msg(text) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.classList.remove('hidden');
      clearTimeout(msg.timer);
      msg.timer = setTimeout(() => el.classList.add('hidden'), 6500);
    }

    function nav(name) {
      document.querySelectorAll('nav button').forEach(button => {
        button.classList.toggle('active', button.id === 'nav-' + name);
      });
    }

    function dateText(value) {
      return new Date(value).toLocaleString('pt-BR');
    }

    function today() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function makeId() {
      if (window.crypto && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return 'ec-' + Date.now().toString(36) + '-' +
        Math.random().toString(36).slice(2, 12);
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('ErgoContexto', 1);

        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains('evaluations')) {
            database.createObjectStore('evaluations', { keyPath: 'id' });
          }
        };

        request.onsuccess = () => {
          db = request.result;
          db.onversionchange = () => db.close();
          resolve();
        };

        request.onerror = () => reject(request.error);
        request.onblocked = () => msg('Feche outras abas deste aplicativo.');
      });
    }

    function store(mode, operation) {
      return new Promise((resolve, reject) => {
        if (!db) {
          reject(new Error('Banco local indisponível.'));
          return;
        }

        const tx = db.transaction('evaluations', mode);
        const request = operation(tx.objectStore('evaluations'));
        let value;

        request.onsuccess = () => { value = request.result; };
        tx.oncomplete = () => resolve(value);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(
          tx.error || new Error('Operação interrompida.')
        );
      });
    }

    const all = () => store('readonly', s => s.getAll());
    const put = value => store('readwrite', s => s.put(value));
    const get = id => store('readonly', s => s.get(id));

    function saveDraft() {
      if (!record) return;

      try {
        const { pdf, ...draftRecord } = record;
        localStorage.setItem(DRAFT, JSON.stringify({
          record: draftRecord,
          step
        }));
      } catch (error) {
        msg('Não foi possível salvar o rascunho. Verifique o armazenamento.');
      }
    }

    function loadDraft() {
      try {
        const data = JSON.parse(localStorage.getItem(DRAFT) || 'null');
        if (!data || !data.record || !data.record.header ||
            !Array.isArray(data.record.answers) ||
            data.record.answers.length !== questions.length) {
          return null;
        }
        return data;
      } catch (error) {
        return null;
      }
    }

    async function home() {
      if (busy) return;
      nav('home');

      let list = [];
      try {
        list = await all();
      } catch (error) {
        msg('Armazenamento local indisponível.');
      }

      app.innerHTML = `
        <section class="card">
          <span class="badge">TRIAGEM DAS CONDIÇÕES DE TRABALHO</span>
          <h2 style="margin-top:18px">
            Conhecer a atividade.<br>Identificar melhorias.
          </h2>
          <p>Entrevista e observação, sem nota de desempenho individual.</p>

          <div class="actions">
            <button class="primary" onclick="start()">Nova avaliação</button>
          </div>

          ${loadDraft() ? `
            <div class="actions">
              <button class="secondary" onclick="resume()">
                Continuar rascunho
              </button>
            </div>` : ''}
        </section>

        <section class="card">
          <div class="grid">
            <div class="metric">
              <strong>${list.length}</strong>Avaliações salvas
            </div>
            <div class="metric">
              <strong>20</strong>Perguntas por avaliação
            </div>
          </div>
        </section>

        <div class="notice">
          Instrumento original de triagem.
          Não é aplicação integral do Déparis, diagnóstico clínico,
          preditor validado, AET ou liberação da atividade.
          Use dados fictícios nos testes.
          Dados reais dependem de autorização e proteção adequadas.
        </div>

        <p class="small">
          Versão ${VERSION}.
          O PDF depende do carregamento da biblioteca pela internet.
          Histórico local não equivale a backup.
        </p>`;
    }

    function start() {
      if (busy) return;

      if (loadDraft() &&
          !confirm('Existe um rascunho. Substituir por uma nova avaliação?')) {
        return;
      }

      record = {
        id: makeId(),
        version: VERSION,
        created: new Date().toISOString(),
        header: {
          date: today(),
          source: 'Entrevista e observação'
        },
        answers: questions.map(() => ({
          choice: null,
          note: '',
          action: ''
        })),
        summary: '',
        owner: '',
        deadline: ''
      };

      step = 0;
      saveDraft();
      headerView();
    }

    function resume() {
      if (busy) return;
      const draft = loadDraft();
      if (!draft) return start();

      record = draft.record;
      step = Math.max(
        0,
        Math.min(questions.length, Number(draft.step) || 0)
      );

      if (step === 0) headerView();
      else questionView();
    }

    function headerView() {
      nav('new');

      app.innerHTML = `
        <section class="card">
          <h2>Identificação</h2>
          <p class="small">Campos com * são obrigatórios.</p>

          <form id="headerForm">
            ${fields.map(([key, label]) => `
              <label for="${key}">${label}</label>
              <input
                id="${key}"
                name="${key}"
                type="${key === 'date' ? 'date' :
                        key === 'workers' ? 'number' : 'text'}"
                ${key === 'workers' ? 'min="1" step="1"' : ''}
                value="${esc(record.header[key])}"
                ${['activity', 'role', 'assessor', 'date'].includes(key)
                  ? 'required' : ''}
              >
            `).join('')}

            <label for="description">Descrição das etapas</label>
            <textarea id="description" name="description">${esc(
              record.header.description
            )}</textarea>

            <label for="source">Origem das informações</label>
            <select id="source" name="source">
              ${[
                'Entrevista e observação',
                'Entrevista',
                'Observação'
              ].map(source => `
                <option ${
                  record.header.source === source ? 'selected' : ''
                }>${source}</option>
              `).join('')}
            </select>

            <div class="actions">
              <button type="submit" class="primary">
                Iniciar perguntas
              </button>
            </div>
          </form>
        </section>`;

      const form = document.getElementById('headerForm');

      function updateHeader() {
        record.header = Object.fromEntries(new FormData(form));
        saveDraft();
      }

      form.addEventListener('input', updateHeader);
      form.addEventListener('change', updateHeader);

      form.onsubmit = event => {
        event.preventDefault();
        record.header = Object.fromEntries(new FormData(form));

        for (const key of ['activity', 'role', 'assessor']) {
          record.header[key] = record.header[key].trim();
          if (!record.header[key]) {
            msg('Preencha os campos obrigatórios.');
            return;
          }
        }

        step = 1;
        saveDraft();
        questionView();
        window.scrollTo(0, 0);
      };
    }

    function questionView() {
      nav('new');

      const index = step - 1;
      const question = questions[index];
      const answer = record.answers[index];

      app.innerHTML = `
        <section class="card">
          <span class="badge">${esc(question[0])}</span>
          <p class="small">Pergunta ${step} de ${questions.length}</p>

          <div class="progress">
            <div style="width:${step / questions.length * 100}%"></div>
          </div>

          <h2>${esc(question[1])}</h2>

          ${question[2].map((option, j) => `
            <button
              class="option ${answer.choice === j ? 'selected' : ''}"
              aria-pressed="${answer.choice === j}"
              onclick="choose(${j})"
            >${esc(option)}</button>
          `).join('')}

          <label for="note">Evidência / etapa afetada</label>
          <textarea id="note"
            placeholder="Registre o que foi observado ou relatado."
          >${esc(answer.note)}</textarea>

          <label for="action">Melhoria sugerida</label>
          <textarea id="action"
            placeholder="Descreva a melhoria, quando aplicável."
          >${esc(answer.action)}</textarea>

          <div class="actions">
            <button class="secondary" onclick="previous()">Voltar</button>
            <button class="primary" onclick="next()">
              ${step === questions.length ? 'Revisar' : 'Próxima'}
            </button>
          </div>
        </section>

        <p class="small">
          Rascunho salvo neste navegador. Não equivale a backup.
        </p>`;

      document.getElementById('note').oninput = event => {
        answer.note = event.target.value;
        saveDraft();
      };

      document.getElementById('action').oninput = event => {
        answer.action = event.target.value;
        saveDraft();
      };
    }

    function choose(choice) {
      record.answers[step - 1].choice = choice;
      saveDraft();
      questionView();
    }

    function previous() {
      step--;
      saveDraft();
      if (step === 0) headerView();
      else questionView();
      window.scrollTo(0, 0);
    }

    function next() {
      if (record.answers[step - 1].choice === null) {
        msg('Selecione uma opção.');
        return;
      }

      if (step === questions.length) {
        review();
      } else {
        step++;
        saveDraft();
        questionView();
      }

      window.scrollTo(0, 0);
    }

    function category(index, answer) {
      const text = questions[index][2][answer.choice];

      if (answer.choice === null || [
        'Não observado',
        'Não informado',
        'Não verificado',
        'Requer análise',
        'Requer medição'
      ].includes(text)) {
        return 'Informação insuficiente / aprofundar';
      }

      if (text === 'Não se aplica') return 'Não se aplica';

      if (answer.choice === 0) {
        return 'Sem dificuldade sinalizada nesta resposta';
      }

      return 'Condição a examinar';
    }

    function review() {
      app.innerHTML = `
        <section class="card">
          <h2>Revisão da avaliação</h2>

          <p>
            <strong>${esc(record.header.activity)}</strong><br>
            ${esc(record.header.area)} • ${esc(record.header.role)}
          </p>

          <div class="notice">
            As categorias organizam respostas.
            Não representam nível de risco validado.
            Ausência de dificuldade relatada não comprova ausência de risco.
          </div>

          ${record.answers.map((answer, index) => `
            <p>
              <strong>
                ${index + 1}. ${esc(questions[index][1])}
              </strong><br>
              ${esc(questions[index][2][answer.choice])}<br>
              <span class="small">${esc(category(index, answer))}</span>
            </p>
          `).join('')}

          <label for="summary">Síntese e necessidade de aprofundamento</label>
          <textarea id="summary">${esc(record.summary)}</textarea>

          <label for="owner">Responsável pelo acompanhamento</label>
          <input id="owner" value="${esc(record.owner)}">

          <label for="deadline">Prazo de acompanhamento</label>
          <input id="deadline" type="date" value="${esc(record.deadline)}">

          <div class="actions">
            <button class="secondary" onclick="questionView()">Voltar</button>
            <button class="primary" id="finish" onclick="finish()">
              Salvar avaliação e PDF
            </button>
          </div>
        </section>`;

      ['summary', 'owner', 'deadline'].forEach(key => {
        document.getElementById(key).oninput = event => {
          record[key] = event.target.value;
          saveDraft();
        };
      });
    }

    function buildPDF(value) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        throw new Error(
          'Biblioteca PDF indisponível. Conecte à internet e recarregue. ' +
          'Seu rascunho permanece salvo.'
        );
      }

      const doc = new window.jspdf.jsPDF();
      let y = 22;

      function line(text, size = 10, bold = false) {
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        doc.setFontSize(size);

        const lines = doc.splitTextToSize(String(text || ''), 174);

        for (const item of lines) {
          if (y > 275) {
            doc.addPage();
            y = 22;
          }
          doc.text(item, 18, y);
          y += size * .48 + 1.5;
        }
        y += 3;
      }

      line('ErgoContexto', 22, true);
      line('Relatório de triagem das condições de trabalho', 12, true);
      line('ID: ' + value.id + ' | Versão: ' + value.version);
      line('Registro: ' + dateText(value.created));

      line(
        'Instrumento original de triagem, não validado como preditor. ' +
        'Não é aplicação integral do Déparis. Não substitui análise ' +
        'ergonômica especializada, diagnóstico clínico ou avaliação de segurança.'
      );

      line('IDENTIFICAÇÃO', 13, true);

      fields.forEach(([key, label]) => {
        line(
          label.replace(' *', '') + ': ' +
          (value.header[key] || 'Não informado')
        );
      });

      line(
        'Descrição das etapas: ' +
        (value.header.description || 'Não informado')
      );

      line('Origem: ' + (value.header.source || 'Não informado'));
      line('RESPOSTAS E EVIDÊNCIAS', 13, true);

      value.answers.forEach((answer, index) => {
        line((index + 1) + '. ' + questions[index][1], 11, true);
        line('Resposta: ' + questions[index][2][answer.choice]);
        line('Organização da resposta: ' + category(index, answer));
        line('Evidência: ' + (answer.note || 'Não registrada'));
        line('Melhoria sugerida: ' + (answer.action || 'Não registrada'));
      });

      line('ACOMPANHAMENTO', 13, true);
      line('Síntese: ' + (value.summary || 'Não registrada'));
      line('Responsável: ' + (value.owner || 'Não definido'));
      line('Prazo: ' + (value.deadline || 'Não definido'));

      line(
        'Categorias descritivas, sem pontuação científica. ' +
        'Informação insuficiente não é ausência de risco.'
      );

      const pages = doc.getNumberOfPages();

      for (let page = 1; page <= pages; page++) {
        doc.setPage(page);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.text('ErgoContexto | ' + page + ' / ' + pages, 18, 289);
      }

      return doc.output('blob');
    }

    async function finish() {
      if (busy) return;

      if (record.answers.some(answer => answer.choice === null)) {
        msg('Responda todas as perguntas antes de finalizar.');
        return;
      }

      busy = true;
      const button = document.getElementById('finish');
      button.disabled = true;
      button.textContent = 'Salvando...';

      try {
        const finishedRecord = {
          ...record,
          pdf: buildPDF(record),
          finished: new Date().toISOString()
        };

        await put(finishedRecord);
        current = finishedRecord;
        record = null;

        try {
          localStorage.removeItem(DRAFT);
        } catch (error) {}

        resultView();
        msg('Avaliação e PDF salvos no banco local.');
      } catch (error) {
        msg(error.message || 'Falha ao salvar. O rascunho foi mantido.');
        button.disabled = false;
        button.textContent = 'Salvar avaliação e PDF';
      } finally {
        busy = false;
      }
    }

    function resultView() {
      nav('history');

      app.innerHTML = `
        <section class="card">
          <span class="badge">REGISTRO SALVO LOCALMENTE</span>
          <h2 style="margin-top:15px">${esc(current.header.activity)}</h2>

          <p>
            ${esc(current.header.role)}<br>
            ${esc(dateText(current.created))}
          </p>

          <div class="actions">
            <button class="primary" onclick="exportPDF()">Exportar PDF</button>
            <button class="secondary" onclick="openPDF()">Abrir PDF</button>
          </div>

          <p class="small">
            O PDF fica no banco local deste navegador.
            Exporte para Arquivos e faça backup para proteção contra perda.
          </p>
        </section>

        <section class="card">
          <h3>Síntese</h3>
          <p>${esc(current.summary || 'Não registrada.')}</p>
          <p class="small">
            Responsável: ${esc(current.owner || 'Não definido')}<br>
            Prazo: ${esc(current.deadline || 'Não definido')}
          </p>
        </section>

        <div class="actions">
          <button class="secondary" onclick="historyView()">
            Voltar ao histórico
          </button>
        </div>`;
    }

    function download(blob, name) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');

      anchor.href = url;
      anchor.download = name;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();

      setTimeout(() => URL.revokeObjectURL(url), 120000);
    }

    async function exportPDF() {
      if (!current || !(current.pdf instanceof Blob)) {
        msg('PDF não encontrado neste registro.');
        return;
      }

      const file = new File(
        [current.pdf],
        'ErgoContexto-' + current.id.slice(0, 8) + '.pdf',
        { type: 'application/pdf' }
      );

      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Relatório ErgoContexto'
          });
        } else {
          download(file, file.name);
        }
      } catch (error) {
        if (error.name !== 'AbortError') {
          download(file, file.name);
          msg('Compartilhamento indisponível. Download solicitado.');
        }
      }
    }

    function openPDF() {
      if (!current || !(current.pdf instanceof Blob)) {
        msg('PDF não encontrado neste registro.');
        return;
      }

      const url = URL.createObjectURL(current.pdf);
      const anchor = document.createElement('a');

      anchor.href = url;
      anchor.target = '_blank';
      anchor.rel = 'noopener';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();

      setTimeout(() => URL.revokeObjectURL(url), 120000);
    }

    async function historyView() {
      if (busy) return;
      nav('history');

      try {
        const list = (await all()).sort(
          (a, b) => b.created.localeCompare(a.created)
        );

        app.innerHTML = `
          <section class="card">
            <h2>Histórico local</h2>
            <p class="small">Registros neste navegador e dispositivo.</p>
          </section>` +
          (list.length ? list.map(value => `
            <section class="card">
              <h3>${esc(value.header.activity)}</h3>
              <p class="small">
                ${esc(value.header.area)} • ${esc(value.header.role)}<br>
                ${esc(dateText(value.created))}
              </p>

              <div class="actions">
                <button class="primary" data-open="${esc(value.id)}">
                  Abrir
                </button>
                <button class="danger" data-delete="${esc(value.id)}">
                  Excluir
                </button>
              </div>
            </section>
          `).join('') : `
            <section class="card">
              <p>Nenhuma avaliação finalizada.</p>
            </section>`);

        app.querySelectorAll('[data-open]').forEach(button => {
          button.onclick = () => showRecord(button.dataset.open);
        });

        app.querySelectorAll('[data-delete]').forEach(button => {
          button.onclick = () => removeRecord(button.dataset.delete);
        });
      } catch (error) {
        msg('Não foi possível carregar o histórico.');
      }
    }

    async function showRecord(id) {
      try {
        current = await get(id);
        if (current) resultView();
        else msg('Registro não encontrado.');
      } catch (error) {
        msg('Falha ao abrir registro.');
      }
    }

    async function removeRecord(id) {
      if (!confirm('Excluir esta avaliação e seu PDF local?')) return;

      try {
        await store('readwrite', s => s.delete(id));
        if (current && current.id === id) current = null;
        await historyView();
      } catch (error) {
        msg('Falha ao excluir.');
      }
    }

    function backupView() {
      if (busy) return;
      nav('backup');

      app.innerHTML = `
        <section class="card">
          <h2>Backup e restauração</h2>

          <p>
            O backup contém respostas e identificação.
            Guarde em local autorizado e protegido.
          </p>

          <div class="notice">
            Armazenamento local não é backup.
            Limpar os dados do navegador ou trocar de dispositivo pode
            causar perda dos registros.
            Este protótipo não implementa criptografia própria
            ou controle de acesso.
          </div>

          <div class="actions">
            <button class="primary" onclick="exportBackup()">
              Exportar backup
            </button>
          </div>

          <label for="import">Restaurar backup JSON</label>
          <input id="import" type="file" accept=".json,application/json">

          <p class="small">
            Na restauração, os PDFs são regenerados.
            A biblioteca PDF precisa estar carregada.
            Registros com o mesmo ID são substituídos.
          </p>
        </section>`;

      document.getElementById('import').onchange = importBackup;
    }

    async function exportBackup() {
      try {
        const rows = await all();
        const records = rows.map(({ pdf, ...rest }) => rest);

        const file = new File(
          [JSON.stringify({
            app: 'ErgoContexto',
            version: VERSION,
            records
          }, null, 2)],
          'ErgoContexto-backup-' + today() + '.json',
          { type: 'application/json' }
        );

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Backup ErgoContexto'
            });
          } catch (error) {
            if (error.name !== 'AbortError') download(file, file.name);
          }
        } else {
          download(file, file.name);
        }
      } catch (error) {
        msg('Falha ao exportar backup.');
      }
    }

    function validRecord(value) {
      return value &&
        typeof value.id === 'string' &&
        /^[a-zA-Z0-9-]{1,100}$/.test(value.id) &&
        value.version === VERSION &&
        typeof value.created === 'string' &&
        !isNaN(Date.parse(value.created)) &&
        value.header &&
        typeof value.header === 'object' &&
        !Array.isArray(value.header) &&
        typeof value.header.activity === 'string' &&
        Object.values(value.header).every(
          item => typeof item === 'string'
        ) &&
        ['summary', 'owner', 'deadline'].every(
          key => typeof value[key] === 'string'
        ) &&
        Array.isArray(value.answers) &&
        value.answers.length === questions.length &&
        value.answers.every((answer, index) =>
          answer &&
          Number.isInteger(answer.choice) &&
          answer.choice >= 0 &&
          answer.choice < questions[index][2].length &&
          typeof answer.note === 'string' &&
          typeof answer.action === 'string'
        );
    }

    async function importBackup(event) {
      if (busy) return;

      try {
        const file = event.target.files[0];
        if (!file) return;

        if (file.size > 10000000) {
          throw new Error('Backup maior que o limite de 10 MB.');
        }

        const data = JSON.parse(await file.text());

        if (
          data.app !== 'ErgoContexto' ||
          data.version !== VERSION ||
          !Array.isArray(data.records) ||
          !data.records.every(validRecord)
        ) {
          throw new Error('Backup inválido ou de versão incompatível.');
        }

        if (!confirm(
          'Restaurar ' + data.records.length +
          ' registros? IDs existentes serão substituídos.'
        )) return;

        busy = true;

        const prepared = data.records.map(value => ({
          id: value.id,
          version: value.version,
          created: value.created,
          finished: value.finished || value.created,
          header: value.header,
          answers: value.answers,
          summary: value.summary,
          owner: value.owner,
          deadline: value.deadline,
          pdf: buildPDF(value)
        }));

        await new Promise((resolve, reject) => {
          const tx = db.transaction('evaluations', 'readwrite');
          const objectStore = tx.objectStore('evaluations');

          prepared.forEach(value => objectStore.put(value));

          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });

        busy = false;
        await historyView();
        msg('Backup restaurado.');
      } catch (error) {
        msg(error.message || 'Falha na restauração.');
      } finally {
        busy = false;
      }
    }

    initDB().then(home).catch(() => {
      app.innerHTML = `
        <section class="card">
          <h2>Armazenamento indisponível</h2>
          <p>
            Abra em navegação normal e verifique as permissões do navegador.
            Não preencha avaliações até resolver.
          </p>
        </section>`;

      document.querySelectorAll('nav button').forEach(button => {
        button.disabled = true;
      });
    });
  </script>
</body>
</html>
