<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light">
<title>ErgoContexto — Gestão ergonômica e AET</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* paleta ErgoContexto: laranja #FF9900, vermelho #FF3300, cinza #666, azul #01688A, azul-escuro #003352, cinza-claro #D3D3D3 */
  --verde:#003352;--verde2:#01688A;--laranja:#FF9900;--vermelho:#FF3300;
  --bg:#f2f2f2;--card:#fff;--tx:#2a2a2a;--mut:#666666;--bd:#d3d3d3;--soft:#f6f6f6;--fig:#444444;
  --r:16px;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.07);
  --n0:#01688A;--n0b:#e1f0f6;--n0t:#00455c;
  --n1:#FF9900;--n1b:#fff0d6;--n1t:#7a4a00;
  --n2:#FF3300;--n2b:#ffe0d8;--n2t:#8a1c00;
  --n3:#b01e00;--n3b:#f9d4cc;--n3t:#6b1200;
  --nd:#9a9a9a;--ndb:#ececec;--ndt:#555555;
}
@media not all{
  :root{
    --bg:#0e1517;--card:#172125;--tx:#e8eeec;--mut:#9fb0ab;--bd:#2a383d;--soft:#1d292e;--fig:#cfdcd8;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --n0b:#153a26;--n0t:#9be3b5;--n1b:#3d3300;--n1t:#ffe083;--n2b:#4a2410;--n2t:#ffc49a;--n3b:#4a1515;--n3t:#ffb3b3;
    --ndb:#2a3438;--ndt:#b0bec5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px;scroll-padding-bottom:100px}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-feature-settings:"cv11","ss01";letter-spacing:-.005em;background:var(--bg);color:var(--tx);line-height:1.45}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .4em}
h2{font-size:1.25rem}h3{font-size:1.05rem}h4{font-size:1rem}
p{margin:.4em 0}
small,.mut{color:var(--mut)}
button{font:inherit;cursor:pointer}
/* ---- cabeçalho ---- */
.topo{background:linear-gradient(120deg,var(--verde),var(--verde2));color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,40,30,.28);padding:calc(8px + env(safe-area-inset-top)) 14px 0}
.topo::after{content:"";display:block;height:3px;background:var(--laranja);margin:0 -14px}
.topo-in{max-width:2200px;margin:0 auto;display:flex;flex-direction:column}
.marca{display:flex;gap:10px;align-items:center;padding-bottom:6px}
.marca h1{font-size:1.2rem;margin:0}
.marca span{font-size:.78rem;opacity:.85}
#nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
#nav button{background:transparent;border:0;color:#d4f0e8;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;white-space:nowrap}
#nav button.on{background:rgba(255,255,255,.2);color:#fff}
#nav button:hover{background:rgba(255,255,255,.12)}
@media (min-width:760px){.topo-in{flex-direction:row;align-items:center;justify-content:space-between}.marca{padding:8px 0}#nav{padding:0}}
.wrap{max-width:2200px;margin:0 auto;padding:14px 12px 130px}
@media (min-width:760px){.wrap{padding:20px 20px 40px}}
.view{display:none}.view.on{display:block}
/* ---- grade do app: celular (1 coluna) / tablet (2) / computador (3) ---- */
.app-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"nav" "live" "main";align-items:start}
.nav{grid-area:nav;min-width:0}.main{grid-area:main;min-width:0}.live{grid-area:live;min-width:0}
@media (min-width:760px){
  .app-grid{grid-template-columns:230px minmax(0,1fr);grid-template-areas:"nav main" "live main"}
  .nav{position:sticky;top:96px}
}
@media (min-width:1120px){
  .app-grid{grid-template-columns:clamp(240px,17vw,340px) minmax(0,1fr) clamp(320px,23vw,460px);grid-template-areas:"nav main live"}
  .live{position:sticky;top:96px;max-height:calc(100vh - 112px);overflow:auto}
}
/* ---- etapas ---- */
.steps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.step{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);text-align:left}
.step .si{font-size:1.15rem}
.step .st b{display:block;font-size:.84rem}
.step .st small{display:none;font-size:.72rem}
.step .sp{font-size:.7rem;color:var(--mut);margin-left:auto;font-weight:700}
.step .full{display:none}
.step.on{border-color:var(--verde2);background:color-mix(in srgb,var(--verde2) 10%,var(--card));box-shadow:var(--sh)}
.step.ok .sp{color:var(--n0t)}
.step.ok .sp::after{content:" ✔"}
@media (min-width:760px){
  .steps{flex-direction:column;overflow:visible;padding:0}
  .step{width:100%;padding:10px 12px}
  .step .st small{display:block}.step .full{display:inline}.step .short{display:none}
}
/* ---- painel ao vivo ---- */
.livecard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px}
.live-toggle{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:var(--tx);padding:0;text-align:left}
.live-toggle .lt{font-weight:700;font-size:.9rem}
.live-toggle .lv{margin-left:auto;display:flex;align-items:center;gap:8px}
.live-toggle .num{font-size:1.5rem;font-weight:800;line-height:1}
.live-body{display:none;margin-top:10px}
.live.open .live-body{display:block}
.live.open .chev{transform:rotate(180deg)}
@media (min-width:760px){.live-toggle{pointer-events:none}.live-body{display:block}.chev{display:none}}
.dbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.78rem}
.dbar .dn{width:112px;flex:none;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .bar{flex:1}
.bar{height:8px;background:var(--ndb);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.gauge{width:100%;max-width:250px;margin:0 auto;display:block}
.gauge .trk{fill:none;stroke:var(--ndb);stroke-width:16;stroke-linecap:round}
.gauge .val{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .4s}
.gauge text{fill:var(--tx);text-anchor:middle}
/* ---- cartões e formulários ---- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.aviso{background:#fff3cd;color:#6b5200;border-radius:12px;padding:10px 12px;font-size:.85rem}
@media not all{.aviso{background:#3b3200;color:#ffe083}}
label.campo{display:block;margin-top:12px;font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;padding:11px 12px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:3px solid color-mix(in srgb,var(--verde2) 55%,transparent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;background:var(--laranja);color:#fff;font-weight:700;font-size:.98rem;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.sec{background:var(--card);color:var(--verde);border:1.5px solid var(--verde2);box-shadow:none}
@media not all{.btn.sec{color:#9be3d0}}
.btn.verde{background:var(--verde)}
.btn.perigo{background:#c62828}
.btn.peq{padding:7px 12px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--bd);color:var(--mut);margin:0 4px 4px 0}
.domhead{border-left:6px solid var(--verde2)}
.rodape{display:flex;gap:10px;justify-content:space-between;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:25}
.rodape .btn{flex:1}
@media (min-width:760px){
  .rodape{position:sticky;left:auto;right:auto;bottom:14px;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:12px;margin-top:6px}
  .rodape .btn{flex:none;min-width:160px}
}
/* ---- itens ---- */
.item{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:0 0 14px;min-width:0}
.item h4{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .num{display:inline-block;background:var(--verde);color:#fff;border-radius:99px;min-width:26px;height:26px;line-height:26px;text-align:center;font-size:.8rem}
.item-grid{display:grid;gap:12px}
@media (min-width:900px){.item-grid.has-fig{grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:18px}.item-fig{position:sticky;top:104px;align-self:start}}
.dica{font-size:.83rem;color:var(--mut);margin:0 0 8px}
.metodo{font-size:.75rem;color:var(--mut);margin-top:8px}
.iatag{font-size:.7rem;font-weight:700;background:#e6f0ff;color:#1a3d8f;border-radius:99px;padding:2px 8px}
@media not all{.iatag{background:#1b2c52;color:#b5ccff}}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--bd);border-radius:12px;padding:9px 11px;margin:6px 0;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--verde2)}
.opt input{width:auto;margin:3px 0 0;flex:none;accent-color:var(--verde2)}
.opt .otx{font-size:.9rem}
.opt .otx b{display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
.opt.n0 b{color:var(--n0t)}.opt.n1 b{color:var(--n1t)}.opt.n2 b{color:var(--n2t)}.opt.n3 b{color:var(--n3t)}
.opt:has(input:checked).n0{border-color:var(--n0);background:var(--n0b)}
.opt:has(input:checked).n1{border-color:var(--n1);background:var(--n1b)}
.opt:has(input:checked).n2{border-color:var(--n2);background:var(--n2b)}
.opt:has(input:checked).n3{border-color:var(--n3);background:var(--n3b)}
.opt:has(input:checked).na{border-color:var(--nd);background:var(--ndb)}
.opt.na{font-size:.85rem;color:var(--mut);padding:6px 11px}
.ev{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.8rem;color:var(--mut)}
.ev label{border:1px solid var(--bd);border-radius:99px;padding:3px 11px;cursor:pointer;display:inline-flex;position:relative}
.ev label:focus-within{outline:3px solid color-mix(in srgb,var(--verde2) 55%,transparent)}
.ev label:has(input:checked){background:var(--verde2);border-color:var(--verde2);color:#fff}
.ev input{width:auto;margin:0;position:absolute;opacity:0;pointer-events:none}
details.nota{margin-top:8px}
details.nota summary{cursor:pointer;color:var(--verde2);font-size:.85rem;font-weight:600}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.8rem;white-space:nowrap}
.bd.n0{background:var(--n0b);color:var(--n0t)}.bd.n1{background:var(--n1b);color:var(--n1t)}
.bd.n2{background:var(--n2b);color:var(--n2t)}.bd.n3{background:var(--n3b);color:var(--n3t)}
.bd.nd{background:var(--ndb);color:var(--ndt)}
.acao{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;background:var(--soft)}
.sug{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--bd);padding:8px 0;font-size:.88rem}
/* ---- figuras animadas ---- */
.fig{background:linear-gradient(180deg,var(--soft),var(--card));border:1px solid var(--bd);border-radius:14px;padding:8px}
.fig-top{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.fig-play{border:0;background:var(--soft);color:var(--tx);border-radius:8px;width:30px;height:24px;line-height:1}
.fig-svg{cursor:grab;touch-action:pan-y;user-select:none;width:100%;height:auto;display:block;aspect-ratio:300/232;max-height:200px}
@media (min-width:900px){.fig-svg{max-height:240px}}
.fig-cap{min-height:2.7em;text-align:center;font-size:.8rem;font-weight:600;padding:2px 6px}
.fig-chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.fig-chips button{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:3px 9px;font-size:.7rem;font-weight:700;color:var(--mut)}
.fig-chips button.on{color:#fff}
.fig-chips button.n0.on{background:var(--n0);border-color:var(--n0)}.fig-chips button.n1.on{background:var(--n1);border-color:var(--n1)}
.fig-chips button.n2.on{background:var(--n2);border-color:var(--n2)}.fig-chips button.n3.on{background:var(--n3);border-color:var(--n3)}
.fig-chips button.ans{border-style:dashed;border-color:var(--tx)}
.fig-chips button.ans::after{content:" ✔"}
.fig-svg text{font:700 11px "Inter",system-ui,sans-serif;fill:var(--fig)}
.fig-svg .sm{font-size:9.5px;font-weight:600;fill:var(--mut)}
/* ---- relatório / resultado ---- */
.rel h2.titulo{background:linear-gradient(120deg,var(--verde),var(--verde2));color:#fff;border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:1.12rem}
.rel h3{border-bottom:2px solid var(--laranja);padding-bottom:3px;margin:20px 0 10px}
.rel table{width:100%;border-collapse:collapse;font-size:.85rem}
.rel th,.rel td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.rel th{background:var(--soft)}
.rel-top{display:grid;gap:14px}
@media (min-width:760px){.rel-top.has-foto{grid-template-columns:minmax(0,1fr) 300px}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:.9rem;align-content:start}
.kv b{color:var(--mut);font-weight:600}
@media (max-width:560px){.kv{grid-template-columns:110px 1fr}}
.foto-rel{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:0;object-fit:cover}
.hero{display:grid;gap:14px;align-items:center}
@media (min-width:760px){.hero{grid-template-columns:1fr 1fr}}
.resumo{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0}
.resumo>div{flex:1;min-width:130px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--soft)}
.resumo small{display:block}
.resumo strong{font-size:1.05rem}
.radar{width:100%;max-width:440px;display:block;margin:0 auto}
.radar .anel{fill:none;stroke:var(--bd);stroke-width:1}
.radar .eixo{stroke:var(--bd);stroke-width:1}
.radar .area{fill-opacity:.25;stroke-width:2.5}
.radar .ant{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:5 4}
.radar text{fill:var(--tx);font-size:11.5px;font-weight:600}
.radar .esc{fill:var(--mut);font-size:9px;font-weight:400}
.dom-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.domcard{border:1px solid var(--bd);border-top:5px solid var(--nd);border-radius:14px;padding:12px;background:var(--card)}
.domcard.n0{border-top-color:var(--n0)}.domcard.n1{border-top-color:var(--n1)}.domcard.n2{border-top-color:var(--n2)}.domcard.n3{border-top-color:var(--n3)}
.domcard .dh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.domcard p{font-size:.84rem;margin:.5em 0 0}
.so-print{display:none}
.mc-linha{display:flex;align-items:center;gap:8px;margin:4px 0}
.mc-rot{width:92px;font-size:.78rem;color:var(--mut);flex:none}
.mc-cel{display:flex;gap:3px;flex-wrap:wrap}
.mc{display:inline-block;width:20px;height:20px;border-radius:5px;background:var(--nd)}
.mc.n0{background:var(--n0)}.mc.n1{background:var(--n1)}.mc.n2{background:var(--n2)}.mc.n3{background:var(--n3)}.mc.nd{background:var(--ndb);border:1px dashed var(--nd)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.assin{display:flex;gap:30px;margin-top:40px}
.assin div{flex:1;border-top:1px solid var(--tx);padding-top:4px;font-size:.8rem;text-align:center}
/* ---- IA ---- */
.ia-txt{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;font-size:.9rem}
.ia-sec{margin:12px 0}
.ia-sec h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:4px}
.ia-sec ul{margin:.2em 0;padding-left:1.2em}
.ia-acao{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;background:var(--soft)}
.ia-acao .meta{font-size:.76rem;color:var(--mut);margin-top:4px}
.ia-box{border-left:5px solid #3b6fe0;background:color-mix(in srgb,#3b6fe0 8%,var(--card));border-radius:10px;padding:10px 12px}
.sugia{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px dashed var(--bd);padding:9px 0;font-size:.86rem}
.sugia .tx{flex:1;min-width:0}
.sugia small{display:block}
.mic{width:auto}
.mic.rec{background:#c62828;color:#fff;border-color:#c62828}
/* ---- histórico / painel ---- */
.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--ndb)}
.stack i{display:block}
.hist{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.hlist{display:grid;gap:12px}
@media (min-width:900px){.hlist{grid-template-columns:1fr 1fr}.hlist .hist{margin:0}}
.dots{display:flex;gap:4px;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ndb);border:1px solid var(--nd)}
.dots i.n0{background:var(--n0)}.dots i.n1{background:var(--n1)}.dots i.n2{background:var(--n2)}.dots i.n3{background:var(--n3)}
.banner{border:1.5px solid var(--verde2);background:color-mix(in srgb,var(--verde2) 10%,var(--card));border-radius:14px;padding:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;background:var(--card)}
.kpi strong{display:block;font-size:1.7rem}
.painel-grid{display:grid;gap:14px}
@media (min-width:900px){.painel-grid{grid-template-columns:1fr 1fr}.painel-grid .full{grid-column:1/-1}}
.alerta{border-left:5px solid var(--n2);background:var(--n2b);color:var(--n2t);padding:8px 10px;border-radius:8px;font-size:.85rem;margin:8px 0}
.sobre table{width:100%;border-collapse:collapse;font-size:.85rem}
.sobre td,.sobre th{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.sobre th{background:var(--soft)}
.sobre-grid{display:grid;gap:14px}
@media (min-width:1000px){.sobre-grid{grid-template-columns:1fr 1fr}.sobre-grid .full{grid-column:1/-1}}
@media (max-width:620px){
  .rel table.resp thead{display:none}
  .rel table.resp,.rel table.resp tbody{display:block}
  .rel table.resp tr{display:block;border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:6px 8px;background:var(--card)}
  .rel table.resp td{display:block;border:0;padding:4px 2px}
  .rel table.resp td::before{content:attr(data-l);display:block;font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
}

.so-desk{display:none;margin-top:8px}
@media (min-width:760px){.so-desk{display:block}}
.res-bottom{display:grid;gap:14px;align-items:start}
@media (min-width:1000px){.res-bottom{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.rel .hero>div{min-width:0}
.fig-svg text.sm{font-size:10px}

@media (min-width:1400px){html{font-size:17px}.wrap{padding:24px 32px 40px}.topo{padding-left:32px;padding-right:32px}.app-grid{gap:22px}}
@media (min-width:1800px){html{font-size:18.5px}.item-grid.has-fig{grid-template-columns:minmax(380px,34%) minmax(0,1fr)}.item-grid>div>.opts{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.item-grid>div>.opts .opt.na{grid-column:1/-1}.fig-svg{max-height:340px}}
@media (min-width:1400px){.fig-svg{max-height:290px}.dom-cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.rel table{font-size:.9rem}}
.item{padding:20px 22px}
.card{padding:22px 24px}
@media (max-width:759px){.item{padding:16px}.card{padding:18px}}

body.com-login #navConta{display:inline-block!important}
#chip{display:flex;align-items:center}
.chip-user{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:.85rem}
.chip-user .av{width:28px;height:28px;border-radius:50%;background:var(--laranja);display:grid;place-items:center;font-weight:800}
@media (max-width:759px){#chip{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top))}.chip-user .nm{display:none}.chip-user{padding:4px}}
.topo-in{position:relative}
#auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;overflow:auto;background:linear-gradient(#ffffff,#e9e9e9)}
.auth-card{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:28px 26px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.auth-logo{text-align:center;margin-bottom:16px}
.auth-logo h1{font-size:1.5rem;margin:8px 0 0}
.auth-logo span{font-size:.85rem;color:var(--mut)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin:0 0 14px}
.auth-tabs button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--mut)}
.auth-tabs button.on{background:var(--card);color:var(--verde);box-shadow:var(--sh)}
.auth-ok{background:var(--n0b);color:var(--n0t);padding:10px 12px;border-radius:10px;font-size:.88rem;margin:0 0 10px}
.auth-card a{color:var(--verde2);font-weight:600}
body.sem-acesso .topo,body.sem-acesso .wrap{display:none}
.codigo{display:inline-block;font:800 1.3rem ui-monospace,monospace;letter-spacing:.2em;background:var(--soft);border:1px dashed var(--verde2);border-radius:10px;padding:4px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- modal de métodos ---- */
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.modal-caixa{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-x{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:1.8rem;line-height:1;color:var(--mut);cursor:pointer}
/* ---- gestão (fase 1) ---- */
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.kpis>div{flex:1 1 110px;background:var(--soft);border-radius:12px;padding:10px 12px;text-align:center}
.kpis b{display:block;font-size:1.5rem;line-height:1.1}.kpis small{color:var(--mut)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.subtabs button{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.86rem}
.subtabs button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
@media(max-width:620px){.grid3{grid-template-columns:1fr}}
details.bloco{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:0 0 14px}
details.bloco>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none}
details.bloco>summary::-webkit-details-marker{display:none}
details.bloco>summary::after{content:"▾";float:right;color:var(--mut)}
details.bloco[open]>summary::after{content:"▴"}
.bloco-c{padding:0 18px 18px}
details.sub{border-top:1px dashed var(--bd);padding:8px 0}
details.sub>summary{cursor:pointer;font-weight:600;padding:6px 0}
.frow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--soft);font-size:.9rem}
.frow select{max-width:150px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:.9rem}
.chk input{width:auto;margin-top:3px}
.res-aep{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 10px}
.evid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.evi{border:1px solid var(--bd);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.evi img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.evi .pdf{height:120px;display:grid;place-items:center;background:var(--soft);border-radius:8px;font-weight:800;color:var(--mut)}
.metodo{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}
.tab{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:.88rem}
.tab th,.tab td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
.evid-print{display:flex;flex-wrap:wrap;gap:10px}.evid-print figure{margin:0;width:200px}.evid-print img{width:100%}
@media print{
  :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#bbb;--soft:#f3f3f3;--fig:#222;
    --n0b:#e1f0f6;--n0t:#00455c;--n1b:#fff0d6;--n1t:#7a4a00;--n2b:#ffe0d8;--n2t:#8a1c00;--n3b:#f9d4cc;--n3t:#6b1200;--ndb:#eceff1;--ndt:#455a64}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print,.topo,.rodape{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;border-radius:0;padding:0;margin:0}
  .so-tela{display:none!important}.so-print{display:block!important}
  .hero{grid-template-columns:1fr 1fr}
  .rel-top.has-foto{grid-template-columns:minmax(0,1fr) 220px}
  .rel h3{break-after:avoid}
  .rel h3,.rel table,.rel .resumo,.mc-linha{break-inside:avoid}
  .rel tr{break-inside:avoid}
}

/* ===== tema ErgoContexto: fundo branco/cinza-claro, títulos laranja, vermelho para o que é importante ===== */
:root{color-scheme:light}
h2,h3{color:var(--laranja)}
h4{color:var(--verde)}
.topo{background:linear-gradient(to bottom,#ffffff 0%,#ffffff 48%,#f0f0f0 72%,#dcdcdc 100%);color:var(--tx);box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}
.marca{position:relative}
.marca::before{content:"";position:absolute;left:-2px;bottom:3px;width:58px;height:9px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.34) 0,rgba(0,0,0,.12) 55%,rgba(0,0,0,0) 72%);pointer-events:none}
.marca-img{position:relative;z-index:1;margin-bottom:6px}
.topo::after{display:none}
.marca-img{height:46px;width:auto;mix-blend-mode:multiply}
.marca h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.marca h1 .e1{color:var(--laranja)}.marca h1 .e2{color:var(--mut)}
.marca span{color:var(--mut);opacity:1}
.marca h1 span{font-size:inherit}
.marca h1 .e1{color:var(--laranja)}.marca h1 .e2{color:var(--mut)}
#nav button{color:#4d4d4d}
#nav button:hover{background:rgba(0,0,0,.07)}
#nav button.on{background:var(--verde);color:#fff}
.chip-user{background:#e8e8e8;color:var(--tx)}
.auth-logo img{width:min(320px,100%);height:auto;border-radius:0!important;mix-blend-mode:multiply}
.btn,.btn.verde{background:var(--verde);color:#fff}
.btn.sec{background:var(--card);color:var(--verde);border:1.5px solid var(--verde2)}
.btn.perigo{background:var(--vermelho)}
.kpis b[style*="b71c1c"]{color:var(--vermelho)!important}
</style>

const ITENS = {};
DOMINIOS.forEach(d=>d.itens.forEach(q=>{ITENS[q.id]={...q,dom:d.id}}));
const TOTAL_ITENS = Object.keys(ITENS).length;

/* =====================================================================
   PONTUAÇÃO — por domínio, sem soma global
   ===================================================================== */
function nivelDaMedia(m){return m<0.5?0:m<1.5?1:m<2.25?2:3}
function valorItem(resp,id){const r=resp[id];return r&&typeof r.n==="number"?r.n:null}

function calcular(resp){
  const doms=DOMINIOS.map(d=>{
    const vals=d.itens.map(q=>valorItem(resp,q.id)).filter(v=>v!==null);
    const total=d.itens.length;
    const insuf=vals.length<Math.ceil(total/2);
    let media=null,nivel=null,elevado=false;
    const n3=vals.filter(v=>v===3).length;
    if(!insuf){
      media=vals.reduce((a,b)=>a+b,0)/vals.length;
      nivel=nivelDaMedia(media);
      // regra anti-diluição: um item Alto garante ao menos nível Alta; três itens Altos, Crítica
      const piso=n3>=3?3:n3>=1?2:0;
      if(piso>nivel){nivel=piso;elevado=true}
    }
    return {id:d.id,media,nivel,elevado,respondidos:vals.length,total,insuf,n3};
  });
  const validos=doms.filter(x=>!x.insuf);
  const pior=validos.length?Math.max(...validos.map(x=>x.nivel)):null;
  const resp_=doms.reduce((a,x)=>a+x.respondidos,0);
  return {doms,pior,respondidos:resp_,total:TOTAL_ITENS};
}

function prioridadeSugerida(calc,ctx){
  if(calc.pior===null)return {prio:null,porGravidade:false};
  let p=calc.pior,porGravidade=false;
  const grav=ctx.gravidade===""||ctx.gravidade==null?null:Number(ctx.gravidade);
  const fhMax=Math.max(-1,...calc.doms.filter(x=>!x.insuf&&DOMINIOS.find(d=>d.id===x.id).grupo==="fh").map(x=>x.nivel));
  if(grav!==null&&grav>=2&&fhMax>=2&&p<3){p+=1;porGravidade=true}
  return {prio:p,porGravidade};
}

function itensAtencao(resp,min=2){
  const out=[];
  DOMINIOS.forEach(d=>d.itens.forEach(q=>{const n=valorItem(resp,q.id);if(n!==null&&n>=min)out.push({dom:d,q,n})}));
  return out.sort((a,b)=>b.n-a.n);
}

/* =====================================================================
   ÍNDICE GERAL (0–100, 100 = adequado)
   Resumo para comparar e acompanhar. NÃO substitui o perfil por domínio:
   a média usa o nível efetivo de cada domínio (regra anti-diluição incluída)
   e o índice nunca fica acima do teto do domínio mais crítico.
   ===================================================================== */
const PISO_NIVEL=[0,0.5,1.5,2.25];
const TETO_IDX=[100,79,59,39];
const IDX_ROT=["Adequado","Atenção","Alerta","Crítico"];
function indice(res){
  const val=(res.doms||[]).filter(x=>x.nivel!==null&&x.nivel!==undefined&&x.media!==null&&x.media!==undefined);
  if(val.length<3)return null;
  const efet=val.map(x=>Math.max(x.media,PISO_NIVEL[x.nivel]));
  const m=efet.reduce((a,b)=>a+b,0)/efet.length;
  const pior=Math.max(...val.map(x=>x.nivel));
  const v=Math.round(Math.min(100*(1-m/3),TETO_IDX[pior]));
  const n=v>=80?0:v>=60?1:v>=40?2:3;
  return {v,n,rot:IDX_ROT[n],doms:val.length,de:res.doms.length};
}
function gaugeSvg(ind,grande){
  const L=Math.PI*80,v=ind?ind.v:0,cor=ind?`var(--n${ind.n})`:"var(--nd)";
  return `<svg class="gauge" ${grande?'style="max-width:300px"':""} viewBox="0 0 200 122" role="img" aria-label="Índice geral ${ind?ind.v+" de 100, "+ind.rot:"indisponível"}"><path class="trk" d="M20 104A80 80 0 0 1 180 104"/><path class="val" d="M20 104A80 80 0 0 1 180 104" stroke="${cor}" stroke-dasharray="${(L*v/100).toFixed(1)} ${L.toFixed(1)}"/><text x="100" y="90" font-size="40" font-weight="800">${ind?ind.v:"—"}</text><text x="100" y="113" font-size="11.5" font-weight="600" style="fill:var(--mut)">${ind?"de 100 · "+ind.rot:"mín. 3 domínios"}</text></svg>`;
}

/* =====================================================================
   FIGURAS ANIMADAS DE POSTURA (ergonomia física)
   Boneco de linhas em vista lateral, cinemática direta: cada pose é um
   conjunto de ângulos. Sem imagens, sem rede: funciona offline.
   Ângulos em graus, a partir da vertical para baixo; positivo = para a frente.
   ===================================================================== */
const FG={G:196,AX:118,W:300,H:232};
const SEG={th:38,sn:38,tk:44,ua:27,fa:25,hd:9};
const BASE={tr:0,nk:0,sh:8,el:25,wr:0,th:0,kn:0};
const rad=a=>a*Math.PI/180;
const f1_=n=>n.toFixed(1);
function cinematica(p){
  const sa=p.th-p.kn;
  const kx=SEG.th*Math.sin(rad(p.th)),ky=SEG.th*Math.cos(rad(p.th));
  const ox=kx+SEG.sn*Math.sin(rad(sa)),oy=ky+SEG.sn*Math.cos(rad(sa));
  const ankle=[FG.AX,FG.G-5];
  const hip=[ankle[0]-ox,ankle[1]-oy];
  const knee=[hip[0]+kx,hip[1]+ky];
  const sh=[hip[0]+SEG.tk*Math.sin(rad(p.tr)),hip[1]-SEG.tk*Math.cos(rad(p.tr))];
  const ha_=p.tr+p.nk;
  const hd=[sh[0]+(7+SEG.hd)*Math.sin(rad(ha_)),sh[1]-(7+SEG.hd)*Math.cos(rad(ha_))];
  const el=[sh[0]+SEG.ua*Math.sin(rad(p.sh)),sh[1]+SEG.ua*Math.cos(rad(p.sh))];
  const fa=p.sh+p.el;
  const wr=[el[0]+SEG.fa*Math.sin(rad(fa)),el[1]+SEG.fa*Math.cos(rad(fa))];
  const ha=fa+p.wr;
  const hand=[wr[0]+11*Math.sin(rad(ha)),wr[1]+11*Math.cos(rad(ha))];
  return {ankle,hip,knee,sh,hd,el,wr,hand,ha};
}
function desenhaFig(p,ex,lvl,yaw){
  yaw=yaw||0;
  const k=cinematica(p),cor=`var(--n${lvl})`,hl=new Set(ex.hl||[]);
  const x0=k.hip[0],cy_=Math.cos(yaw),sy_=Math.sin(yaw);
  // projeção 3D: giro em torno do eixo vertical que passa pelo quadril
  const P=(pt,z)=>{const dx=pt[0]-x0;return [x0+dx*cy_+z*sy_,pt[1],-dx*sy_+z*cy_]};
  const col=n=>hl.has(n)?cor:"var(--fig)";
  const it=[];
  const cap=(a,b,r,nome,dark)=>{
    const rr=r*(1+((a[2]+b[2])/2)*0.0035),c=col(nome);
    const h=rr*0.3;
    let s=`<line x1="${f1_(a[0])}" y1="${f1_(a[1])}" x2="${f1_(b[0])}" y2="${f1_(b[1])}" stroke="rgba(0,0,0,.28)" stroke-width="${f1_(rr*2+2)}" stroke-linecap="round"/>`
      +`<line x1="${f1_(a[0])}" y1="${f1_(a[1])}" x2="${f1_(b[0])}" y2="${f1_(b[1])}" stroke="${c}" stroke-width="${f1_(rr*2)}" stroke-linecap="round"/>`;
    if(dark)s+=`<line x1="${f1_(a[0])}" y1="${f1_(a[1])}" x2="${f1_(b[0])}" y2="${f1_(b[1])}" stroke="rgba(0,0,0,.22)" stroke-width="${f1_(rr*2)}" stroke-linecap="round"/>`;
    s+=`<line x1="${f1_(a[0]-h)}" y1="${f1_(a[1]-h*1.1)}" x2="${f1_(b[0]-h)}" y2="${f1_(b[1]-h*1.1)}" stroke="rgba(255,255,255,.34)" stroke-width="${f1_(rr*0.8)}" stroke-linecap="round"/>`;
    it.push({z:(a[2]+b[2])/2,s});
  };
  const esf=(a,r,nome,dz,dark)=>{
    const rr=r*(1+a[2]*0.0035),c=col(nome);
    it.push({z:a[2]+(dz||0),s:`<circle cx="${f1_(a[0])}" cy="${f1_(a[1])}" r="${f1_(rr+1)}" fill="rgba(0,0,0,.28)"/><circle cx="${f1_(a[0])}" cy="${f1_(a[1])}" r="${f1_(rr)}" fill="${c}"/>${dark?`<circle cx="${f1_(a[0])}" cy="${f1_(a[1])}" r="${f1_(rr)}" fill="rgba(0,0,0,.22)"/>`:""}<circle cx="${f1_(a[0]-rr*.3)}" cy="${f1_(a[1]-rr*.35)}" r="${f1_(rr*.45)}" fill="rgba(255,255,255,.32)"/>`});

  for(let i=0;i<14;i++){const a=yaw+i*Math.PI*2/14,tx=FG.AX+8+Math.cos(a)*118,ty=FG.G+2+Math.sin(a)*13;s+=`<circle cx="${f1_(tx)}" cy="${f1_(ty)}" r="${Math.sin(a)>0?1.9:1.2}" fill="var(--mut)" opacity="${Math.sin(a)>0?.6:.3}"/>`}
  s+=`<ellipse cx="${f1_(k.ankle[0]*cy_+x0*(1-cy_)+6)}" cy="${FG.G+1}" rx="38" ry="5" fill="rgba(0,0,0,.2)"/>`;
  // banco (cilindro simples)
  const op=Math.max(0,Math.min(1,(p.th-45)/35));
  if(op>0&&p.kn<=118){
    const c=P([k.hip[0],k.hip[1]+8],0),yt=c[1];
    s+=`<g opacity="${op.toFixed(2)}"><line x1="${f1_(c[0]-9)}" y1="${f1_(yt)}" x2="${f1_(c[0]-13)}" y2="${FG.G}" stroke="var(--mut)" stroke-width="3"/><line x1="${f1_(c[0]+9)}" y1="${f1_(yt)}" x2="${f1_(c[0]+13)}" y2="${FG.G}" stroke="var(--mut)" stroke-width="3"/><ellipse cx="${f1_(c[0])}" cy="${f1_(yt)}" rx="19" ry="5.5" fill="var(--mut)"/><ellipse cx="${f1_(c[0])}" cy="${f1_(yt-1.5)}" rx="17" ry="4" fill="rgba(255,255,255,.28)"/></g>`;
  }
  // pernas (lado distante e próximo)
  const perna=(zz,dark)=>{
    const h=P(k.hip,zz),kn=P(k.knee,zz),an=P(k.ankle,zz),toe=P([k.ankle[0]+15,FG.G-2.5],zz);
    cap(h,kn,6.2,"perna",dark);cap(kn,an,5,"perna",dark);cap(an,toe,3.6,"perna",dark);esf(kn,5.6,"perna",0,dark);
  };
  perna(-7,true);perna(7,false);
  // tronco
  const quadril=P(k.hip,0),ombro=P(k.sh,0),meio=P([k.hip[0]+(k.sh[0]-k.hip[0])*.3,k.hip[1]+(k.sh[1]-k.hip[1])*.3],0);
  cap(quadril,ombro,10,"tronco");cap(meio,ombro,11.5,"tronco");esf(quadril,9.5,"tronco");
  // pescoço e cabeça
  const cab=P(k.hd,0);

  esf(cab,9.6,"pescoco",0.5);
  it.push({z:cab[2]+0.6,s:`<circle cx="${f1_(cab[0]+4.2*cy_)}" cy="${f1_(cab[1]-1)}" r="1.5" fill="rgba(0,0,0,.55)" opacity="${cy_>0.2?1:0}"/>`});
  // braços
  const braco=(zz,dark)=>{

  // objetos
  const mh=P(k.hand,0);
  const caixa=(x,y,sz,z)=>{
    const dx=sz*(0.18+0.45*sy_),dy=sz*0.24,px=x,py=y;
    let t=`<rect x="${f1_(px)}" y="${f1_(py)}" width="${f1_(sz)}" height="${f1_(sz)}" fill="#c8a26b" stroke="#8a6a3a" stroke-width="1.2"/>`;
    t+=`<polygon points="${f1_(px)},${f1_(py)} ${f1_(px+dx)},${f1_(py-dy)} ${f1_(px+sz+dx)},${f1_(py-dy)} ${f1_(px+sz)},${f1_(py)}" fill="#dfc08a" stroke="#8a6a3a" stroke-width="1"/>`;
    t+=dx>=0?`<polygon points="${f1_(px+sz)},${f1_(py)} ${f1_(px+sz+dx)},${f1_(py-dy)} ${f1_(px+sz+dx)},${f1_(py+sz-dy)} ${f1_(px+sz)},${f1_(py+sz)}" fill="#a8854f" stroke="#8a6a3a" stroke-width="1"/>`:`<polygon points="${f1_(px)},${f1_(py)} ${f1_(px+dx)},${f1_(py-dy)} ${f1_(px+dx)},${f1_(py+sz-dy)} ${f1_(px)},${f1_(py+sz)}" fill="#a8854f" stroke="#8a6a3a" stroke-width="1"/>`;
    it.push({z:z,s:t});
  };
  if(ex.obj==="peca")it.push({z:0,s:`<rect x="${f1_(mh[0]-2)}" y="${f1_(mh[1]-6)}" width="15" height="12" rx="2.5" fill="var(--laranja)" stroke="rgba(0,0,0,.3)" stroke-width="1"/><rect x="${f1_(mh[0]-1)}" y="${f1_(mh[1]-5)}" width="13" height="3" rx="1.5" fill="rgba(255,255,255,.35)"/>`});
  if(ex.obj==="ferramenta"){const tw=P([k.wr[0]+27*Math.sin(rad(k.ha)),k.wr[1]+27*Math.cos(rad(k.ha))],0),w0=P(k.wr,0);cap(w0,tw,3.2,"x");it.push({z:0.2,s:`<circle cx="${f1_(tw[0])}" cy="${f1_(tw[1])}" r="6" fill="var(--mut)" stroke="rgba(0,0,0,.3)"/><circle cx="${f1_(tw[0]-2)}" cy="${f1_(tw[1]-2)}" r="2.4" fill="rgba(255,255,255,.4)"/>`})}
  if(ex.obj==="caixa"){const sz=ex.sz||20;caixa(mh[0]+sz*0.02,mh[1]-sz*0.75,sz,0)}
  if(ex.obj==="carro"){
    const sz=ex.sz||24,x=mh[0]+3,y=mh[1]-sz/2;

    it.push({z:-1,s:`<line x1="${f1_(x+sz/2)}" y1="${f1_(y+sz)}" x2="${f1_(x+sz/2)}" y2="${FG.G-6}" stroke="var(--mut)" stroke-width="3.2"/><circle cx="${f1_(x+sz/2)}" cy="${FG.G-5}" r="5.5" fill="var(--mut)" stroke="rgba(0,0,0,.3)"/>`});
  }

function alvoFig(id,lvl,t){
  const s=FIGS[id].n[lvl];
  const ex={obj:s.obj,sz:s.sz,tag:s.tag,hl:FIGS[id].hl,marks:s.marks};
  let p;
  if(s.tl){
    const N=s.tl.length,pos=((t%14)/14)*N,i=Math.min(N-1,Math.floor(pos)),fr=pos-i;
    let run=0;for(let j=0;j<i;j++){const c=s.tl[j];run=c==="P"?0:c==="p"?run*0.4:run+1}
    const c=s.tl[i];
    if(c==="P")p={...BASE,th:84,kn:84,tr:0,sh:10,el:34};
    else{
      const fat=Math.min(1,(run+fr)/(c==="p"?6:4.2))*(c==="E"?1.25:1);
      p={...BASE,tr:3+34*fat,nk:2+26*fat,sh:18+10*fat,el:62-10*fat};
    }
    ex.tl=s.tl;ex.m=pos/N;
    ex.obj=c==="P"?undefined:"peca";
  }else{
    p={...BASE,...s.p};
    if(s.q){
      const w=(1-Math.cos(2*Math.PI*t/(s.per||4)))/2,q={...p,...s.q};
      for(const k in p)p[k]=p[k]+(q[k]-p[k])*w;
    }
    p.tr+=Math.sin(t*1.7)*0.7;
  }
  return {p,ex};
}
const figInst=new Map();
let figObs=null,figUltimo=0,figLoop=false;
function htmlFig(id){
  const chips=ROT_ITEM.map((r,n)=>`<button type="button" class="n${n}" data-acao="fig-nivel" data-n="${n}">${r}</button>`).join("");
  return `<div class="fig item-fig" data-fig="${id}"><div class="fig-top"><span>Exemplo 3D · arraste para girar</span><button type="button" class="fig-play" data-acao="fig-play" aria-label="Pausar animação">${REDUZ?"▶":"⏸"}</button></div>

function figNivel(f,n){
  f.lvl=n;f.tAuto=0;
  f.capEl.textContent=FIGS[f.id].n[n].cap;
  f.svg.setAttribute("aria-label","Exemplo de postura, nível "+ROT_ITEM[n]+": "+FIGS[f.id].n[n].cap);
  $$(".fig-chips button",f.el).forEach(b=>{const k=Number(b.dataset.n);b.classList.toggle("on",k===n);b.classList.toggle("ans",k===f.ans);b.setAttribute("aria-pressed",k===n)});
}
function iniciarFigs(){
  figInst.clear();if(figObs)figObs.disconnect();
  if("IntersectionObserver" in window)figObs=new IntersectionObserver(es=>es.forEach(e=>{const f=e.target._fig;if(f)f.vis=e.isIntersecting}),{rootMargin:"120px"});
  $$(".fig").forEach(el=>{
    const id=el.dataset.fig,r=estado.resp[id],ans=r&&typeof r.n==="number"?r.n:null;
    const f={el,id,g:$(".fg",el),svg:$("svg",el),capEl:$(".fig-cap",el),ans,lvl:ans===null?0:ans,auto:ans===null&&!REDUZ,vis:true,cur:null,tAuto:0,pausa:REDUZ,tCong:0,yaw:0,manual:false};
    el._fig=f;figInst.set(id,f);if(figObs)figObs.observe(el);
    let d0=null;
    f.svg.addEventListener("pointerdown",e=>{d0={x:e.clientX,y:f.yaw};f.manual=true;try{f.svg.setPointerCapture(e.pointerId)}catch(_){}});
    f.svg.addEventListener("pointermove",e=>{if(d0)f.yaw=Math.max(-1.5,Math.min(1.5,d0.y+(e.clientX-d0.x)*0.016))});
    const fim=()=>{d0=null};f.svg.addEventListener("pointerup",fim);f.svg.addEventListener("pointercancel",fim);
    f.svg.addEventListener("dblclick",()=>{f.manual=false});
    figNivel(f,f.lvl);
  });
  if(!figLoop){figLoop=true;requestAnimationFrame(quadroFig)}
}
function quadroFig(ts){
  requestAnimationFrame(quadroFig);
  if(ts-figUltimo<32||document.hidden)return;
  const dt=Math.min(.1,(ts-figUltimo)/1000);figUltimo=ts;
  figInst.forEach(f=>{
    if(!f.vis||!f.el.isConnected)return;
    if(!f.pausa)f.tCong=ts/1000;
    const t=REDUZ?0:f.tCong;
    if(f.auto&&!f.pausa){f.tAuto+=dt;if(f.tAuto>3.4)figNivel(f,(f.lvl+1)%4)}
    const a=alvoFig(f.id,f.lvl,t);
    if(!f.cur)f.cur={...a.p};else for(const k in a.p)f.cur[k]+=(a.p[k]-f.cur[k])*Math.min(1,dt*7);
    if(!f.manual)f.yaw=REDUZ?0.4:Math.sin(t*0.38)*0.55;
    f.g.innerHTML=desenhaFig(f.cur,a.ex,f.lvl,f.yaw);
  });
}

/* ---------- Eventos do wizard ---------- */
function setPath(path,val){
  const ks=path.split(".");let o=estado;
  for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]]}
  o[ks[ks.length-1]]=val;
}
function onCampo(e){
  const t=e.target;
  if(t.id==="foto"&&e.type==="change"){tratarFoto(t.files[0]);return}
  if(t.type==="radio"){
    if(t.name.startsWith("r_")){
      const id=t.name.slice(2);estado.resp[id]=estado.resp[id]||{};
      estado.resp[id].n=t.value==="na"?"na":Number(t.value);
      if(estado.resp[id].ia)delete estado.resp[id].ia;
      const f=figInst.get(id);
      if(f){f.ans=typeof estado.resp[id].n==="number"?estado.resp[id].n:null;f.auto=false;figNivel(f,f.ans===null?f.lvl:f.ans)}
      atualizarProgresso();atualizarLive();agendarSalvar();
    } else if(t.name.startsWith("e_")){
      const id=t.name.slice(2);estado.resp[id]=estado.resp[id]||{};
      estado.resp[id].ev=t.value;agendarSalvar();
    }
    return;
  }
  if(t.dataset.desc){sugDesc[t.dataset.desc]=Object.assign(sugDesc[t.dataset.desc]||{},{texto:t.value});return}
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);agendarSalvar();return}
  if(t.dataset.obs){const id=t.dataset.obs;estado.resp[id]=estado.resp[id]||{};estado.resp[id].obs=t.value;agendarSalvar();return}
  if(t.dataset.dom){const [id,c]=t.dataset.dom.split(".");estado.dom[id]=estado.dom[id]||{};estado.dom[id][c]=t.value;agendarSalvar();return}
  if(t.dataset.ac){const [i,c]=t.dataset.ac.split(".");if(estado.acoes[i]){estado.acoes[i][c]=t.value;agendarSalvar()}return}
}
function tratarFoto(arq){
  if(!arq)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const M=1000,esc_=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*esc_);c.height=Math.round(img.height*esc_);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      estado.foto=c.toDataURL("image/jpeg",0.72);sugFoto=null;
      $("#fotoBox").innerHTML=htmlFotoBox();
      agendarSalvar();
    };
    img.onerror=()=>aviso("Não foi possível ler essa imagem.");
    img.src=rd.result;
  };
  rd.readAsDataURL(arq);
}
function novaAcao(extra){

function finalizar(){
  const calc=calcular(estado.resp);
  if(calc.respondidos===0){aviso("Responda pelo menos alguns itens antes de finalizar.");return}
  const insuf=calc.doms.filter(x=>x.insuf).map(x=>DOMINIOS.find(d=>d.id===x.id).nome);
  if(insuf.length&&!confirm("Estes domínios têm menos da metade dos itens avaliados e ficarão como \"dados insuficientes\":\n\n• "+insuf.join("\n• ")+"\n\nFinalizar mesmo assim?"))return;
  if(!estado.ctx.atividade&&!confirm("A atividade não foi informada. Finalizar mesmo assim?"))return;
  estado.acoes=estado.acoes.filter(a=>a.acao.trim());
  const agora=Date.now();
  if(!estado.criadoEm)estado.criadoEm=agora;
  if(!estado.ctx.avaliador&&perfil)estado.ctx.avaliador=perfil.nome;
  const pr=prioridadeSugerida(calc,estado.ctx);
  const aut=(typeof autorAtual==='function'&&autorAtual());
  const av={autor:aut||(lista.find(x=>x.id===estado.id)||{}).autor||null,id:estado.id,versao:VERSAO_MODELO,criadoEm:estado.criadoEm,atualizadoEm:agora,
    ctx:{...estado.ctx},resp:JSON.parse(JSON.stringify(estado.resp)),dom:JSON.parse(JSON.stringify(estado.dom)),
    acoes:JSON.parse(JSON.stringify(estado.acoes)),ia:estado.ia||"",iaj:estado.iaj||null,foto:estado.foto||"",
    resultado:{doms:calc.doms,pior:calc.pior,prio:pr.prio,porGravidade:pr.porGravidade,respondidos:calc.respondidos,total:calc.total}};
  const i=lista.findIndex(a=>a.id===av.id);
  if(i>=0)lista[i]=av;else lista.unshift(av);
  salvarLista();
  try{localStorage.removeItem(CH_RASC)}catch(e){}
  estado.fase="resultado";
  render();window.scrollTo(0,0);
}
function avAtual(){return lista.find(a=>a.id===estado.id)}
function anterior(av){
  const k=norm(av.ctx.atividade)+"|"+norm(av.ctx.local);
  if(!norm(av.ctx.atividade))return null;
  return lista.filter(a=>!a.legado&&a.id!==av.id&&a.criadoEm<av.criadoEm&&(norm(a.ctx.atividade)+"|"+norm(a.ctx.local))===k)
    .sort((a,b)=>b.criadoEm-a.criadoEm)[0]||null;
}
function radarSvg(res,ant){
  const W=380,H=310,cx=190,cy=158,R=100,n=DOMINIOS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*(v/3)*Math.cos(ang(i)),cy+R*(v/3)*Math.sin(ang(i))];
  let s=`<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de exposição por domínio">`;
  [1,2,3].forEach(r=>{s+=`<polygon class="anel" points="${DOMINIOS.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`});
  DOMINIOS.forEach((d,i)=>{
    const [x,y]=pt(i,3);s+=`<line class="eixo" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx,ly]=pt(i,3.42),c=Math.cos(ang(i));
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${c>0.3?"start":c<-0.3?"end":"middle"}">${esc(d.curto)}</text>`;
  });
  [1,2,3].forEach(r=>{s+=`<text class="esc" x="${cx+3}" y="${(cy-R*r/3+10).toFixed(1)}">${r}</text>`});
  if(ant){
    const pts=ant.resultado.doms.map((x,i)=>pt(i,x.media??0).map(v=>v.toFixed(1)).join(",")).join(" ");
    s+=`<polygon class="ant" points="${pts}"/>`;
  }
  const cor=res.pior===null?"var(--nd)":`var(--n${res.pior})`;
  const pts=res.doms.map((x,i)=>pt(i,x.media??0).map(v=>v.toFixed(1)).join(",")).join(" ");
  s+=`<polygon class="area" points="${pts}" fill="${cor}" stroke="${cor}"/>`;
  res.doms.forEach((x,i)=>{const [px,py]=pt(i,x.media??0);s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${x.nivel===null?"var(--nd)":`var(--n${x.nivel})`}" stroke="#fff" stroke-width="1.5"><title>${esc(DOMINIOS[i].nome)}: ${fmtMedia(x.media)}</title></circle>`});
  return s+"</svg>";
}

function divergencia(av,id){
  const p=av.dom&&av.dom[id]&&av.dom[id].perc;

const URL_BASE="https://ergocontexto-ia.raul-almeida-siqueira.workers.dev";
const URL_IA=URL_BASE+"/api/ergo";
function payloadIA(av){
  const ind=indice(av.resultado);
  const monta=(simples)=>({
    versao:VERSAO_MODELO,
    atividade:av.ctx.atividade,funcao:av.ctx.funcao,
    indiceGeral:ind?{valor:ind.v,faixa:ind.rot}:"indisponível",
    gravidadePotencial:av.ctx.gravidade!==""&&av.ctx.gravidade!=null?GRAVIDADES[av.ctx.gravidade]:"não informada",
    exposicaoJornada:av.ctx.exposicao!==""&&av.ctx.exposicao!=null?EXPOSICOES[av.ctx.exposicao]:"não informada",
    prioridadeSugerida:av.resultado.prio===null?"indefinida":PRIOS[av.resultado.prio],
    observacoesGerais:(av.ctx.obs||"").slice(0,600),
    dominios:DOMINIOS.map((d,i)=>{
      const r=av.resultado.doms[i],dm=(av.dom&&av.dom[d.id])||{};
      return {dominio:d.nome,grupo:GRUPOS[d.grupo],media:r.media===null?null:Number(r.media.toFixed(2)),
        nivel:r.nivel===null?"dados insuficientes":NIVEIS[r.nivel].curto,itensAvaliados:`${r.respondidos}/${r.total}`,
        percepcaoTrabalhadores:dm.perc!==""&&dm.perc!==undefined?["sem incômodo","pouco incômodo","incômodo moderado","muito incômodo"][dm.perc]:"não coletada",
        fatoresProtecao:(dm.prot||"").slice(0,300),
        itensAtencao:d.itens.map(q=>({q,n:valorItem(av.resp,q.id)})).filter(x=>x.n!==null&&x.n>=2).map(x=>{
          const r2=av.resp[x.q.id]||{};
          const o={item:x.q.t,nivel:ROT_ITEM[x.n],fonte:r2.ev||"não informada",observacao:(r2.obs||"").slice(0,300)};
          if(!simples)o.criterio=x.q.c[x.n];
          return o;
        })};
    })
  });
  let p=monta(false);
  if(JSON.stringify(p).length>20000)p=monta(true);
  return p;
}
async function chamarIA(rota,corpo){
  const h={"Content-Type":"application/json"};
  if(SB_ON){const t=await tokenValido();if(!t)throw new Error("Entre na sua conta para usar a IA.");h.Authorization="Bearer "+t}
  const r=await fetch(URL_BASE+rota,{method:"POST",headers:h,body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.erro||"falha");
  return j;
}

function iaParaPlano(){
  const av=avAtual();if(!av||!av.ia)return;
  const ini=av.ia.indexOf("SUGESTÕES DE AÇÃO:"),fim=av.ia.indexOf("NECESSIDADE DE AVALIAÇÃO");

  const bloco=av.ia.substring(ini+18,fim>ini?fim:undefined);
  const linhas=bloco.split("\n").map(l=>l.replace(/^\s*(?:[-•*–]|\d+[.)])\s*/,"").trim()).filter(l=>l.length>8);
  if(!linhas.length){aviso("Nenhuma sugestão identificada.");return}
  linhas.slice(0,5).forEach(l=>av.acoes.push({dom:"",tipo:"",acao:l+" (sugestão da IA, validar)",resp:"",prazo:"",prio:"Média",status:"Aberta",origem:""}));

  if(reconhecedor){reconhecedor.stop();return}

  rc.onerror=()=>{aviso("Não consegui usar o microfone. Verifique a permissão do navegador.")};

}

      ...a.resultado.doms.flatMap(r=>[r.media===null?"":fmtMedia(r.media),r.nivel===null?"Dados insuficientes":NIVEIS[r.nivel].curto]),`${a.resultado.respondidos}/${a.resultado.total}`]});
    return baixar(`ergocontexto-avaliacoes-${hojeISO()}.csv`,csv([cab,...rows]),"text/csv;charset=utf-8");

  if(tipo==="ac"){

    const rows=L.flatMap(a=>a.acoes.map(x=>[a.id,a.ctx.atividade,a.ctx.local,x.dom?DOMINIOS.find(d=>d.id===x.dom).nome:"Geral",x.tipo,x.acao,x.resp,fmtData(x.prazo),x.prio,x.status]));

function importarJSON(arq){
  if(!arq)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=="ergocontexto"||!Array.isArray(d.avaliacoes))throw new Error();
      const ids=new Set(lista.map(a=>a.id));let novos=0;
      d.avaliacoes.forEach(a=>{
        if(!a||!a.id||ids.has(a.id))return;
        if(!a.legado&&(!a.resultado||!Array.isArray(a.resultado.doms)||a.resultado.doms.length!==DOMINIOS.length||!a.ctx||!a.resp||!Array.isArray(a.acoes)))return;
        lista.push(a);ids.add(a.id);novos++;
      });
      lista.sort((x,y)=>(y.criadoEm||0)-(x.criadoEm||0));
      salvarLista();renderHistorico();aviso(novos+" avaliação(ões) importada(s).");
    }catch(e){aviso("Arquivo inválido. Use um backup gerado por este aplicativo.")}
  };
  rd.readAsText(arq);
}

function renderSobre(){

    <h3>Por que dois lados, em 5 domínios?</h3>
    <p>Ergonomia e fatores humanos respondem a perguntas diferentes. A <b>ergonomia</b> pergunta o que a atividade exige do corpo e da mente e se isso pode causar adoecimento. Os <b>fatores humanos</b> perguntam o que, no sistema, torna o desempenho confiável ou propenso a erro. Por isso o resultado é um perfil de 5 domínios; o índice geral resume, mas não esconde o domínio crítico.</p>

  <div class="card"><h3>Como a pontuação funciona</h3>

      <li>Itens <i>não avaliados</i> ficam fora da média. Com menos da metade dos itens avaliada, o domínio aparece como <b>dados insuficientes</b>.</li>

      <li><b>Regra anti-diluição:</b> um item Alta garante ao menos nível Alta ao domínio, e três itens Alta garantem Crítica.</li>
      <li><b>Prioridade sugerida:</b> vem do domínio mais crítico. Gravidade potencial Grave ou Muito grave com fator humano em Alta ou Crítica sobe um nível.</li>
      <li>Cada domínio indica o próximo passo na lógica <b>SOBANE</b> (Déparis → Observação → Análise → Perícia) e os métodos para aprofundar.</li>

    <p>Os critérios são versões simplificadas, inspiradas na literatura. Não herdam a validade dos instrumentos completos (RULA, REBA, NIOSH, OCRA, NASA-TLX, COPSOQ etc.). Ruído, calor, vibração e iluminação exigem medição. Percepção dos trabalhadores e fatores de proteção entram como contexto e não alteram a pontuação.</p>
  </div>
  <div class="card"><h3>Índice geral (0 a 100)</h3>
    <p>É um resumo para comparar atividades e acompanhar a evolução. <b>100 = adequado</b>.</p>
    <ul>
      <li>Parte da média de cada domínio avaliado, já com a regra anti-diluição, e converte para a escala de 0 a 100.</li>
      <li><b>O domínio mais crítico limita o índice</b>: com um domínio Moderado o índice não passa de 79; Alto, de 59; Crítico, de 39.</li>
      <li>Faixas: <b>80 a 100</b> Adequado · <b>60 a 79</b> Atenção · <b>40 a 59</b> Alerta · <b>0 a 39</b> Crítico.</li>
      <li>Só é calculado com pelo menos 3 domínios avaliados.</li>

    </ul>
    <h3>Bonecos de postura</h3>
    <p>Na ergonomia física, cada item traz um boneco animado com exemplos dos quatro níveis. São ilustrações esquemáticas para alinhar o olhar do avaliador, não medições de ângulo.</p>

  </div></div>`;
}

const CFG=window.ERGO_CONFIG||{};
const SB_URL=(CFG.supabaseUrl||"").replace(/\/+$/,""),SB_KEY=CFG.anonKey||"";
const SB_ON=!!(SB_URL&&SB_KEY);
const CH_SESSAO="ergocontexto_sessao",CH_SYNC="ergocontexto_sync",CH_TOMB="ergocontexto_tomb";
let sessao=SB_ON?lerJSON(CH_SESSAO,null):null;
let equipeInfo=null,membros=[],statusNuvem="",sincronizando=false,tmrSync=null;

function msgErro(j,status){
  const t=String((j&&(j.msg||j.error_description||j.message||j.error))||"");
  if(/invalid login credentials/i.test(t))return "E-mail ou senha incorretos.";
  if(/email not confirmed/i.test(t))return "Confirme seu e-mail antes de entrar. Veja a caixa de entrada (e o spam).";
  if(/already registered|already been registered/i.test(t))return "Este e-mail já tem conta. Use Entrar ou Esqueci a senha.";
  if(/password should be at least|weak password/i.test(t))return "A senha precisa ter pelo menos 8 caracteres.";
  if(/rate limit|too many|security purposes/i.test(t)||status===429)return "Muitas tentativas. Aguarde um minuto e tente de novo.";
  if(/same password/i.test(t))return "A nova senha precisa ser diferente da atual.";
  if(/valid email|invalid format/i.test(t))return "E-mail inválido.";
  if(/convite|database error (saving|creating) new user/i.test(t))return "Código de convite inválido, expirado ou esgotado. Peça um código ao responsável.";
  if(/signups not allowed/i.test(t))return "Criação de contas desativada neste projeto.";
  return t||"Não foi possível concluir. Tente novamente.";
}
async function sbReq(caminho,{method="GET",body,token,headers}={}){
  const r=await fetch(SB_URL+caminho,{method,headers:{apikey:SB_KEY,"Content-Type":"application/json",...((token||!SB_KEY.startsWith("sb_"))?{Authorization:"Bearer "+(token||SB_KEY)}:{}),...(headers||{})},body:body===undefined?undefined:JSON.stringify(body)});
  let j=null;const txt=await r.text();try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const e=new Error(msgErro(j,r.status));e.status=r.status;throw e}
  return j;
}
function gravarSessao(s){sessao=s;if(s)gravarJSON(CH_SESSAO,s);else try{localStorage.removeItem(CH_SESSAO)}catch(e){}}
function sessaoDe(j){
  return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email,nome:j.user&&j.user.user_metadata&&j.user.user_metadata.nome}};
}
async function tokenValido(){
  if(!sessao)return null;
  if(sessao.expires_at-90>Date.now()/1000)return sessao.access_token;
  try{
    const j=await sbReq("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:sessao.refresh_token}});
    gravarSessao(sessaoDe(j));return sessao.access_token;
  }catch(e){
    if(e.status===400||e.status===401||e.status===403){await sair(true);return null}
    return sessao.access_token; // sem rede: segue com o que tem
  }
}
async function sbA(caminho,op){
  const t=await tokenValido();if(!t)throw new Error("Sessão expirada. Entre de novo.");
  return sbReq(caminho,{...(op||{}),token:t});
}
const autorAtual=()=>sessao?{id:sessao.user.id,nome:(perfil&&perfil.nome)||sessao.user.nome||sessao.user.email}:null;

function agendarSync(){if(!SB_ON||!sessao)return;clearTimeout(tmrSync);tmrSync=setTimeout(()=>sincronizar(),2500)}
function marcarStatus(t){statusNuvem=t;atualizarChip();const el=$("#statusNuvem");if(el)el.textContent=t}
async function sincronizar(manual){
  if(!SB_ON||!sessao||sincronizando)return;
  if(!navigator.onLine){marcarStatus("Sem internet. Sincroniza quando voltar.");return}
  sincronizando=true;marcarStatus("Sincronizando…");
  try{
    const sy=lerJSON(CH_SYNC,{}),uid=sessao.user.id,admin=perfil&&perfil.papel==="admin";
    const rows=await sbA("/rest/v1/avaliacoes?select=id,dados,atualizado_em,excluido&order=atualizado_em.desc&limit=1000")||[];
    let mudou=false;
    rows.forEach(r=>{
      const i=lista.findIndex(a=>a.id===r.id);
      if(r.excluido){if(i>=0){lista.splice(i,1);mudou=true}sy[r.id]=r.atualizado_em;return}
      const loc=i>=0?lista[i]:null;
      if(!loc){lista.push({...r.dados,foto:""});sy[r.id]=r.atualizado_em;mudou=true}
      else if((r.atualizado_em||0)>(loc.atualizadoEm||0)){lista[i]={...r.dados,foto:loc.foto||""};sy[r.id]=r.atualizado_em;mudou=true}
      else if((r.atualizado_em||0)===(loc.atualizadoEm||0))sy[r.id]=r.atualizado_em;
    });
    const eq=perfil&&perfil.equipe_id?perfil.equipe_id:null;
    const sobe=lista.filter(a=>!a.legado&&(a.atualizadoEm||0)>(sy[a.id]||0)&&(!a.autor||a.autor.id===uid||admin));
    for(let i=0;i<sobe.length;i+=15){
      const lote=sobe.slice(i,i+15).map(a=>{const {foto,...resto}=a;return {id:a.id,equipe_id:eq,dados:resto,atualizado_em:a.atualizadoEm||0,excluido:false}});
      await sbA("/rest/v1/avaliacoes?on_conflict=id",{method:"POST",body:lote,headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      sobe.slice(i,i+15).forEach(a=>{sy[a.id]=a.atualizadoEm||0});
    }
    const tomb=lerJSON(CH_TOMB,[]);
    if(tomb.length){
      await sbA("/rest/v1/avaliacoes?on_conflict=id",{method:"POST",body:tomb.map(id=>({id,equipe_id:eq,dados:{},atualizado_em:Date.now(),excluido:true})),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      gravarJSON(CH_TOMB,[]);
    }
    gravarJSON(CH_SYNC,sy);
    lista.sort((x,y)=>(y.criadoEm||0)-(x.criadoEm||0));
    gravarJSON(CH_LISTA,lista);
    marcarStatus("Sincronizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    if(mudou){const v=$(".view.on");if(v&&v.id==="v-historico")renderHistorico();if(v&&v.id==="v-painel")renderPainel()}
  }catch(e){marcarStatus("Falha ao sincronizar: "+e.message);if(manual)aviso("Falha ao sincronizar: "+e.message)}
  finally{sincronizando=false}
}
function registrarExclusao(id){
  if(!SB_ON||!sessao)return;
  const t=lerJSON(CH_TOMB,[]);if(!t.includes(id)){t.push(id);gravarJSON(CH_TOMB,t)}
}

function mostrarAuth(modo,msg,tipo){
  authModo=modo||authModo;
  let el=$("#auth");if(!el){el=document.createElement("div");el.id="auth";document.body.appendChild(el)}
  el.innerHTML=htmlAuth(msg,tipo);document.body.classList.add("sem-acesso");
  const f=$("input",el);if(f&&!/Android|iPhone/i.test(navigator.userAgent))f.focus();
}
function fecharAuth(){const el=$("#auth");if(el)el.remove();document.body.classList.remove("sem-acesso")}
async function enviarAuth(form){
  const tipo=form.dataset.auth,d=Object.fromEntries(new FormData(form).entries());
  const btn=$("button.btn",form);btn.disabled=true;
  try{
    if(tipo==="entrar"){
      const j=await sbReq("/auth/v1/token?grant_type=password",{method:"POST",body:{email:d.email.trim(),password:d.senha}});
      gravarSessao(sessaoDe(j));fecharAuth();await aposLogin();
    }else if(tipo==="criar"){
      const j=await sbReq("/auth/v1/signup",{method:"POST",body:{email:d.email.trim(),password:d.senha,data:{nome:d.nome.trim(),codigo:(d.codigo||"").trim()}}});
      if(j&&j.access_token){gravarSessao(sessaoDe(j));fecharAuth();await aposLogin()}
      else mostrarAuth("entrar","Conta criada! Enviamos um e-mail de confirmação. Clique no link e depois entre aqui.","ok");
    }else if(tipo==="esqueci"){
      await sbReq("/auth/v1/recover?redirect_to="+encodeURIComponent(location.origin+location.pathname),{method:"POST",body:{email:d.email.trim()}});
      mostrarAuth("entrar","Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.","ok");
    }else if(tipo==="nova"){
      await sbReq("/auth/v1/user",{method:"PUT",token:authTokenTemp,body:{password:d.senha}});
      history.replaceState(null,"",location.pathname);
      if(authSessaoApos){gravarSessao(authSessaoApos);authSessaoApos=null;fecharAuth();await aposLogin();aviso("Senha alterada.")}
      else mostrarAuth("entrar","Senha alterada! Entre com a nova senha.","ok");
    }
  }catch(e){mostrarAuth(authModo,e.message);}
}
let authTokenTemp=null;
async function sair(silencioso){
  const t=sessao&&sessao.access_token;
  try{if(t&&!silencioso)await sbReq("/auth/v1/logout",{method:"POST",token:t})}catch(e){}
  gravarSessao(null);equipeInfo=null;membros=[];
  if(!silencioso){
    // saída manual: limpa os dados deste aparelho (a cópia está na nuvem)
    try{["ergocontexto_perfil","ergocontexto_dono",CH_SYNC,CH_TOMB,CH_LISTA,CH_RASC].forEach(k=>localStorage.removeItem(k))}catch(e){}
    perfil=null;lista=[];estado=novoEstado();
  }
  atualizarChip();
  if(SB_ON){mostrarAuth("entrar",silencioso?"Sua sessão expirou. Entre novamente.":"")}
}
async function aposLogin(){
  // se outra pessoa entrou neste aparelho, não mistura os dados locais
  const dono=lerJSON("ergocontexto_dono",null);
  if(dono&&dono!==sessao.user.id){try{[CH_SYNC,CH_TOMB,CH_LISTA,CH_RASC,"ergocontexto_perfil"].forEach(k=>localStorage.removeItem(k))}catch(e){}lista=[];perfil=null;estado=novoEstado()}
  gravarJSON("ergocontexto_dono",sessao.user.id);
  await carregarPerfil();
  if(rascunhoSujo()===false&&perfil)estado.ctx.avaliador=estado.ctx.avaliador||perfil.nome;
  atualizarChip();render();
  sincronizar();
}
function atualizarChip(){
  const el=$("#chip");if(!el)return;
  if(!SB_ON||!sessao){el.innerHTML="";return}
  const n=(perfil&&perfil.nome)||sessao.user.email||"";
  el.innerHTML=`<button type="button" data-acao="ir-conta" class="chip-user" title="${esc(statusNuvem)}"><span class="av">${esc((n[0]||"?").toUpperCase())}</span><span class="nm">${esc(n.split(" ")[0])}</span></button>`;
}

    :`<p class="mut">Você ainda não está em uma equipe. Crie uma, ou entre com o código que um colega passou.</p>

  <div class="card"><h2>Minha conta</h2>

    <div class="linha"><button class="btn peq sec" data-acao="sync-agora">Sincronizar agora</button><button class="btn peq perigo" data-acao="sair">Sair</button></div></div>
  <div class="card"><h2>Equipe</h2>${eq}</div>
  <div class="card"><h3>Trocar senha</h3>
    <form data-conta="senha"><label class="campo">Nova senha (mín. 8 caracteres)<input type="password" name="senha" minlength="8" autocomplete="new-password" required></label><button class="btn peq sec" style="margin-top:10px">Alterar senha</button></form></div>

async function enviarConta(form){
  const t=form.dataset.conta,d=Object.fromEntries(new FormData(form).entries());
  try{
    if(t==="nome"){await sbA(`/rest/v1/perfis?id=eq.${sessao.user.id}`,{method:"PATCH",body:{nome:d.nome.trim()},headers:{Prefer:"return=minimal"}});perfil.nome=d.nome.trim();gravarJSON("ergocontexto_perfil",perfil);atualizarChip();aviso("Nome salvo.")}
    if(t==="senha"){await sbA("/auth/v1/user",{method:"PUT",body:{password:d.senha}});form.reset();aviso("Senha alterada.")}
    if(t==="equipe-criar"){await sbA("/rest/v1/rpc/criar_equipe",{method:"POST",body:{p_nome:d.nome}});await carregarPerfil();renderConta();sincronizar();aviso("Equipe criada. Passe o código para seus colegas.")}
    if(t==="equipe-entrar"){await sbA("/rest/v1/rpc/entrar_equipe",{method:"POST",body:{p_codigo:d.codigo}});await carregarPerfil();renderConta();sincronizar();aviso("Você entrou na equipe.")}
  }catch(e){aviso(e.message)}
}

/* ---------- início do acesso ---------- */
async function iniciarAuth(){
  if(!SB_ON)return;
  document.body.classList.add("com-login");
  // link vindo do e-mail (confirmação ou recuperação): tokens no # da URL
  const h=new URLSearchParams(location.hash.replace(/^#/,""));
  if(h.get("error_description")){mostrarAuth("entrar",msgErro({error_description:h.get("error_description").replace(/\+/g," ")}));history.replaceState(null,"",location.pathname);return}
  if(h.get("access_token")){
    const tk=h.get("access_token"),tipo=h.get("type");
    try{
      const u=await sbReq("/auth/v1/user",{token:tk});
      const s={access_token:tk,refresh_token:h.get("refresh_token"),expires_at:Math.floor(Date.now()/1000)+Number(h.get("expires_in")||3600),user:{id:u.id,email:u.email,nome:u.user_metadata&&u.user_metadata.nome}};
      if(tipo==="recovery"){authTokenTemp=tk;authSessaoApos=s;mostrarAuth("nova");history.replaceState(null,"",location.pathname);return}
      gravarSessao(s);history.replaceState(null,"",location.pathname);
    }catch(e){mostrarAuth("entrar","Link inválido ou expirado. Entre ou peça um novo.");history.replaceState(null,"",location.pathname);return}
  }
  if(!sessao){mostrarAuth("entrar");return}
  atualizarChip();
  await aposLogin();
}

async function sincronizarReg(manual){
  if(!SB_ON||!sessao||!navigator.onLine)return;
  try{
    const sy=lerJSON(CH_REGSY,{}),eq=perfil&&perfil.equipe_id?perfil.equipe_id:null;
    const sobe=REG.filter(r=>(r.atualizadoEm||0)>(sy[r.id]||0));
    for(const r of sobe){
      const corpo={id:r.id,tipo:r.tipo,equipe_id:eq,dados:{...r.d,_autor:r.autor,_criadoEm:r.criadoEm},atualizado_em:r.atualizadoEm,excluido:!!r.excluido};
      try{
        const res=await sbA("/rest/v1/registros?on_conflict=id",{method:"POST",body:corpo,headers:{Prefer:"resolution=merge-duplicates,return=representation"}});
        const row=res&&res[0];
        if(row&&row.dados&&row.dados.numero&&r.d.numero!==row.dados.numero)r.d.numero=row.dados.numero;
        sy[r.id]=r.atualizadoEm;delete r.erroSync;
      }catch(e){r.erroSync=e.message}
    }
    const rows=await sbA("/rest/v1/registros?select=id,tipo,dados,atualizado_em,excluido&order=atualizado_em.desc&limit=3000")||[];
    rows.forEach(w=>{
      const {_autor,_criadoEm,...d}=w.dados||{};
      const i=REG.findIndex(x=>x.id===w.id),loc=i>=0?REG[i]:null;
      if(!loc){REG.push({id:w.id,tipo:w.tipo,d,autor:_autor||null,criadoEm:_criadoEm||w.atualizado_em,atualizadoEm:w.atualizado_em,excluido:!!w.excluido});sy[w.id]=w.atualizado_em}
      else if((w.atualizado_em||0)>(loc.atualizadoEm||0)){REG[i]={...loc,d,autor:_autor||loc.autor,atualizadoEm:w.atualizado_em,excluido:!!w.excluido};sy[w.id]=w.atualizado_em}
      else if(w.dados&&w.dados.numero&&!loc.d.numero)loc.d.numero=w.dados.numero;

}

function comprimirImagem(file,max,q){
  return new Promise((ok,err)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok({blob:b,url:c.toDataURL("image/jpeg",.6)}):err(new Error("falha ao comprimir")),"image/jpeg",q)};
    img.onerror=()=>{URL.revokeObjectURL(u);err(new Error("Imagem inválida."))};
    img.src=u;
  });
}
async function anexarEvidencia(file,regId){
  const eh=/^image\//.test(file.type);
  if(!eh&&file.type!=="application/pdf")throw new Error("Use foto (JPG/PNG) ou PDF.");
  if(file.size>15e6)throw new Error("Arquivo grande demais (máx. 15 MB).");
  let blob=file,mini="";
  if(eh){const c=await comprimirImagem(file,1400,.72);blob=c.blob;const m=await comprimirImagem(file,200,.6);mini=m.url}
  if(blob.size>5242880)throw new Error("Arquivo maior que 5 MB depois de comprimir.");
  const ev={nome:file.name,tipo:blob.type,mini,em:Date.now(),por:(autorAtual()||{}).nome||"",legenda:""};
  if(SB_ON&&sessao){
    if(!navigator.onLine)throw new Error("Sem internet. Envie a evidência quando voltar a conexão.");
    const t=await tokenValido();if(!t)throw new Error("Sessão expirada. Entre de novo.");
    const pasta=(perfil&&perfil.equipe_id)||sessao.user.id,ext=eh?"jpg":"pdf";
    const path=`${pasta}/${regId}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
    const r=await fetch(`${SB_URL}/storage/v1/object/evidencias/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+t,"Content-Type":blob.type},body:blob});
    if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(j.message||j.error||"Falha no envio ("+r.status+")")}
    ev.path=path;
  }else ev.local=true;
  return ev;
}
async function abrirEvidencia(i){
  const ev=G.ed&&G.ed.d.evid&&G.ed.d.evid[i];if(!ev)return;
  if(!ev.path){if(ev.mini){const w=window.open("");if(w)w.document.write(`<img src="${ev.mini}" style="max-width:100%">`)}return}
  try{
    const t=await tokenValido();
    const r=await fetch(`${SB_URL}/storage/v1/object/sign/evidencias/${ev.path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({expiresIn:600})});
    const j=await r.json();if(!r.ok||!j.signedURL)throw new Error(j.message||"Sem acesso");
    window.open(SB_URL+"/storage/v1"+j.signedURL,"_blank");
  }catch(e){aviso("Não foi possível abrir: "+e.message)}
}

const CRIT=["Postura extrema ou sustentada","Força elevada","Carga sem recurso auxiliar","Ausência de recuperação","Queixa recorrente","Possível agravamento de saúde","Consequência grave","Improvisação crítica","Falta de recurso essencial","Risco de erro com consequência crítica","Orientação do PCMSO","Relação indicada em investigação de acidente","Inadequação persistente após ação anterior"];
const GAT=[["g0","Necessidade de avaliação aprofundada"],["g1","Inadequação ou insuficiência da ação implantada"],["g2","Indicação do acompanhamento de saúde"],["g3","Possível relação entre acidente/doença e condição de trabalho"],["g4","Situação complexa ou multifatorial"],["g5","Divergência entre resultados"],["g6","Exposição crítica"],["g7","Mudança relevante de processo"]];

const PRIOF=[["freq","Frequência"],["dur","Duração da exposição"],["int","Intensidade"],["rec","Falta de recuperação"],["cons","Consequência potencial"]];
const NIVEL_P=["P4 · Monitorar","P3 · Planejar","P2 · Priorizar","P1 · Imediata"];
function aepClasse(d){
  const f=d.f||{},cats=CATS.map(c=>{
    let resp=0,pior=-1;const cont=[0,0,0,0],itens=[];
    c.itens.forEach(i=>{const v=f[i.k];if(v===undefined||v===""||v==="na")return;const n=Number(v);resp++;cont[n]++;if(n>pior)pior=n;if(n>=2)itens.push({k:i.k,t:i.t,m:i.m,n})});
    return {id:c.id,nome:c.nome,total:c.itens.length,resp,pior,cont,itens};
  });
  const crit=Object.keys(d.crit||{}).filter(k=>d.crit[k]).map(k=>CRIT[Number(k.slice(1))]);
  const base=Math.max(-1,...cats.map(c=>c.pior));
  const motivos=[];
  cats.forEach(c=>c.itens.filter(i=>i.n===3).forEach(i=>motivos.push(`Item crítico em ${c.nome}: ${i.t}`)));
  let nivel=base;
  if(crit.length&&nivel<2){nivel=2;motivos.push("Regra de prevalência: condição crítica marcada ("+crit[0]+(crit.length>1?" e outras":"")+")")}
  const alto=cats.filter(c=>c.pior>=2).length;
  const pontos=PRIOF.reduce((s,[k])=>s+(Number((d.prio||{})[k])||0),0),nExp=Number(d.nExpostos)||0;
  let p=nivel<0?-1:nivel;
  if(p>=0){if(pontos>=7&&p<3)p+=1;else if(nExp>=10&&p<3&&p>=1)p+=1}
  const gat=[];
  if(nivel===3)gat.push({id:"g6",rot:"Exposição crítica"});
  if(alto>=2)gat.push({id:"g4",rot:"Situação complexa ou multifatorial ("+alto+" categorias em Alto/Crítico)"});
  if(d.crit&&d.crit.c12)gat.push({id:"g1",rot:"Inadequação persistente após ação anterior"});
  if(d.crit&&d.crit.c10)gat.push({id:"g2",rot:"Indicação do PCMSO / acompanhamento de saúde"});
  if(d.crit&&d.crit.c11)gat.push({id:"g3",rot:"Possível relação com acidente/doença"});
  Object.keys(d.gat||{}).filter(k=>d.gat[k]&&!gat.some(g=>g.id===k)).forEach(k=>{const g=GAT.find(x=>x[0]===k);if(g)gat.push({id:k,rot:g[1]+" (manual)"})});
  const mets={};
  cats.forEach((c,ci)=>c.itens.forEach(i=>{const m=i.m||CATS[ci].m;(mets[m]=mets[m]||[]).push(i.t)}));
  const metodos=Object.keys(mets).map(m=>({m,itens:mets[m]}));
  if(((d.part||{}).regioes||"").trim())metodos.push({m:"Mapa Corporal de Corlett",itens:["desconforto relatado pelos trabalhadores"]});
  const totResp=cats.reduce((s,c)=>s+c.resp,0),tot=cats.reduce((s,c)=>s+c.total,0);
  return {cats,nivel,p,motivos,gat,metodos,crit,totResp,tot,pontos};
}

function htmlVinculoTriagem(){

function aplicarVinculo(campo,v){
  const c=estado.ctx;c[campo]=v;
  if(campo==="postoId"){c.atividadeId="";const p=v&&regGet(v);if(p){c.local=p.d.nome+(p.d.tag?" ("+p.d.tag+")":"");const ar=p.d.pai&&regGet(p.d.pai);if(ar){c.area=ar.d.nome;let u=ar.d.pai&&regGet(ar.d.pai);while(u&&u.d.tc!=="planta")u=u.d.pai&&regGet(u.d.pai);if(u)c.unidade=u.d.nome}}}
  if(campo==="atividadeId"){const a=v&&regGet(v);if(a)c.atividade=a.d.nome}
  if(campo==="demandaId"&&v){const dm=regGet(v);if(dm&&dm.d.postoId&&!c.postoId){aplicarVinculo("postoId",dm.d.postoId);if(dm.d.atividadeId)aplicarVinculo("atividadeId",dm.d.atividadeId);c.demandaId=v;return}}
  agendarSalvar();render();
}

function lerCampo(t){
  const v=t.type==="checkbox"?t.checked:t.value;
  if(G.ed){
    gset(G.ed.d,t.dataset.g,v);
    if(t.dataset.g==="postoId"){G.ed.d.atividadeId=""}
    if(t.dataset.prazo){G.ed.d.prazo=somaDias(PRAZO_DIAS[Number(v)||0])}
    if(G.ed.tipo==="dem")return t.dataset.prazo||t.dataset.g==="postoId";
    agendarEd();return !!(t.dataset.re);
  }
  return false;
}
function reRender(){
  const y=window.scrollY,ab=[...document.querySelectorAll(".view.on details")].map(x=>x.open),foco=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.g:null;
  renderDemandas();
  document.querySelectorAll(".view.on details").forEach((x,i)=>{if(ab[i]!==undefined)x.open=ab[i]});
  if(foco){const el=document.querySelector(`.view.on [data-g="${foco}"]`);if(el)el.focus({preventScroll:true})}
  window.scrollTo(0,y);
}
["input","change"].forEach(ev=>document.addEventListener(ev,async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.gv&&ev==="change"){aplicarVinculo(t.dataset.gv,t.value);return}
  if(t.id==="evidIn"&&ev==="change"){
    const files=[...t.files];t.value="";
    for(const f of files){
      try{aviso("Enviando "+f.name+"…");const x=await anexarEvidencia(f,G.ed.id);(G.ed.d.evid=G.ed.d.evid||[]).push(x);if(G.ed.tipo!=="dem")gravarEd()}
      catch(err){aviso(err.message);break}
    }
    reRender();return;
  }
  if(t.dataset&&t.dataset.g&&G.ed){
    if(ev==="input"&&(t.tagName==="SELECT"||t.type==="checkbox"))return;
    if(ev==="change"&&!(t.tagName==="SELECT"||t.type==="checkbox"||t.type==="date"))return;
    if(lerCampo(t))reRender();
  }
}));
document.addEventListener("submit",e=>{

document.addEventListener("click",e=>{

    case "hist-posto":G.hist=id;renderCadastros();window.scrollTo(0,0);break;

    case "ed-voltar":if(G.ed&&G.ed.tipo!=="dem")gravarEd();G.ed=null;G.rel=false;renderDemandas();window.scrollTo(0,0);break;
    case "etapa-add":(G.ed.d.etapas=G.ed.d.etapas||[]).push({n:"",dur:"",freq:""});reRender();break;

    case "reg-revisao":gravarEd();mudarStatus("Enviada para revisão","revisao");renderDemandas();aviso("Enviada para revisão.");break;

  }
});

/* =====================================================================
   FASE 2: PLANO DE AÇÃO, EFICÁCIA E ALERTAS
   "Concluída" e "eficaz" são status diferentes: a ação só vira eficaz
   com evidência (foto antes/depois), nova observação e aprovação técnica.
   ===================================================================== */
const HIER=["Eliminação da exigência","Modificação do processo","Solução de engenharia","Mecanização ou automação","Redução de peso, força, alcance ou repetição","Adequação do layout","Ferramenta apropriada","Organização e alternância do trabalho","Pausas","Treinamento e orientação"];
const ST_ACAO=[["proposta","Não iniciada (aguardando aprovação)"],["planejada","Não iniciada (aprovada)"],["execucao","Em andamento"],["concluida","Concluída"],["verificacao","Aguardando verificação de eficácia"],["eficaz","Eficaz"],["parcial","Parcialmente eficaz"],["naoeficaz","Não eficaz"],["cancelada","Cancelada"]];
const stAcao=s=>(ST_ACAO.find(x=>x[0]===s)||[0,s])[1];
const PRI_AC=["P4 · Monitorar","P3 · Planejar","P2 · Priorizar","P1 · Imediata"],PRAZO_AC=[90,60,30,7];
const ABERTA_AC=s=>s==="proposta"||s==="planejada"||s==="execucao";
const AGUARDA=s=>s==="concluida"||s==="verificacao";
const diasEntre=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const diasAtraso=d=>d.prazo&&ABERTA_AC(d.status)?Math.max(0,diasEntre(d.prazo,hojeISO())):0;
function escalonar(n){return n<=0?"":n<=7?"Responsável direto":n<=15?"Liderança da área":n<=30?"Gerência e EHS":"Diretoria"}
G.acFiltro="abertas";

function novaAcao(base){
  return {id:rid(),tipo:"acao",novo:true,d:Object.assign({data:hojeISO(),problema:"",etapa:"",causa:"",acao:"",hier:"",provisoria:"",definitiva:"",prioridade:"1",responsavel:(perfil&&perfil.nome)||"",area:"",participantes:"",custo:"",orcamento:"",prazo:somaDias(60),dataPlan:"",dataReal:"",status:"proposta",demandaId:"",postoId:"",atividadeId:"",origemId:"",origemItem:"",justTreino:"",atraso:"",escal:"",evid:[],hist:[],ef:{prevista:"",avaliador:"",reaval:"",metodo:"",comparacao:"",trabalhadores:"",efeitos:"",residual:"",decisao:"",obs:""}},base||{})};
}
function acoesDe(f){return regOf("acao").filter(r=>f(r.d))}

/* ---------- lista ---------- */
function renderAcoes(){
  const el=$("#v-acoes");if(!el)return;
  if(G.ed&&G.ed.tipo==="acao"){el.innerHTML=htmlAcaoEd();return}

  const filtros={abertas:d=>ABERTA_AC(d.status),vencidas:d=>diasAtraso(d)>0,aguarda:d=>AGUARDA(d.status),eficazes:d=>d.status==="eficaz",ineficaz:d=>d.status==="parcial"||d.status==="naoeficaz",todas:()=>true};
  const L=todas.filter(r=>filtros[f](r.d)).sort((a,b)=>(a.d.prazo||"9").localeCompare(b.d.prazo||"9"));
  const chips=[["abertas","Abertas"],["vencidas","Vencidas"],["aguarda","Aguardando eficácia"],["eficazes","Eficazes"],["ineficaz","Parcial ou não eficaz"],["todas","Todas"]].map(([k,r])=>`<button type="button" class="${f===k?"on":""}" data-g-acao="ac-filtro" data-f="${k}">${r} <small>${todas.filter(x=>filtros[k](x.d)).length}</small></button>`).join("");
