<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ErgoContexto</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

header{
background:#142b40;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:15px;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:8px;
background:#df652b;
color:white;
font-size:16px;
margin-top:20px;
}

.resultado{
font-size:22px;
font-weight:bold;
margin-top:20px;
text-align:center;
}
</style>
</head>

<body>

<header>
<h1>ErgoContexto</h1>
<p>Avaliação Inicial de Ergonomia e Fatores Humanos</p>
</header>

<div class="card">

<label>Atividade</label>
<input id="atividade">

<label>Função</label>
<input id="funcao">

<label>1. Há postura forçada?</label>
<select id="p1">
<option value="0">Não</option>
<option value="1">Sim</option>
</select>

<label>2. Há esforço físico significativo?</label>
<select id="p2">
<option value="0">Não</option>
<option value="1">Sim</option>
</select>

<label>3. Há movimentos repetitivos?</label>
<select id="p3">
<option value="0">Não</option>
<option value="1">Sim</option>
</select>

<label>4. Há pressão de tempo?</label>
<select id="p4">
<option value="0">Não</option>
<option value="1">Sim</option>
</select>

<label>5. Há interrupções frequentes?</label>
<select id="p5">
<option value="0">Não</option>
<option value="1">Sim</option>
</select>

<button onclick="avaliar()">
Finalizar Avaliação
</button>

<div id="resultado" class="resultado"></div>

</div>

<script>

function avaliar(){

let total =
Number(document.getElementById("p1").value)+
Number(document.getElementById("p2").value)+
Number(document.getElementById("p3").value)+
Number(document.getElementById("p4").value)+
Number(document.getElementById("p5").value);

let texto="";

if(total<=1){
texto="🟢 Baixo Potencial de Exposição";
}
else if(total<=3){
texto="🟡 Médio Potencial de Exposição";
}
else{
texto="🔴 Alto Potencial de Exposição";
}

document.getElementById("resultado").innerHTML=texto;

localStorage.setItem(
"ultimaAvaliacao",
JSON.stringify({
atividade:document.getElementById("atividade").value,
funcao:document.getElementById("funcao").value,
resultado:texto,
data:new Date().toLocaleString()
})
);

}

</script>

</body>
</html>
