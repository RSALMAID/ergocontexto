<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004F3D">
<title>ErgoContexto — Triagem ergonômica e fatores humanos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --verde:#004F3D;--verde2:#007A5E;--laranja:#E46F2A;
  --bg:#eef2f5;--card:#fff;--tx:#14231f;--mut:#5a6b66;--bd:#dfe6e9;--soft:#f5f8f9;--fig:#3d4f4a;
  --r:16px;--sh:0 1px 2px rgba(16,40,34,.06),0 8px 24px rgba(16,40,34,.07);
  --n0:#2e9e5b;--n0b:#e3f5e9;--n0t:#14532d;
  --n1:#d9a400;--n1b:#fff4cc;--n1t:#6b4e00;
  --n2:#e46f2a;--n2b:#ffe4cf;--n2t:#7a3300;
  --n3:#c62828;--n3b:#ffdada;--n3t:#7f1212;
  --nd:#9aa7a3;--ndb:#eceff1;--ndt:#455a64;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1517;--card:#172125;--tx:#e8eeec;--mut:#9fb0ab;--bd:#2a383d;--soft:#1d292e;--fig:#cfdcd8;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --n0b:#153a26;--n0t:#9be3b5;--n1b:#3d3300;--n1t:#ffe083;--n2b:#4a2410;--n2t:#ffc49a;--n3b:#4a1515;--n3t:#ffb3b3;
    --ndb:#2a3438;--ndt:#b0bec5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px;scroll-padding-bottom:100px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .4em}
h2{font-size:1.25rem}h3{font-size:1.05rem}h4{font-size:1rem}
p{margin:.4em 0}
small,.mut{color:var(--mut)}
button{font:inherit;cursor:pointer}
/* ---- cabeçalho ---- */
.topo{background:linear-gradient(120deg,var(--verde),var(--verde2));color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,40,30,.28);padding:calc(8px + env(safe-area-inset-top)) 14px 0}
.topo::after{content:"";display:block;height:3px;background:var(--laranja);margin:0 -14px}
.topo-in{max-width:1360px;margin:0 auto;display:flex;flex-direction:column}
.marca{display:flex;gap:10px;align-items:center;padding-bottom:6px}
.marca h1{font-size:1.2rem;margin:0}
.marca span{font-size:.78rem;opacity:.85}
#nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
#nav button{background:transparent;border:0;color:#d4f0e8;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;white-space:nowrap}
#nav button.on{background:rgba(255,255,255,.2);color:#fff}
#nav button:hover{background:rgba(255,255,255,.12)}
@media (min-width:760px){.topo-in{flex-direction:row;align-items:center;justify-content:space-between}.marca{padding:8px 0}#nav{padding:0}}
.wrap{max-width:1360px;margin:0 auto;padding:14px 12px 130px}
@media (min-width:760px){.wrap{padding:20px 20px 40px}}
.view{display:none}.view.on{display:block}
/* ---- grade do app: celular (1 coluna) / tablet (2) / computador (3) ---- */
.app-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"nav" "live" "main";align-items:start}
.nav{grid-area:nav;min-width:0}.main{grid-area:main;min-width:0}.live{grid-area:live;min-width:0}
@media (min-width:760px){
  .app-grid{grid-template-columns:230px minmax(0,1fr);grid-template-areas:"nav main" "live main"}
  .nav{position:sticky;top:96px}
}
@media (min-width:1120px){
  .app-grid{grid-template-columns:250px minmax(0,1fr) 320px;grid-template-areas:"nav main live"}
  .live{position:sticky;top:96px;max-height:calc(100vh - 112px);overflow:auto}
}
/* ---- etapas ---- */
.steps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.step{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);text-align:left}
.step .si{font-size:1.15rem}
.step .st b{display:block;font-size:.84rem}
.step .st small{display:none;font-size:.72rem}
.step .sp{font-size:.7rem;color:var(--mut);margin-left:auto;font-weight:700}
.step .full{display:none}
.step.on{border-color:var(--verde2);background:color-mix(in srgb,var(--verde2) 10%,var(--card));box-shadow:var(--sh)}
.step.ok .sp{color:var(--n0t)}
.step.ok .sp::after{content:" ✔"}
@media (min-width:760px){
  .steps{flex-direction:column;overflow:visible;padding:0}
  .step{width:100%;padding:10px 12px}
  .step .st small{display:block}.step .full{display:inline}.step .short{display:none}
}
/* ---- painel ao vivo ---- */
.livecard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px}
.live-toggle{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:var(--tx);padding:0;text-align:left}
.live-toggle .lt{font-weight:700;font-size:.9rem}
.live-toggle .lv{margin-left:auto;display:flex;align-items:center;gap:8px}
.live-toggle .num{font-size:1.5rem;font-weight:800;line-height:1}
.live-body{display:none;margin-top:10px}
.live.open .live-body{display:block}
.live.open .chev{transform:rotate(180deg)}
@media (min-width:760px){.live-toggle{pointer-events:none}.live-body{display:block}.chev{display:none}}
.dbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.78rem}
.dbar .dn{width:112px;flex:none;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .bar{flex:1}
.bar{height:8px;background:var(--ndb);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.gauge{width:100%;max-width:250px;margin:0 auto;display:block}
.gauge .trk{fill:none;stroke:var(--ndb);stroke-width:16;stroke-linecap:round}
.gauge .val{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .4s}
.gauge text{fill:var(--tx);text-anchor:middle}
/* ---- cartões e formulários ---- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.aviso{background:#fff3cd;color:#6b5200;border-radius:12px;padding:10px 12px;font-size:.85rem}
@media (prefers-color-scheme:dark){.aviso{background:#3b3200;color:#ffe083}}
label.campo{display:block;margin-top:12px;font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;padding:11px 12px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:3px solid color-mix(in srgb,var(--verde2) 55%,transparent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;background:var(--laranja);color:#fff;font-weight:700;font-size:.98rem;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.sec{background:var(--card);color:var(--verde);border:1.5px solid var(--verde2);box-shadow:none}
@media (prefers-color-scheme:dark){.btn.sec{color:#9be3d0}}
.btn.verde{background:var(--verde)}
.btn.perigo{background:#c62828}
.btn.peq{padding:7px 12px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--bd);color:var(--mut);margin:0 4px 4px 0}
.domhead{border-left:6px solid var(--verde2)}
.rodape{display:flex;gap:10px;justify-content:space-between;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:25}
.rodape .btn{flex:1}
@media (min-width:760px){
  .rodape{position:sticky;left:auto;right:auto;bottom:14px;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:12px;margin-top:6px}
  .rodape .btn{flex:none;min-width:160px}
}
/* ---- itens ---- */
.item{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:0 0 14px;min-width:0}
.item h4{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .num{display:inline-block;background:var(--verde);color:#fff;border-radius:99px;min-width:26px;height:26px;line-height:26px;text-align:center;font-size:.8rem}
.item-grid{display:grid;gap:12px}
@media (min-width:900px){.item-grid.has-fig{grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:18px}.item-fig{position:sticky;top:104px;align-self:start}}
.dica{font-size:.83rem;color:var(--mut);margin:0 0 8px}
.metodo{font-size:.75rem;color:var(--mut);margin-top:8px}
.iatag{font-size:.7rem;font-weight:700;background:#e6f0ff;color:#1a3d8f;border-radius:99px;padding:2px 8px}
@media (prefers-color-scheme:dark){.iatag{background:#1b2c52;color:#b5ccff}}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--bd);border-radius:12px;padding:9px 11px;margin:6px 0;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--verde2)}
.opt input{width:auto;margin:3px 0 0;flex:none;accent-color:var(--verde2)}
.opt .otx{font-size:.9rem}
.opt .otx b{display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
.opt.n0 b{color:var(--n0t)}.opt.n1 b{color:var(--n1t)}.opt.n2 b{color:var(--n2t)}.opt.n3 b{color:var(--n3t)}
.opt:has(input:checked).n0{border-color:var(--n0);background:var(--n0b)}
.opt:has(input:checked).n1{border-color:var(--n1);background:var(--n1b)}
.opt:has(input:checked).n2{border-color:var(--n2);background:var(--n2b)}
.opt:has(input:checked).n3{border-color:var(--n3);background:var(--n3b)}
.opt:has(input:checked).na{border-color:var(--nd);background:var(--ndb)}
.opt.na{font-size:.85rem;color:var(--mut);padding:6px 11px}
.ev{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.8rem;color:var(--mut)}
.ev label{border:1px solid var(--bd);border-radius:99px;padding:3px 11px;cursor:pointer;display:inline-flex;position:relative}
.ev label:focus-within{outline:3px solid color-mix(in srgb,var(--verde2) 55%,transparent)}
.ev label:has(input:checked){background:var(--verde2);border-color:var(--verde2);color:#fff}
.ev input{width:auto;margin:0;position:absolute;opacity:0;pointer-events:none}
details.nota{margin-top:8px}
details.nota summary{cursor:pointer;color:var(--verde2);font-size:.85rem;font-weight:600}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.8rem;white-space:nowrap}
.bd.n0{background:var(--n0b);color:var(--n0t)}.bd.n1{background:var(--n1b);color:var(--n1t)}
.bd.n2{background:var(--n2b);color:var(--n2t)}.bd.n3{background:var(--n3b);color:var(--n3t)}
.bd.nd{background:var(--ndb);color:var(--ndt)}
.acao{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;background:var(--soft)}
.sug{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--bd);padding:8px 0;font-size:.88rem}
/* ---- figuras animadas ---- */
.fig{background:linear-gradient(180deg,var(--soft),var(--card));border:1px solid var(--bd);border-radius:14px;padding:8px}
.fig-top{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.fig-play{border:0;background:var(--soft);color:var(--tx);border-radius:8px;width:30px;height:24px;line-height:1}
.fig-svg{width:100%;height:auto;display:block;aspect-ratio:300/232;max-height:200px}
@media (min-width:900px){.fig-svg{max-height:240px}}
.fig-cap{min-height:2.7em;text-align:center;font-size:.8rem;font-weight:600;padding:2px 6px}
.fig-chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.fig-chips button{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:3px 9px;font-size:.7rem;font-weight:700;color:var(--mut)}
.fig-chips button.on{color:#fff}
.fig-chips button.n0.on{background:var(--n0);border-color:var(--n0)}.fig-chips button.n1.on{background:var(--n1);border-color:var(--n1)}
.fig-chips button.n2.on{background:var(--n2);border-color:var(--n2)}.fig-chips button.n3.on{background:var(--n3);border-color:var(--n3)}
.fig-chips button.ans{border-style:dashed;border-color:var(--tx)}
.fig-chips button.ans::after{content:" ✔"}
.fig-svg text{font:700 11px system-ui,sans-serif;fill:var(--fig)}
.fig-svg .sm{font-size:9.5px;font-weight:600;fill:var(--mut)}
/* ---- relatório / resultado ---- */
.rel h2.titulo{background:linear-gradient(120deg,var(--verde),var(--verde2));color:#fff;border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:1.12rem}
.rel h3{border-bottom:2px solid var(--laranja);padding-bottom:3px;margin:20px 0 10px}
.rel table{width:100%;border-collapse:collapse;font-size:.85rem}
.rel th,.rel td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.rel th{background:var(--soft)}
.rel-top{display:grid;gap:14px}
@media (min-width:760px){.rel-top.has-foto{grid-template-columns:minmax(0,1fr) 300px}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:.9rem;align-content:start}
.kv b{color:var(--mut);font-weight:600}
@media (max-width:560px){.kv{grid-template-columns:110px 1fr}}
.foto-rel{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:0;object-fit:cover}
.hero{display:grid;gap:14px;align-items:center}
@media (min-width:760px){.hero{grid-template-columns:1fr 1fr}}
.resumo{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0}
.resumo>div{flex:1;min-width:130px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--soft)}
.resumo small{display:block}
.resumo strong{font-size:1.05rem}
.radar{width:100%;max-width:440px;display:block;margin:0 auto}
.radar .anel{fill:none;stroke:var(--bd);stroke-width:1}
.radar .eixo{stroke:var(--bd);stroke-width:1}
.radar .area{fill-opacity:.25;stroke-width:2.5}
.radar .ant{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:5 4}
.radar text{fill:var(--tx);font-size:11.5px;font-weight:600}
.radar .esc{fill:var(--mut);font-size:9px;font-weight:400}
.dom-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.domcard{border:1px solid var(--bd);border-top:5px solid var(--nd);border-radius:14px;padding:12px;background:var(--card)}
.domcard.n0{border-top-color:var(--n0)}.domcard.n1{border-top-color:var(--n1)}.domcard.n2{border-top-color:var(--n2)}.domcard.n3{border-top-color:var(--n3)}
.domcard .dh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.domcard p{font-size:.84rem;margin:.5em 0 0}
.so-print{display:none}
.mc-linha{display:flex;align-items:center;gap:8px;margin:4px 0}
.mc-rot{width:92px;font-size:.78rem;color:var(--mut);flex:none}
.mc-cel{display:flex;gap:3px;flex-wrap:wrap}
.mc{display:inline-block;width:20px;height:20px;border-radius:5px;background:var(--nd)}
.mc.n0{background:var(--n0)}.mc.n1{background:var(--n1)}.mc.n2{background:var(--n2)}.mc.n3{background:var(--n3)}.mc.nd{background:var(--ndb);border:1px dashed var(--nd)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.assin{display:flex;gap:30px;margin-top:40px}
.assin div{flex:1;border-top:1px solid var(--tx);padding-top:4px;font-size:.8rem;text-align:center}
/* ---- IA ---- */
.ia-txt{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;font-size:.9rem}
.ia-sec{margin:12px 0}
.ia-sec h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:4px}
.ia-sec ul{margin:.2em 0;padding-left:1.2em}
.ia-acao{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;background:var(--soft)}
.ia-acao .meta{font-size:.76rem;color:var(--mut);margin-top:4px}
.ia-box{border-left:5px solid #3b6fe0;background:color-mix(in srgb,#3b6fe0 8%,var(--card));border-radius:10px;padding:10px 12px}
.sugia{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px dashed var(--bd);padding:9px 0;font-size:.86rem}
.sugia .tx{flex:1;min-width:0}
.sugia small{display:block}
.mic{width:auto}
.mic.rec{background:#c62828;color:#fff;border-color:#c62828}
/* ---- histórico / painel ---- */
.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--ndb)}
.stack i{display:block}
.hist{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.hlist{display:grid;gap:12px}
@media (min-width:900px){.hlist{grid-template-columns:1fr 1fr}.hlist .hist{margin:0}}
.dots{display:flex;gap:4px;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ndb);border:1px solid var(--nd)}
.dots i.n0{background:var(--n0)}.dots i.n1{background:var(--n1)}.dots i.n2{background:var(--n2)}.dots i.n3{background:var(--n3)}
.banner{border:1.5px solid var(--verde2);background:color-mix(in srgb,var(--verde2) 10%,var(--card));border-radius:14px;padding:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;background:var(--card)}
.kpi strong{display:block;font-size:1.7rem}
.painel-grid{display:grid;gap:14px}
@media (min-width:900px){.painel-grid{grid-template-columns:1fr 1fr}.painel-grid .full{grid-column:1/-1}}
.alerta{border-left:5px solid var(--n2);background:var(--n2b);color:var(--n2t);padding:8px 10px;border-radius:8px;font-size:.85rem;margin:8px 0}
.sobre table{width:100%;border-collapse:collapse;font-size:.85rem}
.sobre td,.sobre th{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.sobre th{background:var(--soft)}
.sobre-grid{display:grid;gap:14px}
@media (min-width:1000px){.sobre-grid{grid-template-columns:1fr 1fr}.sobre-grid .full{grid-column:1/-1}}
@media (max-width:620px){
  .rel table.resp thead{display:none}
  .rel table.resp,.rel table.resp tbody{display:block}
  .rel table.resp tr{display:block;border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:6px 8px;background:var(--card)}
  .rel table.resp td{display:block;border:0;padding:4px 2px}
  .rel table.resp td::before{content:attr(data-l);display:block;font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
}

.so-desk{display:none;margin-top:8px}
@media (min-width:760px){.so-desk{display:block}}
.res-bottom{display:grid;gap:14px;align-items:start}
@media (min-width:1000px){.res-bottom{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.rel .hero>div{min-width:0}
.fig-svg text.sm{font-size:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#bbb;--soft:#f3f3f3;--fig:#222;

const TOTAL_ITENS = Object.keys(ITENS).length;

/* =====================================================================
   PONTUAÇÃO — por domínio, sem soma global
   ===================================================================== */
function nivelDaMedia(m){return m<0.5?0:m<1.5?1:m<2.25?2:3}
function valorItem(resp,id){const r=resp[id];return r&&typeof r.n==="number"?r.n:null}

function calcular(resp){
  const doms=DOMINIOS.map(d=>{
    const vals=d.itens.map(q=>valorItem(resp,q.id)).filter(v=>v!==null);
    const total=d.itens.length;
    const insuf=vals.length<Math.ceil(total/2);
    let media=null,nivel=null,elevado=false;
    const n3=vals.filter(v=>v===3).length;
    if(!insuf){
      media=vals.reduce((a,b)=>a+b,0)/vals.length;
      nivel=nivelDaMedia(media);
      // regra anti-diluição: um item Alto garante ao menos nível Alta; três itens Altos, Crítica
      const piso=n3>=3?3:n3>=1?2:0;
      if(piso>nivel){nivel=piso;elevado=true}
    }
    return {id:d.id,media,nivel,elevado,respondidos:vals.length,total,insuf,n3};
  });
  const validos=doms.filter(x=>!x.insuf);
  const pior=validos.length?Math.max(...validos.map(x=>x.nivel)):null;
  const resp_=doms.reduce((a,x)=>a+x.respondidos,0);
  return {doms,pior,respondidos:resp_,total:TOTAL_ITENS};
}

function prioridadeSugerida(calc,ctx){
  if(calc.pior===null)return {prio:null,porGravidade:false};
  let p=calc.pior,porGravidade=false;
  const grav=ctx.gravidade===""||ctx.gravidade==null?null:Number(ctx.gravidade);
  const fhMax=Math.max(-1,...calc.doms.filter(x=>!x.insuf&&DOMINIOS.find(d=>d.id===x.id).grupo==="fh").map(x=>x.nivel));
  if(grav!==null&&grav>=2&&fhMax>=2&&p<3){p+=1;porGravidade=true}
  return {prio:p,porGravidade};
}

function itensAtencao(resp,min=2){
  const out=[];
  DOMINIOS.forEach(d=>d.itens.forEach(q=>{const n=valorItem(resp,q.id);if(n!==null&&n>=min)out.push({dom:d,q,n})}));
  return out.sort((a,b)=>b.n-a.n);
}

/* =====================================================================
   ÍNDICE GERAL (0–100, 100 = adequado)
   Resumo para comparar e acompanhar. NÃO substitui o perfil por domínio:
   a média usa o nível efetivo de cada domínio (regra anti-diluição incluída)
   e o índice nunca fica acima do teto do domínio mais crítico.
   ===================================================================== */
const PISO_NIVEL=[0,0.5,1.5,2.25];
const TETO_IDX=[100,79,59,39];
const IDX_ROT=["Adequado","Atenção","Alerta","Crítico"];
function indice(res){
  const val=(res.doms||[]).filter(x=>x.nivel!==null&&x.nivel!==undefined&&x.media!==null&&x.media!==undefined);
  if(val.length<3)return null;
  const efet=val.map(x=>Math.max(x.media,PISO_NIVEL[x.nivel]));
  const m=efet.reduce((a,b)=>a+b,0)/efet.length;
  const pior=Math.max(...val.map(x=>x.nivel));
  const v=Math.round(Math.min(100*(1-m/3),TETO_IDX[pior]));
  const n=v>=80?0:v>=60?1:v>=40?2:3;
  return {v,n,rot:IDX_ROT[n],doms:val.length,de:res.doms.length};
}
function gaugeSvg(ind,grande){
  const L=Math.PI*80,v=ind?ind.v:0,cor=ind?`var(--n${ind.n})`:"var(--nd)";
  return `<svg class="gauge" ${grande?'style="max-width:300px"':""} viewBox="0 0 200 122" role="img" aria-label="Índice geral ${ind?ind.v+" de 100, "+ind.rot:"indisponível"}"><path class="trk" d="M20 104A80 80 0 0 1 180 104"/><path class="val" d="M20 104A80 80 0 0 1 180 104" stroke="${cor}" stroke-dasharray="${(L*v/100).toFixed(1)} ${L.toFixed(1)}"/><text x="100" y="90" font-size="40" font-weight="800">${ind?ind.v:"—"}</text><text x="100" y="113" font-size="11.5" font-weight="600" style="fill:var(--mut)">${ind?"de 100 · "+ind.rot:"mín. 3 domínios"}</text></svg>`;
}

/* =====================================================================
   FIGURAS ANIMADAS DE POSTURA (ergonomia física)
   Boneco de linhas em vista lateral, cinemática direta: cada pose é um
   conjunto de ângulos. Sem imagens, sem rede: funciona offline.
   Ângulos em graus, a partir da vertical para baixo; positivo = para a frente.
   ===================================================================== */
const FG={G:196,AX:118,W:300,H:232};
const SEG={th:38,sn:38,tk:44,ua:27,fa:25,hd:9};
const BASE={tr:0,nk:0,sh:8,el:25,wr:0,th:0,kn:0};
const rad=a=>a*Math.PI/180;
const f1_=n=>n.toFixed(1);
function cinematica(p){
  const sa=p.th-p.kn;
  const kx=SEG.th*Math.sin(rad(p.th)),ky=SEG.th*Math.cos(rad(p.th));
  const ox=kx+SEG.sn*Math.sin(rad(sa)),oy=ky+SEG.sn*Math.cos(rad(sa));
  const ankle=[FG.AX,FG.G-5];
  const hip=[ankle[0]-ox,ankle[1]-oy];
  const knee=[hip[0]+kx,hip[1]+ky];
  const sh=[hip[0]+SEG.tk*Math.sin(rad(p.tr)),hip[1]-SEG.tk*Math.cos(rad(p.tr))];
  const ha_=p.tr+p.nk;
  const hd=[sh[0]+(7+SEG.hd)*Math.sin(rad(ha_)),sh[1]-(7+SEG.hd)*Math.cos(rad(ha_))];
  const el=[sh[0]+SEG.ua*Math.sin(rad(p.sh)),sh[1]+SEG.ua*Math.cos(rad(p.sh))];
  const fa=p.sh+p.el;
  const wr=[el[0]+SEG.fa*Math.sin(rad(fa)),el[1]+SEG.fa*Math.cos(rad(fa))];
  const ha=fa+p.wr;
  const hand=[wr[0]+11*Math.sin(rad(ha)),wr[1]+11*Math.cos(rad(ha))];
  return {ankle,hip,knee,sh,hd,el,wr,hand,ha};
}
function desenhaFig(p,ex,lvl){
  const k=cinematica(p),cor=`var(--n${lvl})`,hl=new Set(ex.hl||[]);
  const ln=(a,b,nome,w)=>`<line x1="${f1_(a[0])}" y1="${f1_(a[1])}" x2="${f1_(b[0])}" y2="${f1_(b[1])}" stroke="${hl.has(nome)?cor:"var(--fig)"}" stroke-width="${w||7}" stroke-linecap="round"/>`;
  let s=`<line x1="14" y1="${FG.G}" x2="286" y2="${FG.G}" stroke="var(--bd)" stroke-width="2"/>`;
  // banco (aparece quando a pessoa senta)
  const op=Math.max(0,Math.min(1,(p.th-45)/35));
  if(op>0&&p.kn<=118){
    const y=k.hip[1]+5;
    s+=`<g opacity="${op.toFixed(2)}"><rect x="${f1_(k.hip[0]-17)}" y="${f1_(y)}" width="34" height="5" rx="2" fill="var(--mut)"/><line x1="${f1_(k.hip[0]-10)}" y1="${f1_(y+5)}" x2="${f1_(k.hip[0]-12)}" y2="${FG.G}" stroke="var(--mut)" stroke-width="3"/><line x1="${f1_(k.hip[0]+10)}" y1="${f1_(y+5)}" x2="${f1_(k.hip[0]+12)}" y2="${FG.G}" stroke="var(--mut)" stroke-width="3"/></g>`;
  }
  // carrinho/objeto empurrado (atrás do corpo)
  if(ex.obj==="carro"){
    const sz=ex.sz||24,x=k.hand[0]+2,y=k.hand[1]-sz/2;
    s+=`<rect x="${f1_(x)}" y="${f1_(y)}" width="${sz}" height="${sz}" rx="3" fill="#c8a26b" stroke="#8a6a3a" stroke-width="1.5"/><line x1="${f1_(x)}" y1="${f1_(y+sz)}" x2="${f1_(x+sz)}" y2="${f1_(y+sz)}" stroke="var(--mut)" stroke-width="3"/><line x1="${f1_(x+sz/2)}" y1="${f1_(y+sz)}" x2="${f1_(x+sz/2)}" y2="${FG.G-6}" stroke="var(--mut)" stroke-width="3"/><circle cx="${f1_(x+sz/2)}" cy="${FG.G-5}" r="5" fill="var(--mut)"/>`;
  }
  // pernas
  s+=ln(k.hip,k.knee,"perna")+ln(k.knee,k.ankle,"perna")+ln(k.ankle,[k.ankle[0]+15,FG.G-1.5],"perna",6);
  // tronco, pescoço, cabeça
  s+=ln(k.hip,k.sh,"tronco",9);
  s+=ln(k.sh,k.hd,"pescoco",5);
  s+=`<circle cx="${f1_(k.hd[0])}" cy="${f1_(k.hd[1])}" r="${SEG.hd}" fill="var(--card)" stroke="${hl.has("pescoco")?cor:"var(--fig)"}" stroke-width="3.5"/><circle cx="${f1_(k.hd[0]+4)}" cy="${f1_(k.hd[1]-1)}" r="1.4" fill="var(--fig)"/>`;
  // braço
  s+=ln(k.sh,k.el,"braco")+ln(k.el,k.wr,"antebraco")+ln(k.wr,k.hand,"mao",5);
  // objetos na mão
  const [hx,hy]=k.hand;
  if(ex.obj==="peca")s+=`<rect x="${f1_(hx-1)}" y="${f1_(hy-5)}" width="13" height="10" rx="2" fill="var(--laranja)"/>`;
  if(ex.obj==="ferramenta"){const tx=k.wr[0]+27*Math.sin(rad(k.ha)),ty=k.wr[1]+27*Math.cos(rad(k.ha));s+=`<line x1="${f1_(k.wr[0])}" y1="${f1_(k.wr[1])}" x2="${f1_(tx)}" y2="${f1_(ty)}" stroke="var(--laranja)" stroke-width="5" stroke-linecap="round"/><circle cx="${f1_(tx)}" cy="${f1_(ty)}" r="5.5" fill="var(--mut)"/>`}
  if(ex.obj==="caixa"){const sz=ex.sz||20;s+=`<rect x="${f1_(hx+sz*0.05)}" y="${f1_(hy-sz*0.75)}" width="${sz}" height="${sz}" rx="2.5" fill="#c8a26b" stroke="#8a6a3a" stroke-width="1.5"/>`}
  // marcas de esforço
  for(let i=0;i<(ex.marks||0);i++){const x=k.hd[0]-17-i*3,y=k.hd[1]-6+i*9;s+=`<line x1="${f1_(x)}" y1="${f1_(y)}" x2="${f1_(x-7)}" y2="${f1_(y-4)}" stroke="var(--n3)" stroke-width="2.4" stroke-linecap="round"/>`}
  // etiqueta de duração / frequência
  if(ex.tag)s+=`<text class="sm" x="292" y="16" text-anchor="end" style="fill:var(--n${lvl}t,var(--mut))">${esc(ex.tag)}</text>`;
  // linha do tempo (recuperação e pausas)
  if(ex.tl){
    const N=ex.tl.length,w=(262-(N-1)*3)/N;
    for(let i=0;i<N;i++){
      const c=ex.tl[i],f=c==="P"?"var(--n0)":c==="p"?"var(--n1)":c==="E"?"var(--n3)":"var(--nd)";
      s+=`<rect x="${f1_(19+i*(w+3))}" y="212" width="${f1_(w)}" height="10" rx="3" fill="${f}" opacity="${c==="W"?0.55:1}"/>`;
    }
    s+=`<polygon points="${f1_(19+ex.m*262-4)},205 ${f1_(19+ex.m*262+4)},205 ${f1_(19+ex.m*262)},211" fill="var(--tx)"/>`;
  }
  return s;
}

function alvoFig(id,lvl,t){
  const s=FIGS[id].n[lvl];
  const ex={obj:s.obj,sz:s.sz,tag:s.tag,hl:FIGS[id].hl,marks:s.marks};
  let p;
  if(s.tl){
    const N=s.tl.length,pos=((t%14)/14)*N,i=Math.min(N-1,Math.floor(pos)),fr=pos-i;
    let run=0;for(let j=0;j<i;j++){const c=s.tl[j];run=c==="P"?0:c==="p"?run*0.4:run+1}
    const c=s.tl[i];
    if(c==="P")p={...BASE,th:84,kn:84,tr:0,sh:10,el:34};
    else{
      const fat=Math.min(1,(run+fr)/(c==="p"?6:4.2))*(c==="E"?1.25:1);
      p={...BASE,tr:3+34*fat,nk:2+26*fat,sh:18+10*fat,el:62-10*fat};
    }
    ex.tl=s.tl;ex.m=pos/N;
    ex.obj=c==="P"?undefined:"peca";
  }else{
    p={...BASE,...s.p};
    if(s.q){
      const w=(1-Math.cos(2*Math.PI*t/(s.per||4)))/2,q={...p,...s.q};
      for(const k in p)p[k]=p[k]+(q[k]-p[k])*w;
    }
    p.tr+=Math.sin(t*1.7)*0.7;
  }
  return {p,ex};
}
const figInst=new Map();
let figObs=null,figUltimo=0,figLoop=false;

function iniciarFigs(){
  figInst.clear();if(figObs)figObs.disconnect();
  if("IntersectionObserver" in window)figObs=new IntersectionObserver(es=>es.forEach(e=>{const f=e.target._fig;if(f)f.vis=e.isIntersecting}),{rootMargin:"120px"});
  $$(".fig").forEach(el=>{
    const id=el.dataset.fig,r=estado.resp[id],ans=r&&typeof r.n==="number"?r.n:null;
    const f={el,id,g:$(".fg",el),svg:$("svg",el),capEl:$(".fig-cap",el),ans,lvl:ans===null?0:ans,auto:ans===null&&!REDUZ,vis:true,cur:null,tAuto:0,pausa:REDUZ,tCong:0};
    el._fig=f;figInst.set(id,f);if(figObs)figObs.observe(el);
    figNivel(f,f.lvl);
  });
  if(!figLoop){figLoop=true;requestAnimationFrame(quadroFig)}
}
function quadroFig(ts){
  requestAnimationFrame(quadroFig);
  if(ts-figUltimo<32||document.hidden)return;
  const dt=Math.min(.1,(ts-figUltimo)/1000);figUltimo=ts;
  figInst.forEach(f=>{
    if(!f.vis||!f.el.isConnected)return;
    if(!f.pausa)f.tCong=ts/1000;
    const t=REDUZ?0:f.tCong;
    if(f.auto&&!f.pausa){f.tAuto+=dt;if(f.tAuto>3.4)figNivel(f,(f.lvl+1)%4)}
    const a=alvoFig(f.id,f.lvl,t);
    if(!f.cur)f.cur={...a.p};else for(const k in a.p)f.cur[k]+=(a.p[k]-f.cur[k])*Math.min(1,dt*7);
    f.g.innerHTML=desenhaFig(f.cur,a.ex,f.lvl);
  });
}

function setPath(path,val){
  const ks=path.split(".");let o=estado;

function onCampo(e){
  const t=e.target;
  if(t.id==="foto"&&e.type==="change"){tratarFoto(t.files[0]);return}
  if(t.type==="radio"){
    if(t.name.startsWith("r_")){
      const id=t.name.slice(2);estado.resp[id]=estado.resp[id]||{};
      estado.resp[id].n=t.value==="na"?"na":Number(t.value);
      if(estado.resp[id].ia)delete estado.resp[id].ia;
      const f=figInst.get(id);
      if(f){f.ans=typeof estado.resp[id].n==="number"?estado.resp[id].n:null;f.auto=false;figNivel(f,f.ans===null?f.lvl:f.ans)}
      atualizarProgresso();atualizarLive();agendarSalvar();
    } else if(t.name.startsWith("e_")){
      const id=t.name.slice(2);estado.resp[id]=estado.resp[id]||{};
      estado.resp[id].ev=t.value;agendarSalvar();
    }
    return;
  }
  if(t.dataset.desc){sugDesc[t.dataset.desc]=Object.assign(sugDesc[t.dataset.desc]||{},{texto:t.value});return}
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);agendarSalvar();return}
  if(t.dataset.obs){const id=t.dataset.obs;estado.resp[id]=estado.resp[id]||{};estado.resp[id].obs=t.value;agendarSalvar();return}
  if(t.dataset.dom){const [id,c]=t.dataset.dom.split(".");estado.dom[id]=estado.dom[id]||{};estado.dom[id][c]=t.value;agendarSalvar();return}
  if(t.dataset.ac){const [i,c]=t.dataset.ac.split(".");if(estado.acoes[i]){estado.acoes[i][c]=t.value;agendarSalvar()}return}
}
function tratarFoto(arq){
  if(!arq)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const M=1000,esc_=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*esc_);c.height=Math.round(img.height*esc_);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      estado.foto=c.toDataURL("image/jpeg",0.72);sugFoto=null;
      $("#fotoBox").innerHTML=htmlFotoBox();
      agendarSalvar();
    };

    img.src=rd.result;
  };
  rd.readAsDataURL(arq);
}

function finalizar(){
  const calc=calcular(estado.resp);
  if(calc.respondidos===0){aviso("Responda pelo menos alguns itens antes de finalizar.");return}
  const insuf=calc.doms.filter(x=>x.insuf).map(x=>DOMINIOS.find(d=>d.id===x.id).nome);
  if(insuf.length&&!confirm("Estes domínios têm menos da metade dos itens avaliados e ficarão como \"dados insuficientes\":\n\n• "+insuf.join("\n• ")+"\n\nFinalizar mesmo assim?"))return;
  if(!estado.ctx.atividade&&!confirm("A atividade não foi informada. Finalizar mesmo assim?"))return;
  estado.acoes=estado.acoes.filter(a=>a.acao.trim());
  const agora=Date.now();
  if(!estado.criadoEm)estado.criadoEm=agora;
  const pr=prioridadeSugerida(calc,estado.ctx);
  const av={id:estado.id,versao:VERSAO_MODELO,criadoEm:estado.criadoEm,atualizadoEm:agora,
    ctx:{...estado.ctx},resp:JSON.parse(JSON.stringify(estado.resp)),dom:JSON.parse(JSON.stringify(estado.dom)),
    acoes:JSON.parse(JSON.stringify(estado.acoes)),ia:estado.ia||"",iaj:estado.iaj||null,foto:estado.foto||"",
    resultado:{doms:calc.doms,pior:calc.pior,prio:pr.prio,porGravidade:pr.porGravidade,respondidos:calc.respondidos,total:calc.total}};
  const i=lista.findIndex(a=>a.id===av.id);
  if(i>=0)lista[i]=av;else lista.unshift(av);
  salvarLista();
  try{localStorage.removeItem(CH_RASC)}catch(e){}
  estado.fase="resultado";
  render();window.scrollTo(0,0);
}
function avAtual(){return lista.find(a=>a.id===estado.id)}
function anterior(av){
  const k=norm(av.ctx.atividade)+"|"+norm(av.ctx.local);
  if(!norm(av.ctx.atividade))return null;
  return lista.filter(a=>!a.legado&&a.id!==av.id&&a.criadoEm<av.criadoEm&&(norm(a.ctx.atividade)+"|"+norm(a.ctx.local))===k)
    .sort((a,b)=>b.criadoEm-a.criadoEm)[0]||null;
}
function radarSvg(res,ant){
  const W=380,H=310,cx=190,cy=158,R=100,n=DOMINIOS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*(v/3)*Math.cos(ang(i)),cy+R*(v/3)*Math.sin(ang(i))];
  let s=`<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de exposição por domínio">`;
  [1,2,3].forEach(r=>{s+=`<polygon class="anel" points="${DOMINIOS.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`});
  DOMINIOS.forEach((d,i)=>{
    const [x,y]=pt(i,3);s+=`<line class="eixo" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx,ly]=pt(i,3.42),c=Math.cos(ang(i));
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${c>0.3?"start":c<-0.3?"end":"middle"}">${esc(d.curto)}</text>`;
  });
  [1,2,3].forEach(r=>{s+=`<text class="esc" x="${cx+3}" y="${(cy-R*r/3+10).toFixed(1)}">${r}</text>`});
  if(ant){
    const pts=ant.resultado.doms.map((x,i)=>pt(i,x.media??0).map(v=>v.toFixed(1)).join(",")).join(" ");
    s+=`<polygon class="ant" points="${pts}"/>`;
  }
  const cor=res.pior===null?"var(--nd)":`var(--n${res.pior})`;
  const pts=res.doms.map((x,i)=>pt(i,x.media??0).map(v=>v.toFixed(1)).join(",")).join(" ");
  s+=`<polygon class="area" points="${pts}" fill="${cor}" stroke="${cor}"/>`;
  res.doms.forEach((x,i)=>{const [px,py]=pt(i,x.media??0);s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${x.nivel===null?"var(--nd)":`var(--n${x.nivel})`}" stroke="#fff" stroke-width="1.5"><title>${esc(DOMINIOS[i].nome)}: ${fmtMedia(x.media)}</title></circle>`});
  return s+"</svg>";
}
function mapaCalor(resp){
  const linhas=DOMINIOS.map(d=>`<div class="mc-linha"><span class="mc-rot">${esc(d.curto)}</span><span class="mc-cel">${d.itens.map(q=>{const n=valorItem(resp,q.id);return `<i class="mc ${n===null?"nd":"n"+n}" title="${esc(q.t)}: ${n===null?"não avaliado":ROT_ITEM[n]}"></i>`}).join("")}</span></div>`).join("");
  return linhas+`<div class="leg"><span><i style="background:var(--n0)"></i>Adequado</span><span><i style="background:var(--n1)"></i>Baixa</span><span><i style="background:var(--n2)"></i>Moderada</span><span><i style="background:var(--n3)"></i>Alta</span><span><i style="border:1px dashed var(--nd)"></i>Não avaliado</span></div>`;
}
function divergencia(av,id){
  const p=av.dom&&av.dom[id]&&av.dom[id].perc;
  const r=av.resultado.doms.find(x=>x.id===id);
  if(p===""||p===undefined||r.media===null)return false;
  return Math.abs(Number(p)-r.media)>=1.5;
}

const URL_BASE="https://ergocontexto-ia.raul-almeida-siqueira.workers.dev";
const URL_IA=URL_BASE+"/api/ergo";
function payloadIA(av){
  const ind=indice(av.resultado);
  const monta=(simples)=>({
    versao:VERSAO_MODELO,
    atividade:av.ctx.atividade,funcao:av.ctx.funcao,
    indiceGeral:ind?{valor:ind.v,faixa:ind.rot}:"indisponível",
    gravidadePotencial:av.ctx.gravidade!==""&&av.ctx.gravidade!=null?GRAVIDADES[av.ctx.gravidade]:"não informada",
    exposicaoJornada:av.ctx.exposicao!==""&&av.ctx.exposicao!=null?EXPOSICOES[av.ctx.exposicao]:"não informada",
    prioridadeSugerida:av.resultado.prio===null?"indefinida":PRIOS[av.resultado.prio],
    observacoesGerais:(av.ctx.obs||"").slice(0,600),
    dominios:DOMINIOS.map((d,i)=>{
      const r=av.resultado.doms[i],dm=(av.dom&&av.dom[d.id])||{};
      return {dominio:d.nome,grupo:GRUPOS[d.grupo],media:r.media===null?null:Number(r.media.toFixed(2)),
        nivel:r.nivel===null?"dados insuficientes":NIVEIS[r.nivel].curto,itensAvaliados:`${r.respondidos}/${r.total}`,
        percepcaoTrabalhadores:dm.perc!==""&&dm.perc!==undefined?["sem incômodo","pouco incômodo","incômodo moderado","muito incômodo"][dm.perc]:"não coletada",
        fatoresProtecao:(dm.prot||"").slice(0,300),
        itensAtencao:d.itens.map(q=>({q,n:valorItem(av.resp,q.id)})).filter(x=>x.n!==null&&x.n>=2).map(x=>{
          const r2=av.resp[x.q.id]||{};
          const o={item:x.q.t,nivel:ROT_ITEM[x.n],fonte:r2.ev||"não informada",observacao:(r2.obs||"").slice(0,300)};
          if(!simples)o.criterio=x.q.c[x.n];
          return o;
        })};
    })
  });
  let p=monta(false);
  if(JSON.stringify(p).length>20000)p=monta(true);
  return p;
}
async function chamarIA(rota,corpo){
  const r=await fetch(URL_BASE+rota,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.erro||"falha");
  return j;
}
function htmlIA(av){
  const j=av.iaj;

  const acoes=(j.acoes||[]).map((a,i)=>`<div class="ia-acao"><div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between"><div><b>${esc(a.acao)}</b>
    <div class="meta">${esc(a.dominio||"Geral")}${a.tipoControle?" · "+esc(a.tipoControle):""}${a.prioridade?" · prioridade "+esc(a.prioridade):""}</div>${a.porque?`<div class="meta">${esc(a.porque)}</div>`:""}</div>
    ${a.add?'<span class="bd n0" style="flex:none">✔ no plano</span>':`<button class="btn peq sec" style="flex:none" data-acao="ia-add" data-i="${i}">＋ Plano</button>`}</div></div>`).join("");
  return `<div style="margin-top:12px">

    ${j.sintese?`<div class="ia-sec"><h4>Síntese técnica</h4><p>${esc(j.sintese)}</p></div>`:""}
    ${(j.leituraDominios||[]).length?`<div class="ia-sec"><h4>Leitura por domínio</h4>${j.leituraDominios.map(l=>`<p><b>${esc(l.dominio)}:</b> ${esc(l.leitura)}</p>`).join("")}</div>`:""}
    ${lista_("Pontos prioritários",j.pontosPrioritarios)}
    ${lista_("Perguntas para aprofundar",j.perguntas)}
    ${lista_("O que preservar (fatores de proteção)",j.fatoresProtecao)}
    ${acoes?`<div class="ia-sec"><h4>Ações sugeridas</h4>${acoes}</div>`:""}
    ${j.especialista?`<div class="ia-sec"><h4>Avaliação especializada</h4><p><b>${j.especialista.necessario?"Recomendada":"Não indicada neste momento"}.</b> ${esc(j.especialista.motivo||"")}</p></div>`:""}
    <p><small>Sugestões para validação do avaliador. A IA não altera pontuação nem classificação.</small></p></div>`;
}
async function analisarIA(){
  const av=avAtual();if(!av)return;
  const btn=$("#btnIA"),msg=$("#msgIA");
  btn.disabled=true;btn.textContent="⏳ Analisando...";msg.innerHTML="";
  try{
    const j=await chamarIA("/api/ergo",payloadIA(av));
    if(!j.analise&&!j.estruturado)throw new Error("falha");
    av.iaj=j.estruturado||null;av.ia=j.analise||"";av.atualizadoEm=Date.now();salvarLista();
    const y=window.scrollY;renderResultado();window.scrollTo(0,y);
    $("#blocoIA").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    msg.innerHTML=`<div class="alerta">Não foi possível gerar a análise. Verifique a internet e tente novamente.${e.message&&e.message!=="falha"?" ("+esc(e.message)+")":""}</div>`;
    btn.disabled=false;btn.textContent="Analisar com IA";
  }
}
function mapaTipo(t){
  const n=norm(t);
  if(n.startsWith("elimin"))return CONTROLES[0];
  if(n.startsWith("substit"))return CONTROLES[1];
  if(n.startsWith("engenh"))return CONTROLES[2];
  if(n.startsWith("admin"))return CONTROLES[3];
  if(n.startsWith("epi"))return CONTROLES[4];
  return "";
}
function iaAcaoParaPlano(i){
  const av=avAtual();if(!av||!av.iaj||!av.iaj.acoes[i]||av.iaj.acoes[i].add)return;
  const a=av.iaj.acoes[i];
  const dom=DOMINIOS.find(d=>norm(d.nome)===norm(a.dominio));
  const prio=PRIOS.find(p=>norm(p)===norm(a.prioridade))||"Média";
  av.acoes.push({dom:dom?dom.id:"",tipo:mapaTipo(a.tipoControle),acao:a.acao+" (sugestão da IA, validar)",resp:"",prazo:"",prio,status:"Aberta",origem:""});
  a.add=true;av.atualizadoEm=Date.now();salvarLista();
  const y=window.scrollY;renderResultado();window.scrollTo(0,y);aviso("Ação adicionada ao plano. Defina responsável e prazo em Editar respostas → Plano.");
}
function iaParaPlano(){
  const av=avAtual();if(!av||!av.ia)return;
  const ini=av.ia.indexOf("SUGESTÕES DE AÇÃO:"),fim=av.ia.indexOf("NECESSIDADE DE AVALIAÇÃO");
  if(ini<0){aviso("Não encontrei a seção de sugestões na análise.");return}
  const bloco=av.ia.substring(ini+18,fim>ini?fim:undefined);
  const linhas=bloco.split("\n").map(l=>l.replace(/^\s*(?:[-•*–]|\d+[.)])\s*/,"").trim()).filter(l=>l.length>8);
  if(!linhas.length){aviso("Nenhuma sugestão identificada.");return}
  linhas.slice(0,5).forEach(l=>av.acoes.push({dom:"",tipo:"",acao:l+" (sugestão da IA, validar)",resp:"",prazo:"",prio:"Média",status:"Aberta",origem:""}));
  av.atualizadoEm=Date.now();salvarLista();renderResultado();aviso(linhas.slice(0,5).length+" sugestões adicionadas ao plano. Edite em Editar respostas → Plano.");
}

function htmlSugDesc(did){
  const s=sugDesc[did];if(!s)return "";
  if(s.carregando)return `<p class="mut">⏳ Analisando a descrição…</p>`;
  if(s.erro)return `<div class="alerta">${esc(s.erro)}</div>`;
  if(!s.res)return "";
  const r=s.res;
  return `${r.resumo?`<div class="ia-box" style="margin-top:10px">${esc(r.resumo)}</div>`:""}
    ${r.itens.length?`<h4 style="margin:12px 0 0">Sugestões de nível (você decide)</h4>${htmlSugItens(r,"desc")}`:'<p class="mut">A descrição não trouxe base suficiente para sugerir níveis. Acrescente detalhes (posturas, tempos, esforços).</p>'}
    ${(r.semInformacao||[]).length?`<p><small>Sem informação na descrição: ${r.semInformacao.map(id=>esc(ITENS[id]?ITENS[id].t:id)).join(", ")}.</small></p>`:""}`;
}
async function iaFoto(){
  if(!estado.foto)return;
  sugFoto={carregando:true};$("#fotoIA").innerHTML=htmlSugFoto();
  try{
    const res=await chamarIA("/api/ergo/foto",{imagem:estado.foto,atividade:estado.ctx.atividade,catalogo:catalogo(["f1","f2","f3","f4","f5","f6","f7","f8","a1","a5"])});
    sugFoto={res};
  }catch(e){sugFoto={erro:"Não foi possível analisar a foto agora. "+(e.message&&e.message!=="falha"?e.message:"Verifique a internet e tente de novo.")}}
  const el=$("#fotoIA");if(el)el.innerHTML=htmlSugFoto();
}
async function iaDescrever(did){
  const d=DOMINIOS.find(x=>x.id===did),ta=$(`[data-desc="${did}"]`);
  const texto=(ta?ta.value:"").trim();
  if(texto.length<12){aviso("Descreva um pouco mais o que você observou.");return}
  sugDesc[did]={texto,carregando:true};$(`#sug_${did}`).innerHTML=htmlSugDesc(did);
  try{
    const res=await chamarIA("/api/ergo/descrever",{texto,catalogo:catalogo(d.itens.map(q=>q.id))});
    sugDesc[did]={texto,res};
  }catch(e){sugDesc[did]={texto,erro:"Não foi possível analisar agora. "+(e.message&&e.message!=="falha"?e.message:"Verifique a internet e tente de novo.")}}
  const el=$(`#sug_${did}`);if(el)el.innerHTML=htmlSugDesc(did);
}
function aplicarSug(id,n,fonte){
  const alvo=(fonte==="foto"?sugFoto&&sugFoto.res:sugDesc[ITENS[id].dom]&&sugDesc[ITENS[id].dom].res);
  const s=alvo&&alvo.itens.find(x=>x.id===id&&x.nivel===n);
  const r=estado.resp[id]=estado.resp[id]||{};
  r.n=n;r.ev=fonte==="foto"?"Estimado":"Observado";r.ia=true;
  if(s&&s.motivo)r.obs=(r.obs?r.obs+" · ":"")+"IA: "+s.motivo;
  agendarSalvar();
  const y=window.scrollY;
  if(fonte==="foto"){$("#fotoIA").innerHTML=htmlSugFoto();atualizarProgresso();atualizarLive()}
  else{render();window.scrollTo(0,y)}
}
let reconhecedor=null;
function ditar(did,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){aviso("Este navegador não tem ditado. Use o microfone do teclado do celular.");return}
  if(reconhecedor){reconhecedor.stop();return}
  const ta=$(`[data-desc="${did}"]`);
  const rc=new SR();rc.lang="pt-BR";rc.continuous=true;rc.interimResults=false;
  rc.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){ta.value=(ta.value?ta.value.trim()+" ":"")+e.results[i][0].transcript.trim();sugDesc[did]=Object.assign(sugDesc[did]||{},{texto:ta.value})}}};
  rc.onend=()=>{reconhecedor=null;btn.classList.remove("rec");btn.textContent="🎤 Ditar"};
  rc.onerror=()=>{aviso("Não consegui usar o microfone. Verifique a permissão do navegador.")};
  reconhecedor=rc;btn.classList.add("rec");btn.textContent="⏹ Parar";
  try{rc.start()}catch(e){reconhecedor=null}
}

function carregarParaEstado(a,fase){
  estado={id:a.id,criadoEm:a.criadoEm,passo:0,fase,ctx:{...a.ctx},resp:JSON.parse(JSON.stringify(a.resp)),dom:JSON.parse(JSON.stringify(a.dom||{})),

function csv(rows){
  const cel=c=>{c=String(c??"");if(/^[=+\-@\t\r]/.test(c))c="'"+c;return /[;"\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c};
  return "﻿"+rows.map(r=>r.map(cel).join(";")).join("\r\n");
}
function baixar(nome,conteudo,tipo){
  const b=new Blob([conteudo],{type:tipo});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);
}
function exportar(tipo){
  const L=lista.filter(a=>!a.legado);
  if(tipo==="json")return baixar(`ergocontexto-backup-${hojeISO()}.json`,JSON.stringify({app:"ergocontexto",versao:VERSAO_MODELO,exportadoEm:Date.now(),avaliacoes:lista}),"application/json");
  if(tipo==="av"){
    const cab=["ID","Data","Unidade","Área","Local","Atividade","Função","Avaliador","Índice geral (0-100)","Prioridade sugerida","Domínio mais crítico",...DOMINIOS.flatMap(d=>[d.nome+" (média)",d.nome+" (nível)"]),"Itens avaliados"];
    const rows=L.map(a=>{const ind=indice(a.resultado);return [a.id,fmtData(a.ctx.data),a.ctx.unidade,a.ctx.area,a.ctx.local,a.ctx.atividade,a.ctx.funcao,a.ctx.avaliador,ind?ind.v:"",a.resultado.prio===null?"":PRIOS[a.resultado.prio],a.resultado.pior===null?"":NIVEIS[a.resultado.pior].curto,
      ...a.resultado.doms.flatMap(r=>[r.media===null?"":fmtMedia(r.media),r.nivel===null?"Dados insuficientes":NIVEIS[r.nivel].curto]),`${a.resultado.respondidos}/${a.resultado.total}`]});
    return baixar(`ergocontexto-avaliacoes-${hojeISO()}.csv`,csv([cab,...rows]),"text/csv;charset=utf-8");
  }
  if(tipo==="ac"){
    const cab=["Avaliação","Atividade","Local","Domínio","Tipo de controle","Ação","Responsável","Prazo","Prioridade","Status"];
    const rows=L.flatMap(a=>a.acoes.map(x=>[a.id,a.ctx.atividade,a.ctx.local,x.dom?DOMINIOS.find(d=>d.id===x.dom).nome:"Geral",x.tipo,x.acao,x.resp,fmtData(x.prazo),x.prio,x.status]));
    return baixar(`ergocontexto-acoes-${hojeISO()}.csv`,csv([cab,...rows]),"text/csv;charset=utf-8");
  }
}
function importarJSON(arq){
  if(!arq)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=="ergocontexto"||!Array.isArray(d.avaliacoes))throw new Error();
      const ids=new Set(lista.map(a=>a.id));let novos=0;
      d.avaliacoes.forEach(a=>{
        if(!a||!a.id||ids.has(a.id))return;
        if(!a.legado&&(!a.resultado||!Array.isArray(a.resultado.doms)||a.resultado.doms.length!==DOMINIOS.length||!a.ctx||!a.resp||!Array.isArray(a.acoes)))return;
        lista.push(a);ids.add(a.id);novos++;
      });
      lista.sort((x,y)=>(y.criadoEm||0)-(x.criadoEm||0));
      salvarLista();renderHistorico();aviso(novos+" avaliação(ões) importada(s).");
    }catch(e){aviso("Arquivo inválido. Use um backup gerado por este aplicativo.")}
  };
  rd.readAsText(arq);
}

function renderSobre(){
  $("#v-sobre").innerHTML=`
  <div class="sobre-grid">
  <div class="card full"><h2>Sobre o método</h2>
    <p>O ErgoContexto é uma ferramenta de <b>triagem</b>: identifica onde olhar primeiro e qual o próximo passo. Não constitui AET, laudo ergonômico, avaliação quantitativa ou avaliação especializada, e não declara conformidade legal.</p>
    <h3>Por que dois lados, em 5 domínios?</h3>
    <p>Ergonomia e fatores humanos respondem a perguntas diferentes. A <b>ergonomia</b> pergunta o que a atividade exige do corpo e da mente e se isso pode causar adoecimento. Os <b>fatores humanos</b> perguntam o que, no sistema, torna o desempenho confiável ou propenso a erro. Por isso o resultado é um perfil de 5 domínios; o índice geral resume, mas não esconde o domínio crítico.</p>
    <table><thead><tr><th>Domínio</th><th>Grupo</th><th>Referências</th></tr></thead><tbody>
    ${DOMINIOS.map(d=>`<tr><td>${d.ico} <b>${esc(d.nome)}</b></td><td>${esc(GRUPOS[d.grupo])}</td><td>${esc(d.ref)}</td></tr>`).join("")}
    </tbody></table>
  </div>
  <div class="card"><h3>Como a pontuação funciona</h3>
    <ul>
      <li>Cada item tem 4 níveis com critério objetivo: Adequado (0), Baixa (1), Moderada (2), Alta (3).</li>
      <li>Itens <i>não avaliados</i> ficam fora da média. Com menos da metade dos itens avaliada, o domínio aparece como <b>dados insuficientes</b>.</li>
      <li>Nível do domínio pela média: <b>Baixa</b> até 0,49 · <b>Moderada</b> 0,50 a 1,49 · <b>Alta</b> 1,50 a 2,24 · <b>Crítica</b> a partir de 2,25.</li>
      <li><b>Regra anti-diluição:</b> um item Alta garante ao menos nível Alta ao domínio, e três itens Alta garantem Crítica.</li>
      <li><b>Prioridade sugerida:</b> vem do domínio mais crítico. Gravidade potencial Grave ou Muito grave com fator humano em Alta ou Crítica sobe um nível.</li>
      <li>Cada domínio indica o próximo passo na lógica <b>SOBANE</b> (Déparis → Observação → Análise → Perícia) e os métodos para aprofundar.</li>
    </ul>
    <h3>Limites</h3>
    <p>Os critérios são versões simplificadas, inspiradas na literatura. Não herdam a validade dos instrumentos completos (RULA, REBA, NIOSH, OCRA, NASA-TLX, COPSOQ etc.). Ruído, calor, vibração e iluminação exigem medição. Percepção dos trabalhadores e fatores de proteção entram como contexto e não alteram a pontuação.</p>
  </div>
  <div class="card"><h3>Índice geral (0 a 100)</h3>
    <p>É um resumo para comparar atividades e acompanhar a evolução. <b>100 = adequado</b>.</p>
    <ul>
      <li>Parte da média de cada domínio avaliado, já com a regra anti-diluição, e converte para a escala de 0 a 100.</li>
      <li><b>O domínio mais crítico limita o índice</b>: com um domínio Moderado o índice não passa de 79; Alto, de 59; Crítico, de 39.</li>
      <li>Faixas: <b>80 a 100</b> Adequado · <b>60 a 79</b> Atenção · <b>40 a 59</b> Alerta · <b>0 a 39</b> Crítico.</li>
      <li>Só é calculado com pelo menos 3 domínios avaliados.</li>
      <li>É um indicador de gestão deste aplicativo, não um índice normatizado. Decisões devem se apoiar no perfil por domínio.</li>
    </ul>
    <h3>Bonecos de postura</h3>
    <p>Na ergonomia física, cada item traz um boneco animado com exemplos dos quatro níveis. São ilustrações esquemáticas para alinhar o olhar do avaliador, não medições de ângulo.</p>
    <h3>Análise por IA</h3>
    <p>A IA resume o perfil, sugere ações, lê uma foto e converte uma descrição falada ou escrita em níveis sugeridos. Ela não altera pontuação nem classificação, não avalia o trabalhador, e todo nível ou ação só entra quando você aplica.</p>
    <p><small>Modelo de pontuação v${VERSAO_MODELO} · Aplicativo v3</small></p>
  </div></div>`;
}

  const nav=e.target.closest("#nav button");
  if(nav){irPara(nav.dataset.v);return}
  const b=e.target.closest("[data-acao]");if(!b)return;
  const id=b.dataset.id;
  switch(b.dataset.acao){
    case "passo":irPasso(Number(b.dataset.i));break;
    case "avancar":irPasso(estado.passo+1);break;
    case "voltar":irPasso(estado.passo-1);break;
    case "finalizar":finalizar();break;
    case "live":{const l=$("#live");l.classList.toggle("open");b.setAttribute("aria-expanded",l.classList.contains("open"));break}
    case "fig-nivel":{const f=b.closest(".fig")._fig;f.auto=false;figNivel(f,Number(b.dataset.n));break}
    case "fig-play":{const f=b.closest(".fig")._fig;f.pausa=!f.pausa;if(!f.pausa&&f.ans===null)f.auto=true;if(f.pausa)f.auto=false;b.textContent=f.pausa?"▶":"⏸";b.setAttribute("aria-label",f.pausa?"Retomar animação":"Pausar animação");break}
    case "rmfoto":estado.foto="";sugFoto=null;$("#fotoBox").innerHTML="";agendarSalvar();break;
    case "ia-foto":iaFoto();break;
    case "ia-desc":iaDescrever(b.dataset.d);break;
    case "mic":ditar(b.dataset.d,b);break;
    case "aplicar":aplicarSug(id,Number(b.dataset.n),b.dataset.src);break;
    case "ia-add":iaAcaoParaPlano(Number(b.dataset.i));break;
    case "nova-acao":novaAcao();render();window.scrollTo(0,document.body.scrollHeight);agendarSalvar();break;
    case "rm-acao":estado.acoes.splice(Number(b.dataset.i),1);render();agendarSalvar();break;
    case "acao-de-item":{const q=ITENS[b.dataset.q];novaAcao({dom:q.dom,origem:q.id,prio:valorItem(estado.resp,q.id)===3?"Alta":"Média"});render();window.scrollTo(0,document.body.scrollHeight);agendarSalvar();break}
    case "retomar":{const r=lerJSON(CH_RASC,null);if(r){estado=r;estado.fase="wizard";sugFoto=null;sugDesc={};render()}break}
    case "descartar":try{localStorage.removeItem(CH_RASC)}catch(_){}renderBanner();break;
    case "imprimir":window.print();break;
    case "editar":estado.fase="wizard";estado.passo=0;render();window.scrollTo(0,0);break;
    case "nova":if(confirm("Iniciar uma nova avaliação em branco?")){estado=novoEstado();sugFoto=null;sugDesc={};render();window.scrollTo(0,0)}break;
    case "ia":analisarIA();break;
    case "ia-para-plano":iaParaPlano();break;
    case "abrir":{const a=lista.find(x=>x.id===id);if(a)carregarParaEstado(a,"resultado");break}
    case "editar-h":{const a=lista.find(x=>x.id===id);if(a)carregarParaEstado(a,"wizard");break}
    case "reavaliar":{const a=lista.find(x=>x.id===id);if(a){const c={...a.ctx,data:hojeISO()};estado=novoEstado(c);estado.foto="";sugFoto=null;sugDesc={};irPara("avaliar")}break}
    case "del":if(confirm("Excluir esta avaliação?")){lista=lista.filter(x=>x.id!==id);salvarLista();renderHistorico()}break;
    case "limpar":if(confirm("Apagar TODAS as avaliações deste aparelho? Faça backup antes.")){lista=[];salvarLista();renderHistorico()}break;
    case "exp-json":exportar("json");break;
    case "exp-csv-av":exportar("av");break;
    case "exp-csv-ac":exportar("ac");break;
    case "imp-json":$("#impArq").click();break;
  }
});
$("#palco").addEventListener("input",onCampo);
$("#palco").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.status!==undefined){
    const av=avAtual();if(av&&av.acoes[t.dataset.status]){av.acoes[t.dataset.status].status=t.value;av.atualizadoEm=Date.now();salvarLista();aviso("Status atualizado.")}
    return;
  }
  onCampo(e);
});
window.addEventListener("beforeunload",salvarRascunho);

/* =====================================================================
   INÍCIO
   ===================================================================== */
migrarLegado();
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
