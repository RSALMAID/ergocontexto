    return `<div class="sug"><span><b>${esc(d.numero||"(número após sincronizar)")}</b> · ${esc((d.acao||d.problema||"").slice(0,90))}<br><small>${esc(d.postoId?caminho(d.postoId):"")}${d.responsavel?" · resp.: "+esc(d.responsavel):""}${d.hier!==""?" · "+esc(HIER[Number(d.hier)]):""}</small></span><span class="linha" style="flex-direction:column;align-items:flex-end;gap:4px"><span class="bd ${["n0","n1","n2","n3"][Number(d.prioridade)||0]}">${PRI_AC[Number(d.prioridade)||0].split(" ")[0]}</span><span class="bd ${d.status==="eficaz"?"n0":d.status==="concluida"?"n1":"nd"}">${stAcao(d.status)}</span>${at?`<span class="bd n3">${at} d de atraso</span><small>${escalonar(at)}</small>`:d.prazo&&ABERTA_AC(d.status)?`<small>prazo ${dataBR(d.prazo)}</small>`:""}<button class="btn sec peq" data-g-acao="ac-abrir" data-id="${r.id}">Abrir</button></span></div>`}).join("")||`<p class="mut">Nenhuma ação neste filtro.</p>`;
  el.innerHTML=`<div class="card"><div class="linha" style="justify-content:space-between"><h2 style="margin:0">Plano de ação</h2><button class="btn" data-g-acao="ac-nova">+ Nova ação</button></div>
  <p class="mut">Toda condição relevante gera uma ação rastreável. <b>Concluída não é eficaz</b>: a eficácia exige evidência e aprovação técnica.</p>
  <div class="kpis"><div><b>${todas.filter(x=>ABERTA_AC(x.d.status)).length}</b><small>abertas</small></div><div><b style="color:#FF3300">${todas.filter(x=>diasAtraso(x.d)>0).length}</b><small>vencidas</small></div><div><b>${n("concluida")}</b><small>aguardando eficácia</small></div><div><b style="color:#01688A">${n("eficaz")}</b><small>eficazes</small></div></div>
  <div class="subtabs">${chips}</div></div><div class="card">${cards}</div>`;
}

  };

    `<label class="campo">Demanda vinculada<select data-g="demandaId" ${dis}><option value="">(sem demanda)</option>${sel1(regOf("dem").map(r=>[r.id,(r.d.numero||"(pendente)")+" · "+r.d.origem]),d.demandaId||"")}</select></label>${vinculoHtml(d,dis)}

  return `<div class="card no-print"><button class="btn sec peq" data-g-acao="ed-voltar">← Plano de ação</button><h2 style="margin-top:12px">Ação ${esc(d.numero||"(número após sincronizar)")}${dem?` <small class="mut">· demanda ${esc(dem.d.numero||"")}</small>`:""}</h2>${lock?`<div class="alerta">Ação ${stAcao(d.status).toLowerCase()}: bloqueada para edição.</div>`:`<small class="mut">Salvamento automático neste aparelho.</small>`}</div>${corpo}`;

function acaoLog(r,acao,motivo){(r.d.hist=r.d.hist||[]).push({em:hojeISO(),acao,por:(autorAtual()||{}).nome||"",motivo:motivo||""})}
function passoAcao(p){
  const r=regGet(G.ed.id);if(!r)return;
  gravarEd();const d=G.ed.d,s=d.status;
  const treino=d.hier!==""&&Number(d.hier)===9;
  const sair=()=>{G.ed.d=JSON.parse(JSON.stringify(r.d));regGravar(r);reRender()};
  if(p==="planejada"){
    if(!(d.acao||"").trim()||!(d.responsavel||"").trim()){aviso("Informe a ação e o responsável.");return}
    if(treino&&!(d.justTreino||"").trim()){aviso("Justifique o uso de treinamento como medida.");return}
    r.d=JSON.parse(JSON.stringify(d));r.d.status="planejada";acaoLog(r,"Aprovada e planejada");sair();return}
  if(p==="execucao"){r.d=JSON.parse(JSON.stringify(d));r.d.status="execucao";acaoLog(r,"Execução iniciada");sair();return}
  if(p==="concluida"){
    if(!d.dataReal){aviso("Informe a data realizada.");return}
    if(!(d.evid||[]).some(e=>e.fase==="conclusao"||e.fase==="depois")){aviso("Anexe uma evidência de conclusão (fase Conclusão ou Depois).");return}
    r.d=JSON.parse(JSON.stringify(d));r.d.status="concluida";if(!r.d.ef.prevista)r.d.ef.prevista=somaDias(30);acaoLog(r,"Concluída (execução terminada; a eficácia ainda não foi verificada)");sair();return}
  if(p==="verificacao"){r.d=JSON.parse(JSON.stringify(d));r.d.status="verificacao";if(!r.d.ef.prevista)r.d.ef.prevista=somaDias(30);acaoLog(r,"Enviada para verificação de eficácia");sair();return}
  if(p==="voltar"){const ant={planejada:"proposta",execucao:"planejada",concluida:"execucao",verificacao:"concluida"}[s];if(!ant)return;r.d=JSON.parse(JSON.stringify(d));r.d.status=ant;acaoLog(r,"Voltou para "+stAcao(ant));sair();return}
  if(p==="cancelada"){const m=prompt("Motivo do cancelamento:","");if(!m||!m.trim())return;r.d=JSON.parse(JSON.stringify(d));r.d.status="cancelada";acaoLog(r,"Cancelada",m);sair();return}
  if(p==="reabrir"){if(!quemEdita())return;const m=prompt("Motivo da reabertura:","");if(!m||!m.trim())return;r.d=JSON.parse(JSON.stringify(d));r.d.status="execucao";acaoLog(r,"Reaberta",m);sair()}
}
function decidirEficacia(){
  if(!quemEdita()){aviso("Somente o administrador aprova a eficácia.");return}
  gravarEd();const r=regGet(G.ed.id),d=G.ed.d,ev=d.evid||[];
  const f=[];
  if(!ev.some(e=>e.fase==="antes")||!ev.some(e=>e.fase==="depois"))f.push("fotos antes e depois");
  if(!d.ef.reaval)f.push("data da nova observação");
  if(!d.ef.trabalhadores)f.push("confirmação dos trabalhadores");
  if(!d.ef.residual)f.push("risco residual");
  efExtra(d).forEach(x=>f.push(x));
  if(!d.ef.decisao)f.push("decisão");
  if(f.length){aviso("Falta: "+f.join("; ")+".");return}
  r.d=JSON.parse(JSON.stringify(d));r.d.ef.aprovadoPor=(perfil&&perfil.nome)||"";r.d.ef.aprovadoEm=hojeISO();
  if(d.ef.decisao==="Encerrar como eficaz"){
    if(d.ef.residual==="Crítico"&&!confirm("O risco residual está Crítico. Encerrar como eficaz mesmo assim?"))return;
    r.d.status="eficaz";acaoLog(r,"Eficácia aprovada",d.ef.obs||d.ef.comparacao||"");
  }else if(d.ef.decisao==="Reabrir a ação"){r.d.status="execucao";acaoLog(r,"Ineficaz: ação reaberta",d.ef.comparacao||"")}
  else if(/^Não eficaz/.test(d.ef.decisao)){r.d.status="naoeficaz";acaoLog(r,"Registrada como não eficaz",d.ef.comparacao||"")}
  else{r.d.status="parcial";acaoLog(r,"Parcialmente eficaz: complementar com nova ação",d.ef.comparacao||"");}
  G.ed.d=JSON.parse(JSON.stringify(r.d));regGravar(r);
  if(/^(Parcialmente eficaz|Complementar|Não eficaz)/.test(d.ef.decisao)){const n=novaAcao({demandaId:d.demandaId,postoId:d.postoId,atividadeId:d.atividadeId,origemId:r.id,problema:(/^Não/.test(d.ef.decisao)?"Ação sem eficácia ":"Complemento da ação ")+(d.numero||"")+": "+(d.problema||""),prioridade:d.prioridade});regGravar(n);G.ed=n;G.ed.novo=false;aviso("Criada nova ação para complementar.")}
  renderAcoes();
}
function acoesDoItem(tipo,regId){
  const r=regGet(regId);if(!r)return;
  gravarEd();const d=r.d,c=aepClasse(d);
  const itens=[];c.cats.forEach(cat=>cat.itens.forEach(i=>itens.push({cat:cat.nome,i})));
  const existentes=regOf("acao").filter(a=>a.d.origemId===regId).map(a=>a.d.origemItem);
  const novos=itens.filter(x=>!existentes.includes(x.i.k));
  if(!novos.length){aviso(itens.length?"Já existem ações para todos os itens em Alto/Crítico.":"Nenhum item em Alto ou Crítico nesta AEP.");return}
  if(!confirm("Criar "+novos.length+" ação(ões) a partir dos itens em Alto/Crítico? Você completa depois.")) return;
  novos.forEach(x=>{const n=novaAcao({demandaId:d.demandaId,postoId:d.postoId,atividadeId:d.atividadeId,origemId:regId,origemItem:x.i.k,problema:x.cat+": "+x.i.t+" ("+NIV_F[x.i.n]+")",prioridade:String(x.i.n===3?3:2),prazo:somaDias(PRAZO_AC[x.i.n===3?3:2]),causa:""});delete n.novo;regGravar(n)});
  aviso(novos.length+" ação(ões) criada(s) como proposta.");
  irPara("acoes");
}

function calcAlertas(){
  const A=[],hj=hojeISO(),push=(sev,tipo,txt,ac)=>A.push({sev,tipo,txt,ac});
  const nomePosto=id=>id?caminho(id).split(" › ").slice(-1)[0]:"";
  regOf("aep").forEach(r=>{
    const d=r.d,c=aepClasse(d),n=d.numero||"AEP";
    if(c.nivel===3&&d.status!=="rascunho")push(0,"Avaliação crítica",`${n}: exposição crítica em ${nomePosto(d.postoId)||"posto não vinculado"}. Avisar EHS e liderança imediatamente.`,["abrir-reg",r.id]);
    else if(c.nivel===3)push(0,"Avaliação crítica",`${n} (rascunho): há itens críticos em ${nomePosto(d.postoId)||"posto não vinculado"}.`,["abrir-reg",r.id]);
    if(c.nivel===3&&!(d.provisoria||"").trim()&&!regOf("acao").some(a=>a.d.origemId===r.id&&(a.d.provisoria||"").trim()&&a.d.status!=="cancelada"))push(0,"Exposição crítica sem medida provisória",`${n}: registre uma medida provisória.`,["abrir-reg",r.id]);
    if(c.gat.length&&!regOf("aet").some(a=>a.d.demandaId&&a.d.demandaId===d.demandaId||a.d.aepId===r.id))push(1,"Necessidade de AET",`${n}: ${c.gat.length} gatilho(s) para AET e nenhuma AET aberta.`,["abrir-reg",r.id]);
    if(d.crit&&d.crit.c4)push(1,"Queixa recorrente",`${n}: queixa recorrente registrada em ${nomePosto(d.postoId)||"posto"}.`,["abrir-reg",r.id]);
    if(d.status==="aprovada"&&!(d.evid||[]).length)push(2,"Ausência de evidência",`${n} aprovada sem nenhuma evidência anexada.`,["abrir-reg",r.id]);
  });
  regOf("aet").forEach(r=>{if(r.d.status==="aprovada"&&!(r.d.evid||[]).length)push(2,"Ausência de evidência",`${r.d.numero||"AET"} aprovada sem evidência anexada.`,["abrir-reg",r.id])});
  regOf("acao").forEach(r=>{
    const d=r.d,n=d.numero||"Ação",at=diasAtraso(d);
    if(at>0)push(at>15?0:1,"Ação vencida",`${n}: ${at} dia(s) de atraso. Escalonar para ${escalonar(at)}.`,["ac-abrir",r.id]);
    else if(ABERTA_AC(d.status)&&d.prazo&&diasEntre(hj,d.prazo)<=7)push(2,"Ação vencendo",`${n}: prazo em ${diasEntre(hj,d.prazo)} dia(s) (${dataBR(d.prazo)}).`,["ac-abrir",r.id]);
    if(AGUARDA(d.status)){const pv=d.ef&&d.ef.prevista;push(pv&&pv<hj?1:2,"Concluída, aguardando eficácia",`${n}: concluída e ainda sem verificação de eficácia${pv?" (prevista para "+dataBR(pv)+")":""}.`,["ac-abrir",r.id])}
    if(d.status==="concluida"&&!(d.evid||[]).length)push(2,"Ausência de evidência",`${n} concluída sem evidência.`,["ac-abrir",r.id]);
  });
  regOf("dem").forEach(r=>{const d=r.d;if(FECHADA(d.status))return;
    if(vencida(d))push(1,"Demanda vencida",`${d.numero||"Demanda"} (${d.origem}): prazo ${dataBR(d.prazo)} vencido.`,["abrir-dem",r.id]);
    if(["Mudança de processo","Alteração de layout","Novo posto ou equipamento","Nova ferramenta"].includes(d.origem)&&!regOf("aep").some(a=>a.d.demandaId===r.id&&a.d.status==="aprovada"))push(1,"Mudança sem nova avaliação",`${d.numero||"Demanda"} (${d.origem}): ainda sem AEP aprovada.`,["abrir-dem",r.id])});
  // posto sem reavaliação (mais de 12 meses ou nunca)
  regOf("cad").filter(r=>r.d.tc==="posto").forEach(r=>{
    const ult=regOf("aep").filter(a=>a.d.postoId===r.id&&a.d.status==="aprovada").map(a=>a.d.data||"").sort().pop(),ult2=lista.filter(a=>a.ctx&&a.ctx.postoId===r.id).map(a=>a.ctx.data||"").sort().pop();
    const u=[ult,ult2].filter(Boolean).sort().pop();
    if(u&&diasEntre(u,hj)>365)push(2,"Posto sem reavaliação",`${r.d.nome}: última avaliação em ${dataBR(u)} (mais de 12 meses).`,["hist-posto",r.id])});
  // condição repetida em diferentes áreas
  const rep={};
  regOf("aep").forEach(r=>{const c=aepClasse(r.d),ar=r.d.postoId&&regGet(r.d.postoId)&&regGet(r.d.postoId).d.pai||"?";c.cats.forEach(cat=>cat.itens.filter(i=>i.n>=2).forEach(i=>{(rep[i.k]=rep[i.k]||{t:i.t,areas:new Set()}).areas.add(ar)}))});
  Object.keys(rep).forEach(k=>{if(rep[k].areas.size>=2)push(2,"Condição repetida em várias áreas",`"${rep[k].t}" em Alto/Crítico em ${rep[k].areas.size} áreas diferentes.`,null)});
  return A.sort((a,b)=>a.sev-b.sev);
}
function renderAlertas(){
  const el=$("#v-alertas");if(!el)return;
  const A=calcAlertas(),sev=["Crítico","Atenção","Acompanhar"],cls=["n3","n2","n1"];
  el.innerHTML=`<div class="card"><h2>Alertas</h2><p class="mut">Calculados a partir dos seus registros, em tempo real. O aviso por e-mail ou Teams ao EHS e à liderança depende de integração (Power Automate), prevista para fase posterior.</p>
  <div class="kpis">${[0,1,2].map(s=>`<div><b>${A.filter(a=>a.sev===s).length}</b><small>${sev[s].toLowerCase()}</small></div>`).join("")}</div></div>
  ${[0,1,2].map(s=>{const L=A.filter(a=>a.sev===s);return L.length?`<div class="card"><h3><span class="bd ${cls[s]}">${sev[s]}</span></h3>${L.map(a=>`<div class="sug"><span><b>${esc(a.tipo)}</b><br><small>${esc(a.txt)}</small></span>${a.ac?`<button class="btn sec peq" data-g-acao="${a.ac[0]}" data-id="${a.ac[1]}">Abrir</button>`:""}</span></div>`).join("")}</div>`:""}).join("")||""}
  ${A.length?"":`<div class="card"><p class="mut">Nenhum alerta no momento.</p></div>`}`;
}

  const b=$("#nav button[data-v=alertas]");if(!b)return;

function niosh(i){

    m.VM=V>175||V<0?0:1-0.003*Math.abs(V-75);
    m.DM=D>175?0:0.82+4.5/Math.max(D,25);
    m.AM=A>135?0:1-0.0032*A;
    const f=FM_TAB[i.freq]||FM_TAB[0.2];m.FM=f[dur+(V>=75?1:0)];
    m.CM={boa:1,regular:V<75?0.95:1,ruim:0.9}[i.pega];
    const rwl=23*m.HM*m.VM*m.DM*m.AM*m.FM*m.CM;

function rula(r){
  const n=k=>Number(r[k]||0);

const colIdx=r=>{let n=0;for(const ch of r.replace(/\d/g,""))n=n*26+ch.charCodeAt(0)-64;return n-1};
async function lerXlsx(buf){
  const z=await zipLer(buf),xml=s=>new DOMParser().parseFromString(s,"application/xml");
  if(!z["xl/workbook.xml"])throw new Error("Planilha sem workbook. Salve novamente como .xlsx.");
  const ss=[];
  if(z["xl/sharedStrings.xml"]){xml(await z["xl/sharedStrings.xml"]()).querySelectorAll("si").forEach(si=>ss.push([...si.getElementsByTagName("t")].map(t=>t.textContent).join("")))}
  let alvo="xl/worksheets/sheet1.xml";
  try{
    const wb=xml(await z["xl/workbook.xml"]()),sh=wb.getElementsByTagName("sheet")[0],rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const rels=xml(await z["xl/_rels/workbook.xml.rels"]());
    for(const r of rels.getElementsByTagName("Relationship"))if(r.getAttribute("Id")===rid){const t=r.getAttribute("Target");alvo=t.startsWith("/")?t.slice(1):"xl/"+t.replace(/^\.?\//,"")}
  }catch(e){}
  if(!z[alvo]){alvo=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];if(!alvo)throw new Error("Nenhuma aba encontrada.")}
  const doc=xml(await z[alvo]()),rows=[];
  doc.querySelectorAll("sheetData > row").forEach(r=>{
    const linha=[];
    r.querySelectorAll(":scope > c").forEach(c=>{
      const i=colIdx(c.getAttribute("r")||"A1"),t=c.getAttribute("t"),v=c.querySelector("v"),is=c.querySelector("is");
      let val="";
      if(t==="s"&&v)val=ss[Number(v.textContent)]||"";
      else if(t==="inlineStr"&&is)val=[...is.getElementsByTagName("t")].map(x=>x.textContent).join("");
      else if(v)val=v.textContent;
      linha[i]=val;
    });
    for(let k=0;k<linha.length;k++)if(linha[k]===undefined)linha[k]="";
    rows.push(linha);
  });
  return rows;
}
function lerCsv(txt){
  txt=txt.replace(/^﻿/,"");
  const primeira=txt.split(/\r?\n/)[0]||"",sep=[";","\t",","].map(s=>[s,primeira.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let l=[],c="",q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){l.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;l.push(c);c="";if(l.some(x=>x!==""))rows.push(l);l=[]}
    else c+=ch;
  }
  if(c!==""||l.length){l.push(c);if(l.some(x=>x!==""))rows.push(l)}
  return rows;
}
async function lerArquivoInv(file){
  const buf=await file.arrayBuffer();
  let rows;
  if(/\.xlsx$/i.test(file.name)||(new Uint8Array(buf)[0]===0x50&&new Uint8Array(buf)[1]===0x4b))rows=await lerXlsx(buf);
  else if(/\.xls$/i.test(file.name))throw new Error("Formato .xls antigo. Abra no Excel e salve como .xlsx ou .csv.");
  else rows=lerCsv(new TextDecoder("utf-8").decode(buf));
  rows=rows.filter(r=>r.some(x=>String(x).trim()!==""));
  if(rows.length<2)throw new Error("A planilha precisa ter cabeçalho e pelo menos uma linha.");
  // cabeçalho = primeira linha com 3 ou mais células preenchidas
  let h=rows.findIndex(r=>r.filter(x=>String(x).trim()!=="").length>=3);if(h<0)h=0;
  const cab=rows[h].map((x,i)=>String(x).trim()||"Coluna "+(i+1));

}

function invStatus(l){
  const a=norm(l.local||""),b=norm(l.atividade||"");
  const iguais=(x,y)=>x&&y&&x.length>2&&y.length>2&&(x.includes(y)||y.includes(x));
  const postos=regOf("cad").filter(r=>r.d.tc==="posto"&&(iguais(norm(r.d.nome),a)||iguais(norm(r.d.tag||""),a)||iguais(norm(r.d.nome),b))).map(r=>r.id);
  const ativs=regOf("cad").filter(r=>r.d.tc==="atividade"&&(iguais(norm(r.d.nome),b)||iguais(norm(r.d.nome),a))).map(r=>r.id);
  const aeps=regOf("aep").filter(r=>postos.includes(r.d.postoId)||ativs.includes(r.d.atividadeId));
  if(aeps.some(r=>r.d.status==="aprovada"))return {s:"aprovada",postos,aeps};
  if(aeps.length)return {s:"andamento",postos,aeps};
  return {s:"sem",postos,aeps};
}

function dtInv(v){ // aceita AAAA-MM-DD, DD/MM/AAAA ou número de série do Excel
  v=String(v||"").trim();if(!v)return "";
  if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(8,10)+"/"+v.slice(5,7)+"/"+v.slice(0,4);
  if(/^\d{5}(\.\d+)?$/.test(v)){const d=new Date(Date.UTC(1899,11,30)+Math.floor(Number(v))*864e5);return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear()}
  return v;
}
function isoInv(v){
  v=String(v||"").trim();let m;
  if((m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/)))return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  if(/^\d{5}(\.\d+)?$/.test(v))return new Date(Date.UTC(1899,11,30)+Math.floor(Number(v))*864e5).toISOString().slice(0,10);
  return v;
}

adivinharMapa=function(cab){
  const m=_adivinhar0(cab),usadas=new Set();
  const ex={};
  MOD.forEach(([k,r])=>{const i=cab.findIndex(c=>norm(c)===norm(r));if(i>=0&&!usadas.has(i)){ex[k]=i;usadas.add(i)}});

};

const CRC_T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipCriar(arqs){
  const enc=new TextEncoder(),partes=[],central=[];let pos=0;
  const d=new Date(),hora=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),data=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const [nome,txt] of arqs){
    const nb=enc.encode(nome),db=enc.encode(txt),crc=crc32(db);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,hora,true);lh.setUint16(12,data,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,db.length,true);lh.setUint32(22,db.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    partes.push(new Uint8Array(lh.buffer),nb,db);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,hora,true);ch.setUint16(14,data,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,pos,true);
    central.push(new Uint8Array(ch.buffer),nb);
    pos+=30+nb.length+db.length;
  }
  const tamC=central.reduce((s,x)=>s+x.length,0),fim=new DataView(new ArrayBuffer(22));
  fim.setUint32(0,0x06054b50,true);fim.setUint16(8,arqs.length,true);fim.setUint16(10,arqs.length,true);fim.setUint32(12,tamC,true);fim.setUint32(16,pos,true);
  return new Blob([...partes,...central,new Uint8Array(fim.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function xmlAba(a){
  const nC=a.cab.length,topo=a.topo||[],r0=topo.length,nL=a.linhas.length+1+r0,merges=[];
  const cel=(r,c,v,s,num)=>{
    const ref=colL(c)+(r+1);
    if(v===""||v==null)return `<c r="${ref}" s="${s}"/>`;
    if(num&&/^-?\d+([.,]\d+)?$/.test(String(v).trim()))return `<c r="${ref}" s="${s}"><v>${String(v).trim().replace(",",".")}</v></c>`;
    return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
  };
  let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${colL(Math.max(nC-1,0))}${nL}"/>`;
  x+=`<sheetViews><sheetView workbookViewId="0"${a.filtro?"":""}>${a.filtro&&!r0?`<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>`:""}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>`;
  x+=`<cols>${a.larg.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>`;
  topo.forEach((t,i)=>{
    const cels=[];t.cels.forEach(k=>{const fim=k.m==null?k.c:k.m;for(let c=k.c;c<=fim;c++)cels.push(cel(i,c,c===k.c?k.t:"",k.s,false));if(fim>k.c)merges.push(colL(k.c)+(i+1)+":"+colL(fim)+(i+1))});
    x+=`<row r="${i+1}" ht="${t.h}" customHeight="1">${cels.join("")}</row>`;
  });
  x+=`<row r="${r0+1}" ht="32" customHeight="1">${a.cab.map((h,c)=>cel(r0,c,h,1,false)).join("")}</row>`;
  a.linhas.forEach((l,i)=>{x+=`<row r="${r0+i+2}">${a.cab.map((_,c)=>cel(r0+i+1,c,l[c],2,a.num&&a.num.has(c))).join("")}</row>`});
  x+=`</sheetData>`;
  if(a.filtro&&nC)x+=`<autoFilter ref="A${r0+1}:${colL(nC-1)}${Math.max(nL,r0+2)}"/>`;
  if(merges.length)x+=`<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`;
  const vs=Object.entries(a.valid||{});
  if(vs.length)x+=`<dataValidations count="${vs.length}">${vs.map(([c,op])=>`<dataValidation type="list" allowBlank="1" showErrorMessage="0" sqref="${colL(Number(c))}${r0+2}:${colL(Number(c))}5000"><formula1>${typeof op==="string"?xe(op.slice(1)):'"'+xe(op.join(","))+'"'}</formula1></dataValidation>`).join("")}</dataValidations>`;
  return x+`</worksheet>`;
}

importarInv=async function(){
  const I=G.inv,a=I.arq;
  if(Object.keys(I.mapa).length<2){aviso("Mapeie pelo menos duas colunas.");return}
  const linhas=[];
  a.linhas.forEach((r,n)=>{
    const o={_n:n+2};let tem=false;
    Object.keys(I.mapa).forEach(k=>{let v=r[I.mapa[k]];v=v===undefined?"":String(v).trim().replace(/^'(?=[=+\-@])/,"");if(v){tem=true;o[k]=v.slice(0,600)}});
    if(!tem)return;
    if(I.mapa.tipoRisco!==undefined&&I.soErgo&&!/ergon/i.test(o.tipoRisco||""))return;
    if(o.prob&&!(parseInt(o.prob)>=1&&parseInt(o.prob)<=5))delete o.prob;
    if(o.sev&&!(parseInt(o.sev)>=1&&parseInt(o.sev)<=5))delete o.sev;
    ["prazo","dataAval"].forEach(k=>{if(o[k])o[k]=isoInv(o[k])});
    if(o.prob)o.prob=String(parseInt(o.prob));if(o.sev)o.sev=String(parseInt(o.sev));
    if(!o.nivel){const n=nivelInv(pontosInv(o));if(n)o.nivel=n}
    linhas.push(o);
  });
  if(!linhas.length){aviso("Nenhuma linha atendeu ao filtro. Revise o mapeamento ou desmarque o filtro de ergonômicos.");return}
  const dest=I.dest&&I.dest!=="novo"?regGet(I.dest):null;
  const total=(dest?dest.d.linhas.length:0)+linhas.length;
  if(total>INV_MAX){aviso("O inventário passaria de "+INV_MAX+" linhas ("+total+"). Divida a planilha em partes.");return}
  let r;
  if(dest){dest.d.linhas.push(...linhas);r=dest}
  else r={id:rid(),tipo:"inv",d:{nome:a.nome.replace(/\.(xlsx|csv|txt)$/i,""),importadoEm:hojeISO(),mapa:{...I.mapa},colunas:a.cabecalhos,linhas,soErgo:I.soErgo}};
  regGravar(r);I.etapa="ver";I.loteId=r.id;I.arq=null;I.dest="novo";renderInventario();
  aviso(linhas.length+(dest?" linhas acrescentadas ao inventário.":" linhas importadas."));
};

/* =====================================================================
   FASE 6A: QR CODE POR POSTO
   - gerador de QR Code próprio (modo byte, correção M, versões 1 a 10)
   - etiquetas imprimíveis por posto; o QR abre o histórico do posto
   ===================================================================== */
const QR_M={ // versão: [codewords de dados em blocos [n,dados]..., ec por bloco, alinhamento]
 1:{b:[[1,16]],ec:10,al:[]},2:{b:[[1,28]],ec:16,al:[6,18]},3:{b:[[1,44]],ec:26,al:[6,22]},4:{b:[[2,32]],ec:18,al:[6,26]},
 5:{b:[[2,43]],ec:24,al:[6,30]},6:{b:[[4,27]],ec:16,al:[6,34]},7:{b:[[4,31]],ec:18,al:[6,22,38]},
 8:{b:[[2,38],[2,39]],ec:22,al:[6,24,42]},9:{b:[[3,36],[2,37]],ec:22,al:[6,26,46]},10:{b:[[4,43],[1,44]],ec:26,al:[6,28,50]}};
const GF_E=new Array(512),GF_L=new Array(256);
(()=>{let x=1;for(let i=0;i<255;i++){GF_E[i]=x;GF_L[x]=i;x<<=1;if(x&256)x^=0x11D}for(let i=255;i<512;i++)GF_E[i]=GF_E[i-255]})();
const gfMul=(a,b)=>a&&b?GF_E[GF_L[a]+GF_L[b]]:0;
function rsResto(dados,n){
  let g=[1];
  for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);g.forEach((c,j)=>{ng[j]^=c;ng[j+1]^=gfMul(c,GF_E[i])});g=ng}
  const r=new Array(n).fill(0);
  dados.forEach(d=>{const f=d^r.shift();r.push(0);if(f)for(let i=0;i<n;i++)r[i]^=gfMul(g[i+1],f)});
  return r;
}
function qrGerar(texto){
  const bytes=[...new TextEncoder().encode(texto)];
  let v=0;
  for(let k=1;k<=10;k++){const cap=QR_M[k].b.reduce((s,x)=>s+x[0]*x[1],0)*8,lb=k<10?8:16;if(4+lb+8*bytes.length<=cap){v=k;break}}
  if(!v)throw new Error("Texto longo demais para o QR Code.");
  const Q=QR_M[v],tot=Q.b.reduce((s,x)=>s+x[0]*x[1],0),bits=[];
  const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>i)&1)};
  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,tot*8-bits.length));while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(""),2));
  for(let p=0;cw.length<tot;p++)cw.push(p%2?0x11:0xEC);
  // blocos
  const blocos=[];let o=0;Q.b.forEach(([n,d])=>{for(let i=0;i<n;i++){blocos.push(cw.slice(o,o+d));o+=d}});
  const ecs=blocos.map(b=>rsResto(b,Q.ec)),final=[],maxD=Math.max(...blocos.map(b=>b.length));
  for(let i=0;i<maxD;i++)blocos.forEach(b=>{if(i<b.length)final.push(b[i])});
  for(let i=0;i<Q.ec;i++)ecs.forEach(e=>final.push(e[i]));
  const fb=[];final.forEach(b=>{for(let i=7;i>=0;i--)fb.push((b>>i)&1)});
  const N=17+4*v,M=[...Array(N)].map(()=>new Array(N).fill(0)),F=[...Array(N)].map(()=>new Array(N).fill(false));
  const set=(x,y,val)=>{if(x>=0&&y>=0&&x<N&&y<N){M[y][x]=val?1:0;F[y][x]=true}};
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4)}};
  finder(3,3);finder(N-4,3);finder(3,N-4);
  for(let i=0;i<N;i++){if(!F[6][i])set(i,6,i%2===0);if(!F[i][6])set(6,i,i%2===0)}
  const al=Q.al;
  al.forEach((cy,i)=>al.forEach((cx,j)=>{
    if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))return;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
  }));
  const reservar=()=>{for(let i=0;i<9;i++){F[8][i]=true;F[i][8]=true}for(let i=0;i<8;i++){F[8][N-1-i]=true;F[N-1-i][8]=true}};
  reservar();set(8,N-8,true);
  if(v>=7){for(let i=0;i<6;i++)for(let j=0;j<3;j++){F[i][N-11+j]=true;F[N-11+j][i]=true}}
  // dados em zigue-zague
  const pos=[];let up=true;
  for(let x=N-1;x>0;x-=2){if(x===6)x--;for(let k=0;k<N;k++){const y=up?N-1-k:k;for(let c=0;c<2;c++){const xx=x-c;if(!F[y][xx])pos.push([xx,y])}}up=!up}
  const mascaras=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(y/2)+Math.floor(x/3))%2===0,(x,y)=>(x*y)%2+(x*y)%3===0,(x,y)=>((x*y)%2+(x*y)%3)%2===0,(x,y)=>((x+y)%2+(x*y)%3)%2===0];

    const R=M.map(l=>l.slice());
    pos.forEach(([x,y],i)=>{let b=fb[i]||0;if(mascaras[m](x,y))b^=1;R[y][x]=b});
    const fmt=bch(m,0x537,10,15)^0x5412; // nível M = 00

    return R;
  }
  function penal(R){
    let p=0;
    for(let t=0;t<2;t++){
      for(let a=0;a<N;a++){
        let run=1;
        for(let b=1;b<N;b++){const cur=t?R[b][a]:R[a][b],prev=t?R[b-1][a]:R[a][b-1];if(cur===prev){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}

  }

}

const IDB_NOME="ergocontexto_fila",IDB_ST="fotos";
function idbAbrir(){return new Promise((ok,err)=>{if(!window.indexedDB){err(new Error("sem IndexedDB"));return}const r=indexedDB.open(IDB_NOME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_ST,{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error)})}

const filaDel=id=>idbOp("readwrite",s=>s.delete(id));

async function enviarStorage(path,blob,token){
  return fetch(`${SB_URL}/storage/v1/object/evidencias/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+token,"Content-Type":blob.type},body:blob});
}
anexarEvidencia=async function(file,regId){
  const eh=/^image\//.test(file.type);
  if(!eh&&file.type!=="application/pdf")throw new Error("Use foto (JPG/PNG) ou PDF.");
  if(file.size>15e6)throw new Error("Arquivo grande demais (máx. 15 MB).");
  let blob=file,mini="";
  if(eh){const c=await comprimirImagem(file,1400,.72);blob=c.blob;const m=await comprimirImagem(file,200,.6);mini=m.url}
  if(blob.size>5242880)throw new Error("Arquivo maior que 5 MB depois de comprimir.");
  const ev={nome:file.name,tipo:blob.type,mini,em:Date.now(),por:(autorAtual()||{}).nome||"",legenda:""};
  if(!(SB_ON&&sessao)){ev.local=true;return ev}
  const pasta=(perfil&&perfil.equipe_id)||sessao.user.id,ext=eh?"jpg":"pdf";
  const path=`${pasta}/${regId}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
  const enfileirar=async()=>{
    const id="F"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{await filaAdd({id,regId,path,blob,tipo:blob.type,em:Date.now()})}
    catch(e){throw new Error("Sem internet e sem espaço para guardar a foto no aparelho. Tente de novo com conexão.")}
    ev.fila=id;atualizarPill();return ev;
  };
  if(!navigator.onLine)return enfileirar();
  const t=await tokenValido();if(!t)throw new Error("Sessão expirada. Entre de novo.");
  let r;
  try{r=await enviarStorage(path,blob,t)}catch(e){return enfileirar()} // queda de rede no meio do envio
  if(!r.ok){
    if(r.status>=500||r.status===408||r.status===429)return enfileirar();
    let j={};try{j=await r.json()}catch(e){}throw new Error(j.message||j.error||"Falha no envio ("+r.status+")");
  }
  ev.path=path;return ev;
};
function vincularEnviada(item){

  REG.forEach(r=>{if(r.d&&r.d.evid&&r.d.evid.some(e=>e.fila===item.id)){marca(r.d.evid);regGravar(r)}});
  if(G.ed&&G.ed.d)marca(G.ed.d.evid);

}
async function enviarFila(manual){
  if(fluxando||!SB_ON||!sessao||!navigator.onLine)return;
  fluxando=true;let enviadas=0,falhas=0;
  try{
    const itens=await filaTodos();
    for(const it of itens){
      const t=await tokenValido();if(!t)break;
      let r;try{r=await enviarStorage(it.path,it.blob,t)}catch(e){break}
      if(r.ok||r.status===409){vincularEnviada(it);await filaDel(it.id);enviadas++}
      else if(r.status===401||r.status>=500||r.status===408||r.status===429)break;
      else{falhas++;if(r.status===400||r.status===403||r.status===413){await filaDel(it.id);vincularEnviada({...it,path:""})}}

function linhaMensal(aeps,acoes,nm){
  const meses=[];const d=new Date();d.setDate(1);for(let i=nm-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);meses.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}
  const a={},c={};meses.forEach(m=>{a[m]=0;c[m]=0});
  aeps.forEach(r=>{const m=ISO_MES(r.criadoEm||r.atualizadoEm);if(m in a)a[m]++});
  acoes.forEach(r=>{if(["concluida","verificacao","eficaz","parcial","naoeficaz"].includes(r.d.status)){const t=r.d.dataReal?new Date(r.d.dataReal+"T12:00:00").getTime():r.atualizadoEm,m=ISO_MES(t);if(m in c)c[m]++}});
  const W=640,H=200,pl=30,pb=26,pt=12,max=Math.max(3,...meses.map(m=>Math.max(a[m],c[m])));
  const X=i=>pl+(W-pl-10)*(meses.length===1?.5:i/(meses.length-1)),Y=v=>pt+(H-pt-pb)*(1-v/max);
  const path=o=>meses.map((m,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(o[m]).toFixed(1)).join("");
  const grade=[0,.5,1].map(f=>{const v=Math.round(max*f);return `<line x1="${pl}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" class="dgr"/><text x="${pl-5}" y="${Y(v)+4}" text-anchor="end" class="dax">${v}</text>`}).join("");

function pacotePowerBI(){
  const caps=[],orig=csvBaixar;
  csvBaixar=(nome,cab,linhas)=>{caps.push([nome,cab,linhas])};
  try{exportar("aep");exportar("acao");exportar("dem")}finally{csvBaixar=orig}
  const L=[];let cab=null;
  regOf("inv").forEach(r=>{const a=abaInventario(r.d);cab=a.cab;a.linhas.forEach(l=>L.push([r.d.nome,...l]))});
  if(cab)caps.push(["inventario",["Inventário",...cab],L]);
  const q=v=>{v=v==null?"":String(v);if(/^[=+\-@]/.test(v)&&!/^-?\d+([.,]\d+)?$/.test(v))v="'"+v;return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const arqs=caps.map(([n,c,l])=>[n+".csv","﻿"+[c,...l].map(x=>x.map(q).join(";")).join("\r\n")]);
  if(!arqs.length||arqs.every(a=>a[1].split("\n").length<2)){aviso("Ainda não há dados para exportar.");return}
  arqs.push(["LEIA-ME.txt",`Pacote de dados do ErgoContexto (${dataBR(hojeISO())})\r\n\r\nArquivos CSV com separador ponto e vírgula, codificação UTF-8.\r\nNo Power BI: Obter dados > Texto/CSV (ou Pasta), delimitador ponto e vírgula, origem do arquivo UTF-8.\r\n\r\ninventario-ergonomico-aep.csv: um registro por fator avaliado em cada AEP.\r\nplano-de-acao.csv: plano de ação.\r\ndemandas.csv: demandas e triagem.\r\ninventario.csv: linhas dos inventários de risco ergonômico.\r\n\r\nRelacionamentos sugeridos: coluna Local (inventario-ergonomico-aep, plano-de-acao) com Posto / local de trabalho (inventario); coluna Ação/AEP/Demanda para ligar o plano de ação às AEPs e demandas.\r\nOs dados são por situação de trabalho, nunca por trabalhador.\r\n`]);
  baixarBlob(zipCriar(arqs),"ergocontexto-powerbi-"+hojeISO()+".zip");aviso("Pacote gerado com "+(arqs.length-1)+" arquivos CSV.");
}

function kappaPond(pares){ // pares [[a,b]] com categorias 0..3, ponderação quadrática

  return den===0?null:1-num/den;

const TLX_PARES=[];for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)TLX_PARES.push([i,j]);
function tlx(v){
  const r=TLX_ESC.map(([k])=>NG(v["r_"+k])),bruto=r.reduce((a,b)=>a+b,0)/6;
  const w=Array(6).fill(0);let completo=true;
  TLX_PARES.forEach(([i,j],n)=>{const c=v["p"+n];if(c==="i")w[i]++;else if(c==="j")w[j]++;else completo=false});
  const pond=completo?r.reduce((a,x,i)=>a+x*w[i],0)/15:null;
  return {r,bruto,w,completo,pond};
}

const normB=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function textoReg(o,acc,prof){
  if(prof>4||o==null)return acc;
  if(typeof o==="string"){if(o.length<600)acc.push(o)}
  else if(typeof o==="number")acc.push(String(o));
  else if(Array.isArray(o))o.slice(0,60).forEach(x=>textoReg(x,acc,prof+1));
  else if(typeof o==="object")Object.keys(o).forEach(k=>{if(!["evid","hist","f","aprov","mini"].includes(k))textoReg(o[k],acc,prof+1)});
  return acc;
}
const ROT_TIPO={cad:"Cadastro",dem:"Demanda",aep:"AEP",aet:"AET",acao:"Ação",inv:"Inventário"};
function buscar(q){
  const toks=normB(q).split(/\s+/).filter(Boolean);if(!toks.length)return [];
  const out=[];
  regOf("cad").concat(regOf("dem"),regOf("aep"),regOf("aet"),regOf("acao")).forEach(r=>{
    const d=r.d,cam=d.postoId?caminho(d.postoId):(r.tipo==="cad"&&d.pai?caminho(d.pai):"");
    const hay=normB(textoReg(d,[],0).join(" ")+" "+cam);
    if(!toks.every(t=>hay.includes(t)))return;
    let tit,ac;
    if(r.tipo==="cad"){tit=(CAD[d.tc]?CAD[d.tc].um[0].toUpperCase()+CAD[d.tc].um.slice(1):"Cadastro")+": "+(d.nome||"");ac=d.tc==="posto"?["hist-posto",r.id]:null}
    else{tit=(d.numero||ROT_TIPO[r.tipo])+" · "+((d.acao||d.motivo||d.problema||"").slice(0,80));ac=r.tipo==="dem"?["abrir-dem",r.id]:r.tipo==="acao"?["ac-abrir",r.id]:["abrir-reg",r.id]}
    out.push({tipo:ROT_TIPO[r.tipo],tit,sub:[d.tag&&"TAG "+d.tag,d.local,cam].filter(Boolean).join(" · "),ac});
  });
  regOf("inv").forEach(r=>(r.d.linhas||[]).forEach(l=>{
    const hay=normB([l.area,l.local,l.atividade,l.funcao,l.perigo,l.descricao].join(" "));
    if(toks.every(t=>hay.includes(t)))out.push({tipo:"Inventário",tit:(l.local||l.area||"")+" · "+(l.perigo||""),sub:[r.d.nome,l.area,l.atividade,l.nivel].filter(Boolean).join(" · "),ir:"inventario"});
  }));
  return out;
}

    let D15=0,sem=false,acima115=false;R.forEach(x=>{const T=nr15T(x.L);if(x.L>115)acima115=true;if(T===0)sem=true;else if(isFinite(T))D15+=x.t/T});
    const soma=R.filter(x=>x.L>=80).reduce((s,x)=>s+x.t*Math.pow(10,x.L/10),0),NEN=soma>0?10*Math.log10(soma/480):null,Dn=soma>0?Math.pow(10,(NEN-85)/10):0;

    L.push(["Maior pico",f(mx,1)+" dB"]);L.push(["Limite de tolerância (NR-15 Anexo 2)",lim+(d.circuito==="C"?" dB(C)":" dB (linear)")]);
    ver=mx>grave?{txt:"Acima de "+grave+" dB: risco grave e iminente sem proteção adequada",cls:"n3"}:mx>lim?{txt:"Acima do limite de tolerância",cls:"n3"}:{txt:"Dentro do limite de tolerância",cls:"n0"};
    av.push("O Anexo 2 não fixa número máximo de impactos. Entre os picos, avalie o ruído como contínuo.");

      const ib=d.sol==="ext_com"?0.7*tbn+0.2*tg+0.1*tbs:0.7*tbn+0.3*tg;return {ib,M,t:isNaN(t)||t<=0?1:t}}).filter(x=>!isNaN(x.ib)&&!isNaN(x.M));

    const T=R.reduce((s,x)=>s+x.t,0),ib=R.reduce((s,x)=>s+x.ib*x.t,0)/T,M=R.reduce((s,x)=>s+x.M*x.t,0)/T;
    L.push(["Ambiente",{interno:"interno ou externo sem carga solar",ext_sem:"externo sem carga solar",ext_com:"externo com carga solar"}[d.sol]||""]);
    L.push(["IBUTG médio (ponderado pelo tempo)",f(ib,1)+" °C"]);L.push(["Taxa metabólica média",f(M,0)+" W"]);

      else{L.push(["Critério",f(v1,1)+" a "+f(v2,1)+" "+un]);ver=mn>=v1&&mx<=v2?{txt:"Todos os pontos dentro da faixa",cls:"n0"}:{txt:"Há pontos fora da faixa",cls:"n3"}}

  if(k==="novo"){const n=novoDoc($("#docNovoTipo").value);G.dc={id:n.id,d:n.d};renderDocs();return}
  if(k==="abrir"){const r=regGet(b.dataset.id);if(r){G.dc={id:r.id,d:JSON.parse(JSON.stringify(r.d))};renderDocs()}return}
  if(k==="excluir"){if(confirm("Excluir este documento?")){regExcluir(b.dataset.id);renderDocs()}return}
  if(!G.dc)return;const d=G.dc.d;
  if(k==="voltar"){if(!docLock(d))salvarDoc();G.dc=null;renderDocs();return}
  if(k==="sec+"){d.secoes.push({t:"Nova seção",txt:""});renderDocs();return}
  if(k==="sec-"){d.secoes.splice(Number(b.dataset.i),1);renderDocs();return}
  if(k==="assin+"){d.assin.push({nome:"",funcao:"",registro:"",tipo:"Responsável técnico",sig:null});renderDocs();return}
  if(k==="assin-"){d.assin.splice(Number(b.dataset.i),1);renderDocs();return}
  if(k==="assinar"){salvarDoc();abrirAssinatura(Number(b.dataset.i));return}
  if(k==="limpar-assin"){if(confirm("Remover todas as assinaturas deste documento?")){d.assin.forEach(a=>{a.sig=null});(d.hist=d.hist||[]).push({em:hojeISO(),acao:"Assinaturas removidas",por:(autorAtual()||{}).nome||"",motivo:""});salvarDoc();renderDocs()}return}
  if(k==="salvar"){salvarDoc();aviso("Documento salvo.");return}
  if(k==="imprimir"){if(!docLock(d))salvarDoc();const w=window.open("");if(w){w.document.write(htmlDocImpressao(d));w.document.close()}return}
  if(k==="imp-aet"){const id=$("#docAet").value;const r=id&&regGet(id);if(!r){aviso("Escolha uma AET.");return}
    const sc=r.d.sec||{},pu=(t,txt)=>{const s=d.secoes.find(x=>x.t===t);if(s&&!(s.txt||"").trim())s.txt=txt||"";else if(!s&&txt)d.secoes.push({t,txt})};
    pu("Diagnóstico ergonômico",sc.diagnostico);pu("Recomendações e plano de ação",sc.recomendacoes);
    if(r.d.postoId&&!d.postoId)d.postoId=r.d.postoId;d.aetId=id;
    const rs=r.d.resp||{};if(rs.nome&&!d.assin.some(a=>a.nome===rs.nome))d.assin.push({nome:rs.nome,funcao:"",registro:rs.qualificacao||"",tipo:"Responsável técnico",sig:null});
    renderDocs();aviso("Dados da AET importados. Revise o texto.");return}
  if(k==="emitir"){
    if(!quemAprova()){aviso("Somente administrador ou aprovador emite.");return}
    const bl=docBloqueios(d);if(bl.length){aviso("Antes de emitir: "+bl.join("; ")+".");return}
    const a=autorAtual()||{};d.status="aprovada";(d.hist=d.hist||[]).push({em:hojeISO(),acao:"Emitido",por:a.nome||"",motivo:""});
    d.aprov={por:a.nome||"",porId:a.id||"",papel:(perfil&&perfil.papel)||"",em:hojeISO(),emHora:new Date().toISOString(),obs:"",algoritmo:"SHA-256",hash:docConteudoHash(d)};
    salvarDoc();renderDocs();aviso("Documento emitido e bloqueado.");return}
  if(k==="reabrir"){
    if(!quemEdita()){aviso("Somente o administrador reabre.");return}
    if(!confirm("Reabrir remove as assinaturas e cria uma nova versão. Continuar?"))return;
    const a=autorAtual()||{};d.assin.forEach(x=>{x.sig=null});d.status="rascunho";d.versao=(d.versao||1)+1;(d.hist=d.hist||[]).push({em:hojeISO(),acao:"Reaberto",por:a.nome||"",motivo:""});delete d.aprov;salvarDoc();renderDocs();return}
});

const STOP=new Set("de da do das dos a o e em para com por um uma que na no nas nos ao as os se ou mais menos muito sem sobre entre ser foi".split(" "));
const toks21=o=>new Set(normB(textoReg(o,[],0).join(" ")).split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)));
function relSemelhantes(id){
  const base=regGet(id);if(!base)return "<p>Escolha um registro.</p>";
  const A=toks21({a:base.d.acao,p:base.d.problema,c:base.d.causa,m:base.d.motivo,x:base.d.f&&JSON.stringify(base.d.f).length<0?"":"",s:base.d.sec,o:base.d.obs,at:base.d.atividade,pos:base.d.postoId?caminho(base.d.postoId):""});
  const out=[];
  regOf("aep").concat(regOf("aet"),regOf("acao"),regOf("dem")).forEach(r=>{
    if(r.id===id)return;
    const B=toks21({a:r.d.acao,p:r.d.problema,c:r.d.causa,m:r.d.motivo,s:r.d.sec,o:r.d.obs,at:r.d.atividade,pos:r.d.postoId?caminho(r.d.postoId):""});
    const comum=[...A].filter(w=>B.has(w));if(comum.length<2)return;
    out.push({r,pt:comum.length/Math.sqrt(A.size*B.size||1),comum});
  });
  out.sort((a,b)=>b.pt-a.pt);
  return relCab("Casos semelhantes","Base: "+nomeReg(id))+`<p class="mut" style="font-size:.86rem">Comparação por termos em comum. É um apoio à busca: a decisão sobre a semelhança é do avaliador. A coluna "Termos em comum" mostra os dados que sustentaram a sugestão.</p>`+
   relTab(["Registro","Tipo","Local","Termos em comum"],out.slice(0,8).map(x=>[nomeReg(x.r.id),ROT_TIPO[x.r.tipo]||x.r.tipo,x.r.d.postoId?caminho(x.r.d.postoId):"",x.comum.slice(0,8).join(", ")]));
}
function relLicoes(){

  return relCab("Lições aprendidas","Ações encerradas como eficazes, agrupadas pelo tipo de solução")+(L.length?Object.keys(H).map(k=>`<h3>${esc(k)} (${H[k].length})</h3>`+relTab(["Ação","Problema","Causa","Local","Risco residual"],H[k].map(r=>[(r.d.numero||"")+" · "+(r.d.acao||""),r.d.problema||"",r.d.causa||"",r.d.postoId?caminho(r.d.postoId):(r.d.area||""),(r.d.ef||{}).residual||""]))).join(""):`<p class="mut">Ainda não há ações eficazes. Elas aparecem aqui quando a verificação de eficácia for aprovada.</p>`);

  document.body.appendChild(m);

  m._i=i;m._marcas=()=>marcas;m._set=t=>{tool=t;$("#mkTool")&&($("#mkTool").textContent="Ferramenta: "+({seta:"seta",circ:"círculo",txt:"texto"}[t]))};m._desf=()=>{marcas.pop();des()};m._limpa=()=>{marcas=[];des()};
  if(!lock)m._set("seta");

function projetar(p,c){
  const x=p[0]-c.tx,y=p[1]-c.ty,z=p[2]-c.tz,cy=Math.cos(c.yaw),sy=Math.sin(c.yaw),x1=x*cy+z*sy,z1=-x*sy+z*cy,cp=Math.cos(c.pitch),sp=Math.sin(c.pitch),y2=y*cp-z1*sp,z2=y*sp+z1*cp,f=c.dist/(c.dist+z2);
  return {x:c.cx+x1*c.sc*f,y:c.cy-y2*c.sc*f,d:z2,f};
}
function desenhar3d(cv,cena,cam,nivel){

  for(let j=-5;j<=5;j++){const a=projetar([-1.5,0,j*.24],cam),b=projetar([2,0,j*.24],cam);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}

    if(q.k==="seg"){const a=projetar(q.a,cam),b=projetar(q.b,cam);return {q,a,b,d:(a.d+b.d)/2}}

  }).sort((u,v)=>v.d-u.d);
  L.forEach(o=>{
    const q=o.q;
    if(q.k==="poly"){cx.beginPath();o.P.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));cx.closePath();cx.fillStyle=q.c;cx.globalAlpha=.85;cx.fill();cx.globalAlpha=1;cx.strokeStyle="#9E9E9E";cx.lineWidth=1;cx.stroke()}
    else if(q.k==="seg"){cx.strokeStyle=q.c;cx.lineCap="round";cx.lineWidth=Math.max(1.5,q.r*2*cam.sc*(o.a.f+o.b.f)/2);cx.beginPath();cx.moveTo(o.a.x,o.a.y);cx.lineTo(o.b.x,o.b.y);cx.stroke()}

  });

  // rótulos
  cx.font="bold 13px Arial";(cena.lab||[]).forEach(([j,t])=>{const pt=bd.joint[j];if(!pt)return;const o=projetar(pt,cam),w=cx.measureText(t).width;cx.fillStyle="rgba(255,255,255,.92)";cx.fillRect(o.x+12,o.y-22,w+10,20);cx.strokeStyle="#FF9900";cx.lineWidth=1;cx.strokeRect(o.x+12,o.y-22,w+10,20);cx.fillStyle="#000";cx.fillText(t,o.x+17,o.y-8);cx.fillStyle="#FF9900";cx.beginPath();cx.arc(o.x,o.y,3.5,0,7);cx.fill()});
}

function mdCalc(def,v){
  const itens=def.it,comp=itens.filter(i=>v[i[0]]!==undefined&&v[i[0]]!=="");
  if(comp.length<itens.length)return null;
  let soma=0,max=0,pior=[];
  const det=itens.map(([k,rot,ops])=>{const mx=Math.max(...ops.map(o=>Number(o[0]))),val=Number(v[k]);soma+=val;max+=mx;
    const lim=def.limiar?Math.ceil(mx*def.limiar):mx;if(mx>=2&&val>=lim)pior.push(rot);return {rot,val,mx,txt:(ops.find(o=>o[0]===String(v[k]))||[0,""])[1]}});
  const pct=Math.round(soma/max*100);let niv=NIV_PCT(pct);
  let elev=false;if(pior.length&&pct<50){niv=NIV_PCT(50);elev=true}
  return {pct,niv,det,pior,soma,max,elev};

function efExtra(d){
  const f=[],ef=d.ef||{};
  if(!ef.prevista)f.push("data definida para a verificação");
  if(!(ef.avaliador||"").trim())f.push("avaliador da eficácia");
  if(!(ef.metodo||"").trim())f.push("método repetido (ou \"não aplicável\")");
  if(!(ef.comparacao||"").trim())f.push("comparação da exposição antes e depois");
  if(!(ef.efeitos||"").trim())f.push("efeitos indesejados (escreva \"nenhum\" se não houve)");
  if(ef.reaval&&d.dataReal&&ef.reaval<d.dataReal)f.push("a nova observação não pode ser anterior à data de conclusão");
  return f;
}

const COR_NIV=["#D1D5DB","#FFD699","#FF9900","#FF3300","#9CA3AF"];

function gBarras(it){
  it=it.filter(x=>x&&x.rot!==undefined);if(!it.length||it.every(x=>!x.v))return `<p class="mut">Sem dados para o gráfico.</p>`;

  const corpo=it.map((x,i)=>{const y=i*lh+4,w=Math.max(x.v?3:0,(W-L-R)*x.v/max),rot=String(x.rot).length>26?String(x.rot).slice(0,25)+"…":String(x.rot);

function gRosca(it,cores){
  const tot=it.reduce((s,x)=>s+x.v,0);if(!tot)return `<p class="mut">Sem dados para o gráfico.</p>`;
  const cx=90,cy=90,r=70,ri=44;let a0=-Math.PI/2;
  const arco=(a,b)=>{const p=(rr,t)=>[cx+rr*Math.cos(t),cy+rr*Math.sin(t)],g=b-a>Math.PI?1:0,[x1,y1]=p(r,a),[x2,y2]=p(r,b),[x3,y3]=p(ri,b),[x4,y4]=p(ri,a);return `M${x1} ${y1}A${r} ${r} 0 ${g} 1 ${x2} ${y2}L${x3} ${y3}A${ri} ${ri} 0 ${g} 0 ${x4} ${y4}Z`};
  const ps=it.map((x,i)=>{if(!x.v)return "";const a1=a0+2*Math.PI*x.v/tot-(it.filter(y=>y.v).length>1?0:0.0001);const cor=(cores||COR_NIV)[i]||"#9CA3AF";const d=x.v===tot?`M${cx} ${cy-r}A${r} ${r} 0 1 1 ${cx-.01} ${cy-r}L${cx-.01} ${cy-ri}A${ri} ${ri} 0 1 0 ${cx} ${cy-ri}Z`:arco(a0,a1);a0=a1;return `<path class="gm" data-tip="${esc(x.rot)}: ${x.v} (${Math.round(x.v/tot*100)}%)" d="${d}" fill="${cor}" stroke="#fff" stroke-width="2"/>`}).join("");

function gEmpilhado(cats,series,tit){

  if(!cats.length||!tot.some(Boolean))return `<p class="mut">Sem dados para o gráfico.</p>`;
  const W=Math.max(320,Math.min(640,cats.length*64+50)),H=220,L=30,B=44,T=10,bw=Math.min(36,(W-L)/cats.length-14);

  cats.forEach((c,i)=>{const x=L+(W-L)/cats.length*i+((W-L)/cats.length-bw)/2;let y=H-B;
    series.forEach(s=>{const v=s.v[i]||0;if(!v)return;const h=(H-B-T)*v/max;y-=h;corpo+=`<rect class="gm" data-tip="${esc(c)} · ${esc(s.rot)}: ${v}" x="${x}" y="${y}" width="${bw}" height="${Math.max(h-2,1)}" rx="2" fill="${s.cor}"/>`});
