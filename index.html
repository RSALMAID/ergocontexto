<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ErgoContexto</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f2f5f8;
}

header{
background:#142b40;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:15px;
padding:20px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:12px;
box-sizing:border-box;
margin-top:5px;
border:1px solid #d4d4d4;
border-radius:8px;
}

textarea{
height:100px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#df652b;
color:white;
border:none;
border-radius:10px;
font-size:18px;
}

.resultado{
margin-top:20px;
padding:15px;
border-radius:10px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.itemHistorico{
background:#f7f7f7;
padding:10px;
margin-top:10px;
border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>ErgoContexto</h1>
<p>Triagem Ergonômica e Fatores Humanos</p>
</header>

<div class="card">

<label>Unidade</label>
<input id="unidade">

<label>Área</label>
<input id="area">

<label>Local</label>
<input id="local">

<label>Atividade</label>
<input id="atividade">

<label>Função</label>
<input id="funcao">

<label>Avaliador</label>
<input id="avaliador">

<label>Data</label>
<input id="data" type="date">

<h2>Ergonomia</h2>

<div id="perguntas"></div>

<label>Observações Gerais</label>
<textarea id="obs"></textarea>

<button onclick="avaliar()">
Finalizar Avaliação
</button>

<div id="resultado"></div>

<div id="relatorio"></div>


</div>

<div class="card">
<h2>Histórico</h2>
<div id="historico"></div>
</div>

<script>

const perguntas = [

"Postura do tronco durante a atividade",
"Postura dos membros superiores",
"Movimentos repetitivos",
"Esforço físico exigido",
"Manipulação de cargas",

"Pressão de tempo para execução",
"Distrações ou interrupções",
"Clareza das instruções",
"Comunicação entre envolvidos",
"Probabilidade de erro humano",

"Nível de atenção necessário",
"Complexidade da atividade",
"Fadiga mental percebida",
"Fadiga física percebida",
"Variabilidade da tarefa",

"Condição de iluminação",
"Condição de ruído",
"Condição térmica",
"Disponibilidade de recursos",
"Possibilidade de recuperação durante a jornada"

];
 

const opcoes = [
"Adequado",
"Baixa exposição",
"Média exposição",
"Alta exposição"
];

let html="";

perguntas.forEach((p,i)=>{

html+=`
<label>${i+1}. ${p}</label>

<select id="q${i}">
<option value="0">${opcoes[0]}</option>
<option value="1">${opcoes[1]}</option>
<option value="2">${opcoes[2]}</option>
<option value="3">${opcoes[3]}</option>
</select>

<textarea
id="obs${i}"
placeholder="Observação da pergunta">
</textarea>
`;
});


document.getElementById("perguntas").innerHTML=html;

document.getElementById("data").value =
new Date().toISOString().substring(0,10);

carregarHistorico();

function avaliar(){

let ergonomia = 0;
let fatoresHumanos = 0;

for(let i=0;i<10;i++){
ergonomia += Number(
document.getElementById("q"+i).value
);
}

for(let i=10;i<20;i++){
fatoresHumanos += Number(
document.getElementById("q"+i).value
);
}

let total = ergonomia + fatoresHumanos;


let texto="";
let cor="";

if(total<=15){
texto="🟢 Baixa Exposição";
cor="#dff5df";
}
else if(total<=30){
texto="🟡 Média Exposição";
cor="#fff7d6";
}
else if(total<=45){
texto="🟠 Alta Exposição";
cor="#ffe4c7";
}
else{
texto="🔴 Exposição Crítica";
cor="#ffd9d9";
}

document.getElementById("resultado").innerHTML=
`
<div class="resultado" style="background:${cor}">

ERGONOMIA: ${ergonomia} pontos<br><br>

FATORES HUMANOS: ${fatoresHumanos} pontos<br><br>

TOTAL: ${total} pontos<br><br>

${texto}

</div>
`;
document.getElementById("relatorio").innerHTML=
`
<div class="card">

<h2>RELATÓRIO ERGOCONTEXTO</h2>

<b>Unidade:</b> ${document.getElementById("unidade").value}<br>
<b>Área:</b> ${document.getElementById("area").value}<br>
<b>Local:</b> ${document.getElementById("local").value}<br><br>

<b>Atividade:</b> ${document.getElementById("atividade").value}<br>
<b>Função:</b> ${document.getElementById("funcao").value}<br>
<b>Avaliador:</b> ${document.getElementById("avaliador").value}<br>
<b>Data:</b> ${document.getElementById("data").value}<br><br>

<b>Ergonomia:</b> ${ergonomia} pontos<br>
<b>Fatores Humanos:</b> ${fatoresHumanos} pontos<br>
<b>Total:</b> ${total} pontos<br><br>

<b>Resultado:</b> ${texto}<br><br>

<b>Observações Gerais:</b><br>
${document.getElementById("obs").value}

</div>
`;

}

function salvarHistorico(
resultado,
pontos,
ergonomia,
fatoresHumanos
){


let lista =
JSON.parse(
localStorage.getItem("historicoErgo")
|| "[]"
);

lista.unshift({

data:new Date().toLocaleString(),

atividade:
document.getElementById(
"atividade"
).value,

funcao:
document.getElementById(
"funcao"
).value,

resultado:resultado,
pontos:pontos,
ergonomia:ergonomia,
fatoresHumanos:fatoresHumanos,

unidade:
document.getElementById(
"unidade"
).value,


area:
document.getElementById(
"area"
).value,

local:
document.getElementById(
"local"
).value,

avaliador:
document.getElementById(
"avaliador"
).value,


});

localStorage.setItem(
"historicoErgo",
JSON.stringify(lista)
);

carregarHistorico();

}

function carregarHistorico(){

let lista =
JSON.parse(
localStorage.getItem("historicoErgo")
|| "[]"
);

let html="";

html += `
<button onclick="limparHistorico()"
style="
background:#c62828;
margin-bottom:15px;
">
Limpar Histórico
</button>
`;

lista.forEach(item=>{

html+=`
<div class="itemHistorico">

<b>${item.atividade}</b><br><br>

Unidade: ${item.unidade}<br>
Área: ${item.area}<br>
Local: ${item.local}<br><br>

Função: ${item.funcao}<br>
Avaliador: ${item.avaliador}<br><br>

Ergonomia: ${item.ergonomia} pontos<br>
Fatores Humanos: ${item.fatoresHumanos} pontos<br>
Pontuação Total: ${item.pontos} pontos<br><br>

${item.resultado}<br><br>

${item.data}

</div>
`;



});

document.getElementById(
"historico"
).innerHTML=html;

}
function limparHistorico(){

if(confirm("Deseja apagar todo o histórico?")){

localStorage.removeItem(
"historicoErgo"
);

carregarHistorico();

}

}

</script>

</body>
</html>
