<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004F3D">
<title>ErgoContexto — Triagem ergonômica e fatores humanos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --verde:#004F3D;--verde2:#007A5E;--laranja:#E46F2A;
  --bg:#f2f5f8;--card:#fff;--tx:#1b2a27;--mut:#5b6b67;--bd:#d9e0e4;--soft:#f6f8fa;
  --n0:#2e9e5b;--n0b:#e3f5e9;--n0t:#14532d;
  --n1:#d9a400;--n1b:#fff4cc;--n1t:#6b4e00;
  --n2:#e46f2a;--n2b:#ffe4cf;--n2t:#7a3300;
  --n3:#c62828;--n3b:#ffdada;--n3t:#7f1212;
  --nd:#9aa7a3;--ndb:#eceff1;--ndt:#455a64;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1618;--card:#182226;--tx:#e8eeec;--mut:#9fb0ab;--bd:#2b393e;--soft:#1e2a2f;
    --n0b:#153a26;--n0t:#9be3b5;--n1b:#3d3300;--n1t:#ffe083;--n2b:#4a2410;--n2t:#ffc49a;--n3b:#4a1515;--n3t:#ffb3b3;
    --ndb:#2a3438;--ndt:#b0bec5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px;scroll-padding-bottom:90px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .4em}
h2{font-size:1.2rem}h3{font-size:1.05rem}
p{margin:.4em 0}
small,.mut{color:var(--mut)}
button{font:inherit;cursor:pointer}
.topo{background:linear-gradient(135deg,var(--verde),var(--verde2));color:#fff;border-bottom:5px solid var(--laranja);padding:calc(10px + env(safe-area-inset-top)) 14px 0;position:sticky;top:0;z-index:20}
.marca{display:flex;gap:10px;align-items:center;padding-bottom:8px}
.marca h1{font-size:1.25rem;margin:0}
.marca span{font-size:.8rem;opacity:.85}
.marca svg{flex:none}
#nav{display:flex;gap:4px;overflow-x:auto}
#nav button{background:transparent;border:0;color:#d7efe8;padding:9px 14px;border-radius:8px 8px 0 0;font-size:.92rem;white-space:nowrap}
#nav button.on{background:var(--bg);color:var(--verde);font-weight:700}
@media (prefers-color-scheme:dark){#nav button.on{color:var(--tx)}}
main{max-width:860px;margin:0 auto;padding:10px 10px 110px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.09);padding:16px;margin:12px 0}
.aviso{background:#fff3cd;color:#6b5200;border-radius:10px;padding:10px 12px;font-size:.85rem}
@media (prefers-color-scheme:dark){.aviso{background:#3b3200;color:#ffe083}}
label.campo{display:block;margin-top:12px;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;padding:11px;margin-top:4px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:3px solid color-mix(in srgb,var(--verde2) 55%,transparent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;background:var(--laranja);color:#fff;font-weight:700;font-size:1rem}
.btn.sec{background:var(--card);color:var(--verde);border:1.5px solid var(--verde2)}
@media (prefers-color-scheme:dark){.btn.sec{color:#9be3d0}}
.btn.verde{background:var(--verde)}
.btn.perigo{background:#c62828}
.btn.peq{padding:7px 11px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:default}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px}
.chip{flex:none;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;align-items:center;min-width:74px;font-size:.78rem}
.chip.on{border-color:var(--verde2);background:color-mix(in srgb,var(--verde2) 12%,var(--card));font-weight:700}
.chip.ok{border-color:var(--n0)}
.chip .ci{font-size:1.15rem}
.chip small{font-size:.7rem}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:15}
.rodape[hidden]{display:none}
.rodape .btn{flex:1;max-width:260px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--bd);color:var(--mut);margin:0 4px 4px 0}
.domhead{border-left:6px solid var(--verde2)}
.item{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0;background:var(--card)}
.item legend{font-weight:700;padding:0 6px;font-size:.98rem}
.item .num{display:inline-block;background:var(--verde);color:#fff;border-radius:99px;min-width:24px;height:24px;line-height:24px;text-align:center;font-size:.8rem;margin-right:4px}
.dica{font-size:.83rem;color:var(--mut);margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--bd);border-radius:10px;padding:9px 10px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt input{width:auto;margin:3px 0 0;flex:none;accent-color:var(--verde2)}
.opt .otx{font-size:.9rem}
.opt .otx b{display:block;font-size:.82rem;letter-spacing:.02em;text-transform:uppercase}
.opt.n0 b{color:var(--n0t)}.opt.n1 b{color:var(--n1t)}.opt.n2 b{color:var(--n2t)}.opt.n3 b{color:var(--n3t)}
.opt:has(input:checked).n0{border-color:var(--n0);background:var(--n0b)}
.opt:has(input:checked).n1{border-color:var(--n1);background:var(--n1b)}
.opt:has(input:checked).n2{border-color:var(--n2);background:var(--n2b)}
.opt:has(input:checked).n3{border-color:var(--n3);background:var(--n3b)}
.opt:has(input:checked).na{border-color:var(--nd);background:var(--ndb)}
.opt.na{font-size:.85rem;color:var(--mut);padding:6px 10px}
.ev{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.8rem;color:var(--mut)}
.ev label{border:1px solid var(--bd);border-radius:99px;padding:3px 10px;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.ev label{position:relative}
.ev label:focus-within{outline:3px solid color-mix(in srgb,var(--verde2) 55%,transparent)}
.ev label:has(input:checked){background:var(--verde2);border-color:var(--verde2);color:#fff}
.ev input{width:auto;margin:0;accent-color:#fff;position:absolute;opacity:0;pointer-events:none}
details.nota{margin-top:8px}
details.nota summary{cursor:pointer;color:var(--verde2);font-size:.85rem;font-weight:600}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.8rem;white-space:nowrap}
.bd.n0{background:var(--n0b);color:var(--n0t)}.bd.n1{background:var(--n1b);color:var(--n1t)}
.bd.n2{background:var(--n2b);color:var(--n2t)}.bd.n3{background:var(--n3b);color:var(--n3t)}
.bd.nd{background:var(--ndb);color:var(--ndt)}
.acao{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0;background:var(--soft)}
.sug{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--bd);padding:7px 0;font-size:.88rem}
/* Relatório */
.rel h2.titulo{background:linear-gradient(135deg,var(--verde),var(--verde2));color:#fff;border-radius:10px;padding:14px;margin:0 0 12px;font-size:1.15rem}
.rel h3{border-bottom:2px solid var(--laranja);padding-bottom:3px;margin:18px 0 8px}
.rel table{width:100%;border-collapse:collapse;font-size:.85rem}
.rel th,.rel td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.rel th{background:var(--soft)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:3px 10px;font-size:.9rem}
.kv b{color:var(--mut);font-weight:600}
@media (max-width:560px){.kv{grid-template-columns:110px 1fr}}
.resumo{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.resumo>div{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--soft)}
.resumo small{display:block}
.resumo strong{font-size:1.05rem}
.radar{width:100%;max-width:420px;display:block;margin:0 auto}
.radar .anel{fill:none;stroke:var(--bd);stroke-width:1}
.radar .eixo{stroke:var(--bd);stroke-width:1}
.radar .area{fill-opacity:.25;stroke-width:2.5}
.radar .ant{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:5 4}
.radar text{fill:var(--tx);font-size:11.5px;font-weight:600}
.radar .esc{fill:var(--mut);font-size:9px;font-weight:400}
.mc-linha{display:flex;align-items:center;gap:8px;margin:4px 0}
.mc-rot{width:92px;font-size:.78rem;color:var(--mut);flex:none}
.mc-cel{display:flex;gap:3px;flex-wrap:wrap}
.mc{display:inline-block;width:20px;height:20px;border-radius:5px;background:var(--nd)}
.mc.n0{background:var(--n0)}.mc.n1{background:var(--n1)}.mc.n2{background:var(--n2)}.mc.n3{background:var(--n3)}.mc.nd{background:var(--ndb);border:1px dashed var(--nd)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.foto-rel{max-width:100%;max-height:340px;border-radius:10px;display:block;margin:8px 0}
.ia-txt{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:12px;font-size:.9rem}
.assin{display:flex;gap:30px;margin-top:40px}
.assin div{flex:1;border-top:1px solid var(--tx);padding-top:4px;font-size:.8rem;text-align:center}
.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--ndb)}
.stack i{display:block}
.hist{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.dots{display:flex;gap:4px;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ndb);border:1px solid var(--nd)}
.dots i.n0{background:var(--n0)}.dots i.n1{background:var(--n1)}.dots i.n2{background:var(--n2)}.dots i.n3{background:var(--n3)}
.banner{border:1.5px solid var(--verde2);background:color-mix(in srgb,var(--verde2) 10%,var(--card));border-radius:12px;padding:12px;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;background:var(--card)}
.kpi strong{display:block;font-size:1.6rem}
.alerta{border-left:5px solid var(--n2);background:var(--n2b);color:var(--n2t);padding:8px 10px;border-radius:8px;font-size:.85rem;margin:8px 0}
.sobre table{width:100%;border-collapse:collapse;font-size:.85rem}
.sobre td,.sobre th{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.sobre th{background:var(--soft)}
@media (max-width:620px){
  .rel table.resp thead{display:none}
  .rel table.resp,.rel table.resp tbody{display:block}
  .rel table.resp tr{display:block;border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:6px 8px;background:var(--card)}
  .rel table.resp td{display:block;border:0;padding:4px 2px}
  .rel table.resp td::before{content:attr(data-l);display:block;font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
}
@media print{
  :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#bbb;--soft:#f3f3f3;
    --n0b:#e3f5e9;--n0t:#14532d;--n1b:#fff4cc;--n1t:#6b4e00;--n2b:#ffe4cf;--n2t:#7a3300;--n3b:#ffdada;--n3t:#7f1212;--ndb:#eceff1;--ndt:#455a64}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print,.topo,.rodape{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card{box-shadow:none;border-radius:0;padding:0;margin:0}
  .rel h3{break-after:avoid}
  .rel h3,.rel table,.rel .resumo,.mc-linha{break-inside:avoid}
  .rel tr{break-inside:avoid}
}
</style>
</head>
<body>
<header class="topo no-print">
  <div class="marca">
    <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#fff" opacity=".15"/><circle cx="32" cy="14" r="6" fill="#fff"/><path d="M32 22v18m0 0-10 14m10-14 10 14M20 30l12-4 12 4" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <div><h1>ErgoContexto</h1><span>Triagem ergonômica e fatores humanos</span></div>
  </div>
  <nav id="nav" aria-label="Seções">
    <button data-v="avaliar" class="on">Avaliar</button>
    <button data-v="historico">Histórico</button>
    <button data-v="painel">Painel</button>
    <button data-v="sobre">Sobre o método</button>
  </nav>
</header>

<main>
  <section id="v-avaliar" class="view on">
    <div id="banner" class="no-print"></div>
    <div id="palco"></div>
  </section>
  <section id="v-historico" class="view"></section>
  <section id="v-painel" class="view"></section>
  <section id="v-sobre" class="view sobre"></section>
</main>

<div id="rodape" class="rodape no-print" hidden></div>
<noscript><p style="padding:20px">Este aplicativo precisa de JavaScript.</p></noscript>

<script>
"use strict";
/* =====================================================================
   MODELO — domínios, itens e critérios de triagem
   Níveis do item: 0 Adequado · 1 Baixa · 2 Moderada · 3 Alta
   Os critérios são de TRIAGEM (inspirados na literatura); não substituem
   método quantitativo validado nem avaliação especializada.
   ===================================================================== */
const VERSAO_MODELO = 2;
const GRUPOS = {
  erg: "Ergonomia · saúde e conforto",
  fh:  "Fatores humanos · desempenho e segurança"
};

  {curto:"Baixa",    ico:"🟢"},
  {curto:"Moderada", ico:"🟡"},
  {curto:"Alta",     ico:"🟠"},
  {curto:"Crítica",  ico:"🔴"}
];
const ROT_ITEM = ["Adequado","Baixa","Moderada","Alta"];
const PROXIMO_PASSO = [
  "Manter e monitorar. Registrar e reavaliar se houver mudança na atividade.",
  "Melhoria local com a equipe (nível Observação): corrigir o que é simples e acompanhar.",
  "Aprofundar (nível Análise): aplicar método específico e envolver SESMT/ergonomia.",
  "Acionar especialista (nível Perícia/AET) e definir contenção imediata enquanto isso."
];
const PRIOS = ["Baixa","Média","Alta","Imediata"];
const STATUS = ["Aberta","Em andamento","Concluída"];
const CONTROLES = [
  "Eliminar o perigo / fator",
  "Substituir (processo, material, ferramenta)",
  "Engenharia / organização do trabalho",
  "Administrativo (procedimento, treino, rodízio)",
  "EPI / apoio individual"
];
const GRAVIDADES = ["Leve (sem afastamento)","Moderada (lesão leve / retrabalho)","Grave (afastamento / dano relevante)","Muito grave (lesão severa / dano crítico)"];
const EXPOSICOES = ["Menos de 2 h","2 a 4 h","4 a 6 h","Mais de 6 h"];

const DOMINIOS = [
{ id:"fis", grupo:"erg", ico:"🦾", nome:"Ergonomia física", curto:"Física",
  pergunta:"A atividade impõe carga biomecânica que pode causar dor, desconforto ou lesão?",
  desfecho:["Saúde musculoesquelética"],
  ref:"ISO 11226, ISO 11228 (1-3), NIOSH, OCRA, RULA/REBA, NR-17",
  aprofundar:"REBA/RULA (postura), NIOSH/ISO 11228-1 (cargas), OCRA/ISO 11228-3 (repetitividade)",
  itens:[
  {id:"f1",t:"Tronco e pescoço",d:"Observe inclinação, torção e flexão do pescoço durante o ciclo de trabalho.",
   c:["Posição neutra: tronco ereto e cabeça alinhada",
      "Inclinação ou torção leve, ocasional (menos de 1/3 do tempo)",
      "Flexão do tronco acima de ~20°, torção ou pescoço fletido por 1/3 a 2/3 do tempo",
      "Flexão acima de ~60°, tronco torcido/inclinado ou pescoço muito fletido por mais de 2/3 do tempo, ou posição mantida sem apoio"]},
  {id:"f2",t:"Ombros e braços",d:"Altura das mãos em relação ao ombro e distância do corpo.",
   c:["Braços junto ao corpo, cotovelos apoiados, trabalho na altura do tronco",
      "Elevação ou afastamento do braço ocasional (menos de 1/3 do tempo)",
      "Mãos na altura ou acima dos ombros, ou braços afastados do corpo por 1/3 a 2/3 do tempo",

  {id:"f3",t:"Punhos e mãos",d:"Desvio do punho, tipo de pega e adequação da ferramenta à mão.",
   c:["Punho neutro, pega confortável, sem pinça fina",
      "Desvio leve do punho ou pega em pinça ocasional",
      "Desvio do punho, pinça ou ferramenta mal ajustada com frequência",
      "Desvio acentuado do punho, pinça forçada ou ferramenta inadequada à mão de forma predominante"]},
  {id:"f4",t:"Pernas, pés e posição geral",d:"Em pé, sentado, agachado: duração e possibilidade de alternar.",
   c:["Alterna posturas livremente; apoio de pés/assento adequado",
      "Posição fixa por períodos curtos (até ~30 min) com apoio razoável",
      "Em pé parado ou sentado sem bom apoio por 30 a 60 min, ou agachar/ajoelhar com frequência",
      "Permanência estática acima de 1 h, agachado/ajoelhado ou sem possibilidade de alternar"]},
  {id:"f5",t:"Repetitividade",d:"Ciclos curtos (menos de ~30 s) ou o mesmo gesto repetido ao longo da jornada.",
   c:["Tarefas variadas, sem ciclos repetitivos relevantes",

{ id:"amb", grupo:"erg", ico:"🌡️", nome:"Ambiente de trabalho", curto:"Ambiente",

  ref:"NR-15, NR-17, NHO (Fundacentro), ISO 7730, ABNT NBR ISO/CIE 8995-1",

  itens:[
  {id:"a1",t:"Iluminação e ofuscamento",d:"Adequação à tarefa (precisão visual), sombras e reflexos.",

  {id:"a2",t:"Ruído",d:"Pergunte se é possível conversar sem elevar a voz.",

const ITENS = {};

const TOTAL_ITENS = Object.keys(ITENS).length;

/* =====================================================================
   PONTUAÇÃO — por domínio, sem soma global
   ===================================================================== */
function nivelDaMedia(m){return m<0.5?0:m<1.5?1:m<2.25?2:3}
function valorItem(resp,id){const r=resp[id];return r&&typeof r.n==="number"?r.n:null}

function calcular(resp){
  const doms=DOMINIOS.map(d=>{
    const vals=d.itens.map(q=>valorItem(resp,q.id)).filter(v=>v!==null);
    const total=d.itens.length;
    const insuf=vals.length<Math.ceil(total/2);
    let media=null,nivel=null,elevado=false;
    const n3=vals.filter(v=>v===3).length;
    if(!insuf){
      media=vals.reduce((a,b)=>a+b,0)/vals.length;
      nivel=nivelDaMedia(media);
      // regra anti-diluição: um item Alto garante ao menos nível Alta; três itens Altos, Crítica
      const piso=n3>=3?3:n3>=1?2:0;
      if(piso>nivel){nivel=piso;elevado=true}
    }
    return {id:d.id,media,nivel,elevado,respondidos:vals.length,total,insuf,n3};
  });
  const validos=doms.filter(x=>!x.insuf);
  const pior=validos.length?Math.max(...validos.map(x=>x.nivel)):null;
  const resp_=doms.reduce((a,x)=>a+x.respondidos,0);
  return {doms,pior,respondidos:resp_,total:TOTAL_ITENS};
}

function prioridadeSugerida(calc,ctx){
  if(calc.pior===null)return {prio:null,porGravidade:false};
  let p=calc.pior,porGravidade=false;
  const grav=ctx.gravidade===""||ctx.gravidade==null?null:Number(ctx.gravidade);
  const fhMax=Math.max(-1,...calc.doms.filter(x=>!x.insuf&&DOMINIOS.find(d=>d.id===x.id).grupo==="fh").map(x=>x.nivel));
  if(grav!==null&&grav>=2&&fhMax>=2&&p<3){p+=1;porGravidade=true}
  return {prio:p,porGravidade};
}

function itensAtencao(resp,min=2){
  const out=[];
  DOMINIOS.forEach(d=>d.itens.forEach(q=>{const n=valorItem(resp,q.id);if(n!==null&&n>=min)out.push({dom:d,q,n})}));
  return out.sort((a,b)=>b.n-a.n);
}

/* ---------- Eventos do wizard ---------- */
function setPath(path,val){
  const ks=path.split(".");let o=estado;
  for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]]}
  o[ks[ks.length-1]]=val;
}
function onCampo(e){
  const t=e.target;
  if(t.id==="foto"&&e.type==="change"){tratarFoto(t.files[0]);return}
  if(t.type==="radio"){
    if(t.name.startsWith("r_")){
      const id=t.name.slice(2);estado.resp[id]=estado.resp[id]||{};
      estado.resp[id].n=t.value==="na"?"na":Number(t.value);
      atualizarProgresso();agendarSalvar();
    } else if(t.name.startsWith("e_")){
      const id=t.name.slice(2);estado.resp[id]=estado.resp[id]||{};
      estado.resp[id].ev=t.value;agendarSalvar();
    }
    return;
  }
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);agendarSalvar();return}
  if(t.dataset.obs){const id=t.dataset.obs;estado.resp[id]=estado.resp[id]||{};estado.resp[id].obs=t.value;agendarSalvar();return}
  if(t.dataset.dom){const [id,c]=t.dataset.dom.split(".");estado.dom[id]=estado.dom[id]||{};estado.dom[id][c]=t.value;agendarSalvar();return}
  if(t.dataset.ac){const [i,c]=t.dataset.ac.split(".");if(estado.acoes[i]){estado.acoes[i][c]=t.value;agendarSalvar()}return}
}
function tratarFoto(arq){
  if(!arq)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const M=1000,esc_=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*esc_);c.height=Math.round(img.height*esc_);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      estado.foto=c.toDataURL("image/jpeg",0.72);
      $("#fotoBox").innerHTML=`<img class="foto-rel" src="${esc(estado.foto)}" alt="Foto da atividade"><button class="btn sec peq" data-acao="rmfoto">Remover foto</button>`;
      agendarSalvar();
    };
    img.onerror=()=>aviso("Não foi possível ler essa imagem.");
    img.src=rd.result;
  };
  rd.readAsDataURL(arq);
}
function novaAcao(extra){
  estado.acoes.push(Object.assign({dom:"",tipo:"",acao:"",resp:"",prazo:"",prio:"Média",status:"Aberta",origem:""},extra||{}));
}

function finalizar(){
  const calc=calcular(estado.resp);
  if(calc.respondidos===0){aviso("Responda pelo menos alguns itens antes de finalizar.");return}
  const insuf=calc.doms.filter(x=>x.insuf).map(x=>DOMINIOS.find(d=>d.id===x.id).nome);
  if(insuf.length&&!confirm("Estes domínios têm menos da metade dos itens avaliados e ficarão como \"dados insuficientes\":\n\n• "+insuf.join("\n• ")+"\n\nFinalizar mesmo assim?"))return;
  if(!estado.ctx.atividade&&!confirm("A atividade não foi informada. Finalizar mesmo assim?"))return;
  estado.acoes=estado.acoes.filter(a=>a.acao.trim());
  const agora=Date.now();
  if(!estado.criadoEm)estado.criadoEm=agora;
  const pr=prioridadeSugerida(calc,estado.ctx);
  const av={id:estado.id,versao:VERSAO_MODELO,criadoEm:estado.criadoEm,atualizadoEm:agora,
    ctx:{...estado.ctx},resp:JSON.parse(JSON.stringify(estado.resp)),dom:JSON.parse(JSON.stringify(estado.dom)),
    acoes:JSON.parse(JSON.stringify(estado.acoes)),ia:estado.ia||"",foto:estado.foto||"",
    resultado:{doms:calc.doms,pior:calc.pior,prio:pr.prio,porGravidade:pr.porGravidade,respondidos:calc.respondidos,total:calc.total}};
  const i=lista.findIndex(a=>a.id===av.id);
  if(i>=0)lista[i]=av;else lista.unshift(av);
  salvarLista();
  try{localStorage.removeItem(CH_RASC)}catch(e){}
  estado.fase="resultado";
  render();window.scrollTo(0,0);
}
function avAtual(){return lista.find(a=>a.id===estado.id)}

function anterior(av){
  const k=norm(av.ctx.atividade)+"|"+norm(av.ctx.local);
  if(!norm(av.ctx.atividade))return null;
  return lista.filter(a=>!a.legado&&a.id!==av.id&&a.criadoEm<av.criadoEm&&(norm(a.ctx.atividade)+"|"+norm(a.ctx.local))===k)
    .sort((a,b)=>b.criadoEm-a.criadoEm)[0]||null;
}

function radarSvg(res,ant){
  const W=380,H=310,cx=190,cy=158,R=100,n=DOMINIOS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*(v/3)*Math.cos(ang(i)),cy+R*(v/3)*Math.sin(ang(i))];
  let s=`<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de exposição por domínio">`;
  [1,2,3].forEach(r=>{s+=`<polygon class="anel" points="${DOMINIOS.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`});
  DOMINIOS.forEach((d,i)=>{
    const [x,y]=pt(i,3);s+=`<line class="eixo" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx,ly]=pt(i,3.42),c=Math.cos(ang(i));
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${c>0.3?"start":c<-0.3?"end":"middle"}">${esc(d.curto)}</text>`;
  });
  [1,2,3].forEach(r=>{s+=`<text class="esc" x="${cx+3}" y="${(cy-R*r/3+10).toFixed(1)}">${r}</text>`});
  if(ant){
    const pts=ant.resultado.doms.map((x,i)=>pt(i,x.media??0).map(v=>v.toFixed(1)).join(",")).join(" ");
    s+=`<polygon class="ant" points="${pts}"/>`;
  }
  const cor=res.pior===null?"var(--nd)":`var(--n${res.pior})`;
  const pts=res.doms.map((x,i)=>pt(i,x.media??0).map(v=>v.toFixed(1)).join(",")).join(" ");
  s+=`<polygon class="area" points="${pts}" fill="${cor}" stroke="${cor}"/>`;
  res.doms.forEach((x,i)=>{const [px,py]=pt(i,x.media??0);s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${x.nivel===null?"var(--nd)":`var(--n${x.nivel})`}" stroke="#fff" stroke-width="1.5"><title>${esc(DOMINIOS[i].nome)}: ${fmtMedia(x.media)}</title></circle>`});
  return s+"</svg>";
}
function mapaCalor(resp){
  const linhas=DOMINIOS.map(d=>`<div class="mc-linha"><span class="mc-rot">${esc(d.curto)}</span><span class="mc-cel">${d.itens.map(q=>{const n=valorItem(resp,q.id);return `<i class="mc ${n===null?"nd":"n"+n}" title="${esc(q.t)}: ${n===null?"não avaliado":ROT_ITEM[n]}"></i>`}).join("")}</span></div>`).join("");
  return linhas+`<div class="leg"><span><i style="background:var(--n0)"></i>Adequado</span><span><i style="background:var(--n1)"></i>Baixa</span><span><i style="background:var(--n2)"></i>Moderada</span><span><i style="background:var(--n3)"></i>Alta</span><span><i style="border:1px dashed var(--nd)"></i>Não avaliado</span></div>`;
}
function divergencia(av,id){
  const p=av.dom&&av.dom[id]&&av.dom[id].perc;
  const r=av.resultado.doms.find(x=>x.id===id);
  if(p===""||p===undefined||r.media===null)return false;
  return Math.abs(Number(p)-r.media)>=1.5;
}

function relatorioHtml(av){

    const dTxt=delta===null?"":(Math.abs(delta)<0.05?" (=)":delta<0?` <span style="color:var(--n0t)">▼ ${fmtMedia(Math.abs(delta))}</span>`:` <span style="color:var(--n3t)">▲ ${fmtMedia(delta)}</span>`);
    return `<tr><td data-l="Domínio"><b>${esc(d.nome)}</b><br><small>${esc(GRUPOS[d.grupo])}</small></td><td data-l="Média (0–3)">${fmtMedia(r.media)}${dTxt}</td><td data-l="Nível">${badge(r.nivel)}${r.elevado?"<br><small>elevado por item Alto</small>":""}</td><td data-l="Itens avaliados">${r.respondidos}/${r.total}</td><td data-l="Próximo passo (lógica SOBANE)">${r.nivel===null?"Completar a avaliação deste domínio.":esc(PROXIMO_PASSO[r.nivel])}${r.nivel!==null&&r.nivel>=2?`<br><small>Métodos: ${esc(d.aprofundar)}</small>`:""}${div?`<br><small style="color:var(--n2t)">⚠ A percepção dos trabalhadores diverge da observação. Vale conversar e investigar.</small>`:""}</td></tr>`;

  const acoes=av.acoes.map(a=>`<tr><td data-l="Ação">${esc(a.acao)}${a.origem&&ITENS[a.origem]?`<br><small>Origem: ${esc(ITENS[a.origem].t)}</small>`:""}</td><td data-l="Domínio">${esc(a.dom?DOMINIOS.find(d=>d.id===a.dom).curto:"Geral")}</td><td data-l="Tipo de controle">${esc(a.tipo||"—")}</td><td data-l="Responsável">${esc(a.resp||"—")}</td><td data-l="Prazo">${esc(fmtData(a.prazo)||"—")}</td><td data-l="Prioridade">${esc(a.prio)}</td><td data-l="Status">${esc(a.status)}</td></tr>`).join("");
  return `<div class="rel">
  <h2 class="titulo">RELATÓRIO ERGOCONTEXTO · Triagem ergonômica e de fatores humanos</h2>
  <div class="kv">
    <b>Avaliação</b><span>${esc(av.id)}</span>
    <b>Data</b><span>${esc(fmtData(c.data))}</span>
    <b>Unidade / Área</b><span>${esc(c.unidade)} ${c.area?" · "+esc(c.area):""}</span>
    <b>Local / Posto</b><span>${esc(c.local)}</span>

    <b>Exposição / jornada</b><span>${c.exposicao!==""&&c.exposicao!=null?esc(EXPOSICOES[c.exposicao]):"Não informada"}</span>
    <b>Gravidade potencial</b><span>${c.gravidade!==""&&c.gravidade!=null?esc(GRAVIDADES[c.gravidade]):"Não informada"}</span>
  </div>
  ${av.foto?`<img class="foto-rel" src="${esc(av.foto)}" alt="Foto da atividade">`:""}
  <h3>Resumo</h3>
  <div class="resumo">

    <div><small>Prioridade sugerida</small><strong>${esc(prio)}</strong>${res.porGravidade?"<small>elevada pela gravidade potencial</small>":""}</div>
    <div><small>Itens avaliados</small><strong>${res.respondidos}/${res.total}</strong></div>
  </div>
  <h3>Perfil por domínio</h3>
  ${radarSvg(res,ant)}
  ${ant?`<p style="text-align:center"><small>Linha tracejada: avaliação anterior desta atividade (${esc(fmtData(ant.ctx.data))}).</small></p>`:""}
  <div><table class="resp"><thead><tr><th>Domínio</th><th>Média (0–3)</th><th>Nível</th><th>Itens</th><th>Próximo passo (lógica SOBANE)</th></tr></thead><tbody>${linhasDom}</tbody></table></div>
  <h3>Mapa de itens</h3>${mapaCalor(av.resp)}

/* ---------- IA ---------- */
const URL_IA="https://ergocontexto-ia.raul-almeida-siqueira.workers.dev/api/ergo";
function payloadIA(av){
  const monta=(simples)=>({
    versao:VERSAO_MODELO,
    atividade:av.ctx.atividade,funcao:av.ctx.funcao,
    gravidadePotencial:av.ctx.gravidade!==""&&av.ctx.gravidade!=null?GRAVIDADES[av.ctx.gravidade]:"não informada",
    exposicaoJornada:av.ctx.exposicao!==""&&av.ctx.exposicao!=null?EXPOSICOES[av.ctx.exposicao]:"não informada",
    prioridadeSugerida:av.resultado.prio===null?"indefinida":PRIOS[av.resultado.prio],
    observacoesGerais:(av.ctx.obs||"").slice(0,600),
    dominios:DOMINIOS.map((d,i)=>{
      const r=av.resultado.doms[i],dm=(av.dom&&av.dom[d.id])||{};
      return {dominio:d.nome,grupo:GRUPOS[d.grupo],media:r.media===null?null:Number(r.media.toFixed(2)),
        nivel:r.nivel===null?"dados insuficientes":NIVEIS[r.nivel].curto,itensAvaliados:`${r.respondidos}/${r.total}`,
        percepcaoTrabalhadores:dm.perc!==""&&dm.perc!==undefined?["sem incômodo","pouco incômodo","incômodo moderado","muito incômodo"][dm.perc]:"não coletada",
        fatoresProtecao:(dm.prot||"").slice(0,300),
        itensAtencao:d.itens.map(q=>({q,n:valorItem(av.resp,q.id)})).filter(x=>x.n!==null&&x.n>=2).map(x=>{
          const r2=av.resp[x.q.id]||{};
          const o={item:x.q.t,nivel:ROT_ITEM[x.n],fonte:r2.ev||"não informada",observacao:(r2.obs||"").slice(0,300)};
          if(!simples)o.criterio=x.q.c[x.n];
          return o;
        })};
    })
  });
  let p=monta(false);
  if(JSON.stringify(p).length>18000)p=monta(true);
  return p;
}
async function analisarIA(){
  const av=avAtual();if(!av)return;
  const btn=$("#btnIA"),msg=$("#msgIA");
  btn.disabled=true;btn.textContent="⏳ Analisando...";msg.innerHTML="";
  try{
    const r=await fetch(URL_IA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payloadIA(av))});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.analise)throw new Error(j.erro||"falha");
    av.ia=j.analise;av.atualizadoEm=Date.now();salvarLista();
    const y=window.scrollY;renderResultado();window.scrollTo(0,y);
    $("#blocoIA").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    msg.innerHTML=`<div class="alerta">Não foi possível gerar a análise. Verifique a internet e tente novamente.${e.message&&e.message!=="falha"?" ("+esc(e.message)+")":""}</div>`;
    btn.disabled=false;btn.textContent="Analisar com IA";
  }
}
function iaParaPlano(){
  const av=avAtual();if(!av||!av.ia)return;
  const ini=av.ia.indexOf("SUGESTÕES DE AÇÃO:"),fim=av.ia.indexOf("NECESSIDADE DE AVALIAÇÃO");
  if(ini<0){aviso("Não encontrei a seção de sugestões na análise.");return}
  const bloco=av.ia.substring(ini+18,fim>ini?fim:undefined);
  const linhas=bloco.split("\n").map(l=>l.replace(/^\s*(?:[-•*–]|\d+[.)])\s*/,"").trim()).filter(l=>l.length>8);
  if(!linhas.length){aviso("Nenhuma sugestão identificada.");return}
  linhas.slice(0,5).forEach(l=>av.acoes.push({dom:"",tipo:"",acao:l+" (sugestão da IA, validar)",resp:"",prazo:"",prio:"Média",status:"Aberta",origem:""}));
  av.atualizadoEm=Date.now();salvarLista();renderResultado();aviso(linhas.slice(0,5).length+" sugestões adicionadas ao plano. Edite em Editar respostas → Plano.");
}

   HISTÓRICO

function migrarLegado(){
  try{
    if(localStorage.getItem("ergocontexto_v2_migrado"))return;
    const velho=lerJSON("historicoErgo",[]);
    if(Array.isArray(velho)&&velho.length){
      velho.forEach((h,i)=>lista.push({id:"V1-"+i+"-"+String(h.data||"").replace(/\W/g,""),legado:true,criadoEm:0,atualizadoEm:0,
        ctx:{unidade:h.unidade||"",area:h.area||"",local:h.local||"",atividade:h.atividade||"",funcao:h.funcao||"",avaliador:h.avaliador||"",data:""},
        legadoInfo:{data:h.data,resultado:h.resultado,pontos:h.pontos,ergonomia:h.ergonomia,fh:h.fatoresHumanos}}));
      salvarLista();
    }
    localStorage.setItem("ergocontexto_v2_migrado","1");
  }catch(e){}
}
function renderHistorico(){
  const v=$("#v-historico");
  const termo=norm(v.dataset.q||"");
  const itens=lista.filter(a=>!termo||norm([a.ctx.atividade,a.ctx.local,a.ctx.unidade,a.ctx.area,a.ctx.funcao,a.id].join(" ")).includes(termo));
  v.innerHTML=`
  <div class="card no-print">
    <h2>Histórico</h2>
    <input id="busca" placeholder="Buscar por atividade, local, unidade, função…" value="${esc(v.dataset.q||"")}">
    <div class="linha" style="margin-top:10px">
      <button class="btn sec peq" data-acao="exp-json">Backup (JSON)</button>
      <button class="btn sec peq" data-acao="exp-csv-av">Avaliações (CSV)</button>
      <button class="btn sec peq" data-acao="exp-csv-ac">Ações (CSV)</button>
      <button class="btn sec peq" data-acao="imp-json">Importar backup</button>
      <input type="file" id="impArq" accept="application/json,.json" hidden>
    </div>
    <small>Os dados ficam só neste aparelho/navegador. Faça backup com frequência.</small>
  </div>
  ${itens.map(a=>cartaoHist(a)).join("")||'<div class="card"><p class="mut">Nenhuma avaliação encontrada.</p></div>'}
  ${lista.length?`<div class="card no-print"><button class="btn perigo peq" data-acao="limpar">Apagar todo o histórico</button></div>`:""}`;
  const b=$("#busca");if(b){b.addEventListener("input",()=>{v.dataset.q=b.value;const pos=b.selectionStart;renderHistorico();const nb=$("#busca");nb.focus();nb.setSelectionRange(pos,pos)})}
  const imp=$("#impArq");if(imp)imp.addEventListener("change",()=>importarJSON(imp.files[0]));
}
function cartaoHist(a){
  const titulo=`<b>${esc(a.ctx.atividade||"(sem atividade)")}</b><br><small>${esc([a.ctx.unidade,a.ctx.area,a.ctx.local].filter(Boolean).join(" · "))}</small>`;
  if(a.legado){
    const l=a.legadoInfo;
    return `<div class="hist">${titulo}<p><small>Avaliação do modelo anterior (v1): ${esc(l.resultado||"")} · ${esc(l.pontos)} pontos · ${esc(l.data||"")}. Não comparável com o modelo atual.</small></p>
    <div class="linha no-print"><button class="btn perigo peq" data-acao="del" data-id="${esc(a.id)}">Excluir</button></div></div>`;
  }
  const abertas=a.acoes.filter(x=>x.status!=="Concluída").length;
  return `<div class="hist">${titulo}
    <div class="dots" title="Perfil por domínio">${a.resultado.doms.map((r,i)=>`<i class="${r.nivel===null?"":"n"+r.nivel}" title="${esc(DOMINIOS[i].curto)}: ${r.nivel===null?"insuficiente":NIVEIS[r.nivel].curto}"></i>`).join("")}</div>
    <div class="linha">${badge(a.resultado.pior)}<small>Prioridade: <b>${a.resultado.prio===null?"—":PRIOS[a.resultado.prio]}</b> · ${esc(fmtData(a.ctx.data))} · ${abertas} ação(ões) em aberto</small></div>
    <div class="linha no-print" style="margin-top:8px">
      <button class="btn sec peq" data-acao="abrir" data-id="${esc(a.id)}">Abrir relatório</button>
      <button class="btn sec peq" data-acao="editar-h" data-id="${esc(a.id)}">Editar</button>
      <button class="btn sec peq" data-acao="reavaliar" data-id="${esc(a.id)}">Reavaliar</button>
      <button class="btn perigo peq" data-acao="del" data-id="${esc(a.id)}">Excluir</button>
    </div></div>`;
}
function carregarParaEstado(a,fase){
  estado={id:a.id,criadoEm:a.criadoEm,passo:0,fase,ctx:{...a.ctx},resp:JSON.parse(JSON.stringify(a.resp)),dom:JSON.parse(JSON.stringify(a.dom||{})),
    acoes:JSON.parse(JSON.stringify(a.acoes||[])),ia:a.ia||"",foto:a.foto||""};
  irPara("avaliar");
}
function csv(rows){
  const cel=c=>{c=String(c??"");if(/^[=+\-@\t\r]/.test(c))c="'"+c;return /[;"\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c};
  return "﻿"+rows.map(r=>r.map(cel).join(";")).join("\r\n");
}
function baixar(nome,conteudo,tipo){
  const b=new Blob([conteudo],{type:tipo});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);
}
function exportar(tipo){
  const L=lista.filter(a=>!a.legado);
  if(tipo==="json")return baixar(`ergocontexto-backup-${hojeISO()}.json`,JSON.stringify({app:"ergocontexto",versao:VERSAO_MODELO,exportadoEm:Date.now(),avaliacoes:lista}),"application/json");
  if(tipo==="av"){
    const cab=["ID","Data","Unidade","Área","Local","Atividade","Função","Avaliador","Prioridade sugerida","Domínio mais crítico",...DOMINIOS.flatMap(d=>[d.nome+" (média)",d.nome+" (nível)"]),"Itens avaliados"];
    const rows=L.map(a=>[a.id,fmtData(a.ctx.data),a.ctx.unidade,a.ctx.area,a.ctx.local,a.ctx.atividade,a.ctx.funcao,a.ctx.avaliador,a.resultado.prio===null?"":PRIOS[a.resultado.prio],a.resultado.pior===null?"":NIVEIS[a.resultado.pior].curto,
      ...a.resultado.doms.flatMap(r=>[r.media===null?"":fmtMedia(r.media),r.nivel===null?"Dados insuficientes":NIVEIS[r.nivel].curto]),`${a.resultado.respondidos}/${a.resultado.total}`]);
    return baixar(`ergocontexto-avaliacoes-${hojeISO()}.csv`,csv([cab,...rows]),"text/csv;charset=utf-8");
  }
  if(tipo==="ac"){
    const cab=["Avaliação","Atividade","Local","Domínio","Tipo de controle","Ação","Responsável","Prazo","Prioridade","Status"];
    const rows=L.flatMap(a=>a.acoes.map(x=>[a.id,a.ctx.atividade,a.ctx.local,x.dom?DOMINIOS.find(d=>d.id===x.dom).nome:"Geral",x.tipo,x.acao,x.resp,fmtData(x.prazo),x.prio,x.status]));
    return baixar(`ergocontexto-acoes-${hojeISO()}.csv`,csv([cab,...rows]),"text/csv;charset=utf-8");
  }
}
function importarJSON(arq){
  if(!arq)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=="ergocontexto"||!Array.isArray(d.avaliacoes))throw new Error();
      const ids=new Set(lista.map(a=>a.id));let novos=0;
      d.avaliacoes.forEach(a=>{
        if(!a||!a.id||ids.has(a.id))return;
        if(!a.legado&&(!a.resultado||!Array.isArray(a.resultado.doms)||a.resultado.doms.length!==DOMINIOS.length||!a.ctx||!a.resp||!Array.isArray(a.acoes)))return;
        lista.push(a);ids.add(a.id);novos++;
      });
      lista.sort((x,y)=>(y.criadoEm||0)-(x.criadoEm||0));
      salvarLista();renderHistorico();aviso(novos+" avaliação(ões) importada(s).");
    }catch(e){aviso("Arquivo inválido. Use um backup gerado por este aplicativo.")}
  };
  rd.readAsText(arq);
}

function renderPainel(){
  const L=lista.filter(a=>!a.legado);
  const v=$("#v-painel");
  if(!L.length){v.innerHTML=`<div class="card"><h2>Painel</h2><p class="mut">Finalize avaliações para ver o painel.</p></div>`;return}
  // última avaliação de cada atividade+local
  const ult=new Map();
  L.slice().sort((a,b)=>a.criadoEm-b.criadoEm).forEach(a=>ult.set(norm(a.ctx.atividade)+"|"+norm(a.ctx.local)+"|"+(norm(a.ctx.atividade)?"":a.id),a));
  const U=[...ult.values()];
  const dist=[0,0,0,0,0];U.forEach(a=>dist[a.resultado.pior===null?4:a.resultado.pior]++);
  const hoje=hojeISO();
  const todas=L.flatMap(a=>a.acoes.map((x,i)=>({a,x,i})));
  const abertas=todas.filter(t=>t.x.status!=="Concluída");
  const atrasadas=abertas.filter(t=>t.x.prazo&&t.x.prazo<hoje);
  const porDom=DOMINIOS.map((d,i)=>{const c=[0,0,0,0,0];U.forEach(a=>{const r=a.resultado.doms[i];c[r.nivel===null?4:r.nivel]++});return {d,c}});
  const stack=c=>`<div class="stack">${[0,1,2,3,4].map(n=>c[n]?`<i style="flex:${c[n]};background:${n===4?"var(--nd)":`var(--n${n})`}" title="${n===4?"Insuficiente":NIVEIS[n].curto}: ${c[n]}"></i>`:"").join("")}</div>`;
  v.innerHTML=`
  <div class="card"><h2>Painel</h2><small>Considera a avaliação mais recente de cada atividade/local.</small>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><strong>${U.length}</strong>atividades avaliadas</div>
      <div class="kpi"><strong style="color:var(--n3)">${dist[3]}</strong>com domínio crítico</div>
      <div class="kpi"><strong>${abertas.length}</strong>ações em aberto</div>
      <div class="kpi"><strong style="color:${atrasadas.length?"var(--n3)":"inherit"}">${atrasadas.length}</strong>ações atrasadas</div>
    </div></div>
  <div class="card"><h3>Nível por domínio</h3>
    ${porDom.map(p=>`<div style="margin:10px 0"><div class="linha" style="justify-content:space-between"><span>${p.d.ico} <b>${esc(p.d.nome)}</b></span><small>${p.c.slice(0,4).map((n,i)=>n?`${NIVEIS[i].curto}: ${n}`:"").filter(Boolean).join(" · ")||"—"}</small></div>${stack(p.c)}</div>`).join("")}
    <div class="leg"><span><i style="background:var(--n0)"></i>Baixa</span><span><i style="background:var(--n1)"></i>Moderada</span><span><i style="background:var(--n2)"></i>Alta</span><span><i style="background:var(--n3)"></i>Crítica</span><span><i style="background:var(--nd)"></i>Insuficiente</span></div></div>
  <div class="card"><h3>Ações atrasadas</h3>
    ${atrasadas.length?atrasadas.sort((p,q)=>p.x.prazo.localeCompare(q.x.prazo)).slice(0,10).map(t=>`<div class="sug"><span>${esc(t.x.acao.slice(0,100))}<br><small>${esc(t.a.ctx.atividade)} · ${esc(t.x.resp||"sem responsável")} · prazo ${esc(fmtData(t.x.prazo))}</small></span><button class="btn sec peq" data-acao="abrir" data-id="${esc(t.a.id)}">Abrir</button></div>`).join(""):'<p class="mut">Nenhuma ação atrasada.</p>'}</div>`;
}

/* =====================================================================
   SOBRE O MÉTODO
   ===================================================================== */
function renderSobre(){
  $("#v-sobre").innerHTML=`
  <div class="card"><h2>Sobre o método</h2>
    <p>O ErgoContexto é uma ferramenta de <b>triagem</b>: identifica onde olhar primeiro e qual o próximo passo. Não constitui AET, laudo ergonômico, avaliação quantitativa ou avaliação especializada, e não declara conformidade legal.</p>
    <h3>Por que dois lados, em 5 domínios?</h3>
    <p>Ergonomia e fatores humanos respondem a perguntas diferentes. A <b>ergonomia</b> pergunta o que a atividade exige do corpo e da mente e se isso pode causar adoecimento. Os <b>fatores humanos</b> perguntam o que, no sistema, torna o desempenho confiável ou propenso a erro. Por isso o resultado é um perfil de 5 domínios, sem nota total que misture coisas incomparáveis.</p>
    <table><thead><tr><th>Domínio</th><th>Grupo</th><th>Referências</th></tr></thead><tbody>
    ${DOMINIOS.map(d=>`<tr><td>${d.ico} <b>${esc(d.nome)}</b></td><td>${esc(GRUPOS[d.grupo])}</td><td>${esc(d.ref)}</td></tr>`).join("")}
    </tbody></table>
  </div>
  <div class="card"><h3>Como a pontuação funciona</h3>
    <ul>
      <li>Cada item tem 4 níveis com critério objetivo: Adequado (0), Baixa (1), Moderada (2), Alta (3).</li>
      <li>Itens marcados como <i>não avaliado</i> ficam fora da média. Se menos da metade dos itens de um domínio foi avaliada, o domínio aparece como <b>dados insuficientes</b>.</li>
      <li>Nível do domínio pela média dos itens: <b>Baixa</b> até 0,49 · <b>Moderada</b> 0,50 a 1,49 · <b>Alta</b> 1,50 a 2,24 · <b>Crítica</b> a partir de 2,25.</li>
      <li><b>Regra anti-diluição:</b> um item em nível Alta garante ao menos nível Alta ao domínio, e três itens Altos garantem Crítica. Assim um problema grave não some na média.</li>
      <li><b>Prioridade sugerida:</b> vem do domínio mais crítico. Se a gravidade potencial de uma falha é Grave ou Muito grave e algum domínio de fatores humanos está em Alta ou Crítica, a prioridade sobe um nível.</li>
      <li>Cada domínio indica o próximo passo na lógica <b>SOBANE</b> (Déparis → Observação → Análise → Perícia) e os métodos para aprofundar.</li>
    </ul>
    <h3>Limites</h3>
    <p>Os critérios são versões simplificadas, inspiradas na literatura. Não herdam a validade dos instrumentos completos (RULA, REBA, NIOSH, OCRA, NASA-TLX, COPSOQ etc.). Valores quantitativos de ruído, calor, vibração e iluminação exigem medição. A percepção dos trabalhadores e os fatores de proteção entram como contexto e não alteram a pontuação.</p>
    <h3>Análise por IA</h3>
    <p>A IA lê o perfil e as observações e sugere pontos de atenção, perguntas e ações. Ela não altera pontuação nem classificação, não avalia o trabalhador e toda sugestão precisa ser validada pelo avaliador.</p>
    <p><small>Modelo v${VERSAO_MODELO}</small></p>
  </div>`;
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("#nav button");
  if(nav){irPara(nav.dataset.v);return}
  const b=e.target.closest("[data-acao]");if(!b)return;
  const id=b.dataset.id;
  switch(b.dataset.acao){
    case "passo":irPasso(Number(b.dataset.i));break;
    case "avancar":irPasso(estado.passo+1);break;
    case "voltar":irPasso(estado.passo-1);break;
    case "finalizar":finalizar();break;
    case "rmfoto":estado.foto="";$("#fotoBox").innerHTML="";agendarSalvar();break;
    case "nova-acao":novaAcao();render();window.scrollTo(0,document.body.scrollHeight);agendarSalvar();break;
    case "rm-acao":estado.acoes.splice(Number(b.dataset.i),1);render();agendarSalvar();break;
    case "acao-de-item":{const q=ITENS[b.dataset.q];novaAcao({dom:q.dom,origem:q.id,prio:valorItem(estado.resp,q.id)===3?"Alta":"Média"});render();window.scrollTo(0,document.body.scrollHeight);agendarSalvar();break}
    case "retomar":{const r=lerJSON(CH_RASC,null);if(r){estado=r;estado.fase="wizard";render()}break}
    case "descartar":try{localStorage.removeItem(CH_RASC)}catch(_){}renderBanner();break;
    case "imprimir":window.print();break;
    case "editar":estado.fase="wizard";estado.passo=0;render();window.scrollTo(0,0);break;
    case "nova":if(confirm("Iniciar uma nova avaliação em branco?")){estado=novoEstado();render();window.scrollTo(0,0)}break;
    case "ia":analisarIA();break;
    case "ia-para-plano":iaParaPlano();break;
    case "abrir":{const a=lista.find(x=>x.id===id);if(a)carregarParaEstado(a,"resultado");break}
    case "editar-h":{const a=lista.find(x=>x.id===id);if(a)carregarParaEstado(a,"wizard");break}
    case "reavaliar":{const a=lista.find(x=>x.id===id);if(a){const c={...a.ctx,data:hojeISO()};estado=novoEstado(c);estado.foto="";irPara("avaliar")}break}
    case "del":if(confirm("Excluir esta avaliação?")){lista=lista.filter(x=>x.id!==id);salvarLista();renderHistorico()}break;
    case "limpar":if(confirm("Apagar TODAS as avaliações deste aparelho? Faça backup antes.")){lista=[];salvarLista();renderHistorico()}break;
    case "exp-json":exportar("json");break;
    case "exp-csv-av":exportar("av");break;
    case "exp-csv-ac":exportar("ac");break;
    case "imp-json":$("#impArq").click();break;
  }
});

$("#palco").addEventListener("change",e=>{

    return;
  }
  onCampo(e);
});
